name: Geraete- und Preisradar

# WARUM DIESER LAUF EIGEN IST
# ---------------------------
# medimax.de und ep.de erlauben Abrufe laut ihrer eigenen robots.txt nur
# zwischen 02:00 und 08:00 UTC:
#
#     Request-rate: 1/10
#     Crawl-delay: 10
#     Visit-time: 0200-0800
#
# Der Wochenlauf ("Telco Radar Run") startet um 08:30 UTC - also ausserhalb.
# Dort werden diese Anbieter uebersprungen (und dabei ausdruecklich NICHT
# gealtert, sonst schoebe jeder Tageslauf ihre Geraete Richtung
# "ausgelistet"). Dieser Lauf holt sie nach.
#
# Er ist bewusst UNABHAENGIG vom Wochenlauf: er fasst weder den Seen-Store
# noch die Berichte an und er ruft kein Modell.
#
# SEIT DEM 04.09.2026 RENDERT ER DIE WEBSITE.
# Vorher tat er das nicht, mit der Begruendung "die Seite entsteht beim
# naechsten regulaeren Lauf aus diesem Stand". Das war die Luecke: der
# regulaere Lauf ist Mi und Fr, dieser hier laeuft taeglich - ein Ergebnis
# der Nacht zum Samstag stand also bis Mittwoch nicht auf der Seite.
# Gemessen am 03.09.2026: der Crawllauf schrieb 491 Listungen, darunter
# erstmals 134 congstar-Zeilen und 67 o2-Zeilen mit vollstaendigen
# Ratenfeldern - und live war davon nichts zu sehen, weil der letzte Build
# vom Nachmittag stammte. Dieselbe Fehlerklasse wie der Navigationseintrag
# am 11.08.: gebaut, geprueft, committet und fuer jeden Leser nicht da.
#
# Das Rendern fasst kein Netz an und kein Modell (`render_site` ist rein
# lesend, CLAUDE.md § 6) - es kostet also nichts ausser Rechenzeit. Der
# Push auf `main` loest `deploy.yml` aus, das den Render-Hook curlt.
#
# Es steht NACH dem Commit des Bestands, und das ist die Lehre aus Lauf
# 31422689829: eine Stufe vor dem Veroeffentlichen kann den ganzen Lauf
# kosten. Ein Messtag ist nicht nachholbar, ein Seitenaufbau schon.

on:
  schedule:
    # 02:17 UTC, taeglich - NICHT 03:10 (geaendert 22.09.2026, P1).
    #
    # Der Termin ist eine Bitte, kein Versprechen: GitHub startet geplante
    # Laeufe verspaetet, wenn die Warteschlange voll ist. An elf gemessenen
    # Tagen lag dieser Lauf zwischen 4 h 41 und 5 h 40 hinter seinem
    # Termin und startete damit zwischen 07:51 und 08:50 UTC - also fast
    # immer HINTER dem Besuchsfenster 02:00-08:00, fuer das dieser
    # Workflow ueberhaupt existiert. Das ist der Grund, warum medimax.de
    # und ep.de nur an einer Handvoll Tage Daten haben: an genau den
    # Tagen, an denen der Lauf ausnahmsweise vor 08:00 begann.
    #
    # 02:17 ist so gewaehlt, dass der gemessene Verzug den START ins
    # Fenster legt: ohne Verzug 02:17, mit dem groessten gemessenen
    # Verzug 07:57. Die krumme Minute meidet zusaetzlich die volle
    # Stunde, zu der halb GitHub seine Cronjobs startet.
    #
    # DER TERMIN ALLEIN REICHT NICHT, und das steht hier, damit es
    # niemand fuer erledigt haelt: der Lauf crawlt nach dem Start noch
    # bis zu `--frist` Sekunden weiter, und medimax/ep kommen erst an
    # Position 4 und 5 der Anbieterreihenfolge. Verzug (340 min) plus
    # Crawlfrist (25 min) sind 365 min - breiter als das Fenster selbst
    # (360 min). Es gibt also KEINEN Cron-Wert, der allein garantiert,
    # dass auch der letzte Abruf noch vor 08:00 liegt.
    #
    # Getragen wird die Zusage deshalb vom Code, nicht von diesem
    # Termin: die Fensterpruefung gilt je Abruf - in der Sammelphase
    # (`collect/geraete/__init__.py`, `Abrufschleuse`) ebenso wie in den
    # Nachbearbeitungs-Haken danach (`nachsammle_buendel`) -, und die
    # Sammelfrist wird gegen das Fensterende gedeckelt. Wer hier etwas
    # verschiebt, prueft beides mit.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      frist:
        description: "Zeitbudget der Sammelphase in Sekunden"
        required: false
        default: "1500"

permissions:
  contents: write

concurrency:
  # Nicht dieselbe Gruppe wie `radar`: die zwei Laeufe schreiben verschiedene
  # Dateien und duerfen sich nicht gegenseitig abwuergen. Aber zwei
  # Geraetelaeufe gleichzeitig waeren zwei Collector gegen dieselbe Domain -
  # effektiv der halbe Abstand und damit ein Bruch der Crawl-delay.
  group: geraete
  cancel-in-progress: false

jobs:
  geraete:
    runs-on: ubuntu-latest
    # Grosszuegig, weil die Bremse hier nicht die Rechenzeit ist, sondern die
    # Crawl-delay: zehn Sekunden je Abruf mal zwanzig Produktseiten sind
    # allein fuer einen Haendler mehr als drei Minuten.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Wie im Hauptlauf: ohne volle Historie haelt der Rebase unten jede
          # Datei fuer neu und bricht mit "CONFLICT (add/add)" ab.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run geraete stage
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m telco_radar.geraete_pipeline --root . \
            --frist "${{ github.event.inputs.frist || 1500 }}" \
            2>&1 | tee geraete.log

      - name: Upload log
        # IMMER, nicht nur bei Fehlschlag - dieselbe Lehre wie beim
        # Pipeline-Log: ein gruener Lauf kann eine halb tote Quelle verdecken,
        # und ohne das Log ist hinterher nicht zu beantworten, ob eine Quelle
        # nichts FAND oder ob sie SCHEITERTE.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geraeteradar-log-${{ github.run_id }}
          path: geraete.log
          if-no-files-found: warn

      # ERST DER MESSWERT, DANN DIE SEITE - und zwar in zwei Schritten mit
      # zwei Commits.
      #
      # Die erste Fassung dieser Aenderung renderte VOR dem Commit. Das ist
      # genau der Aufbau, an dem Lauf 31422689829 gescheitert ist: die
      # Nebenstufe lag vor dem Veroeffentlichen, sie fiel aus, und von 45
      # erfolgreichen Minuten wurde nichts committet. `render_site` laeuft
      # ueber das GANZE Portal - Promo, Tarife, Lieferzeit, Newsletter,
      # Uebersetzung -, und nur der Geraeteteil ist dort in ein try/except
      # gehuellt. Ein Messtag einer Zeitreihe ist nicht nachholbar; eine
      # nicht neu gebaute Seite ist es sehr wohl (der naechste Lauf holt sie
      # nach). Also wird der Bestand zuerst gesichert.
      - name: Commit state
        run: |
          git config user.name "telco-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          # Gezielt nur die Dateien dieser Stufe (Bestand, Preise, TCO plus
          # die drei bedingten: TCO-Historie, Auto-Katalog, unbekannte
          # Titel/Farben). Kein `git add data/`: dieser Lauf hat mit dem
          # Seen-Store und den Berichten nichts zu tun, und ein weiter
          # Pfad wuerde fremde Aenderungen mitnehmen. Die Config
          # (config/geraete_katalog.yaml) gehoert NICHT hierher: Auto-
          # Eintraege leben im STATE (geraete_katalog_auto.json), die
          # Config bleibt Hand-Pflege - ein Lauf, der in die Config
          # schriebe, mischte seine Zeilen unter die gepflegten.
          #
          # `geraete_tco.json` steht seit dem 04.09.2026 dabei. Ohne diese
          # Zeile schriebe der Lauf die SIM-only-Referenzen zwar in den
          # Runner - die Seite entstuende also richtig -, aber die Datei
          # selbst kaeme nie im Repo an. Solange die Referenzen abgeleitet
          # sind, faellt das nicht auf; sobald ein Adapter BUENDEL liefert
          # (Phase 4), waere jede Nacht die Messung der vorigen weg.
          git add data/state/geraete_db.json data/state/geraete_preise.jsonl \
                  data/state/geraete_tco.json
          if [ -f data/state/geraete_tco_historie.jsonl ]; then
            # Die Buendel-Preishistorie (P2, 11.09.2026) kann kein spaeterer
            # Lauf neu erzeugen und wird deshalb mitgesichert. Fehlt die
            # Datei noch (erste Nacht ohne Buendel), darf das Add sie nicht
            # scheitern lassen und die drei oben mitziehen.
            git add data/state/geraete_tco_historie.jsonl
          fi
          if [ -f data/state/geraete_katalog_auto.json ]; then
            # E4-Auto-Erkennung (17.09.2026): der Auto-Katalog und die
            # Zaehlung unbekannter Titel/Farben sind STATE. Ohne diese
            # Zeile schriebe der Lauf sie in den Runner, der naechste
            # Checkout finge ohne sie an - gleiche Fehlerklasse wie der
            # TCO-Fund oben: Messung geschrieben, nie angekommen.
            git add data/state/geraete_katalog_auto.json
          fi
          if [ -f data/state/geraete_unbekannt.jsonl ]; then
            git add data/state/geraete_unbekannt.jsonl
          fi
          if git diff --cached --quiet; then
            echo "Keine Aenderung am Geraetebestand."
            exit 0
          fi
          git commit -m "geraeteradar: Stand $(date -u +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "Push fehlgeschlagen, Versuch $i"
            sleep $((2 ** i))
          done
          exit 1

      - name: Render site
        # OHNE `continue-on-error` (P0-B, 21.09.2026). Bis hierher hiess die
        # Begruendung: der Bestand ist oben schon committet, ein Fehler
        # kostet einen Seitenaufbau, keinen Messtag. Das erste stimmt weiter
        # - "Commit state" steht davor, der Messtag ist gesichert. Das
        # zweite war der Fehler: ein gescheitertes `render_site()` lief
        # weiter in "Commit site" und in den Render-Hook, und der Lauf
        # endete GRUEN. Die Seite blieb auf dem Stand des Vortags, ohne dass
        # es irgendwo stand - dieselbe Klasse wie der Navigationseintrag vom
        # 11.08.: gebaut, geprueft, committet und fuer jeden Leser nicht da.
        # Ein Renderfehler ist ab jetzt ein roter Lauf. Er kostet nur noch
        # den Seitenaufbau, aber er kostet ihn SICHTBAR.
        env:
          PYTHONPATH: src
        # MIT `cfg`, nie ohne: `render_site(site, reports)` ohne den dritten
        # Parameter rendert stillschweigend eine halbe Seite - transparenz.html
        # verliert den Quellenbestand, wettbewerb.html den halben Inhalt, und
        # zwar ohne Fehler und ohne Warnung (CLAUDE.md § 6).
        run: |
          python -c "
          from pathlib import Path
          from telco_radar.config import load_config
          from telco_radar.report.html import render_site
          root = Path('.')
          render_site(root / 'site', root / 'data' / 'reports', load_config(root))
          print('site gerendert')
          "

      - name: Commit site
        # Ebenfalls ohne `continue-on-error` (P0-B, 21.09.2026). Der
        # Aufgeben-Weg dieses Schritts endet selbst mit exit 0 und der
        # Zeile "Seite konnte nicht gepusht werden" - ein verlorenes Rennen
        # gegen einen anderen Lauf bleibt also weiterhin gruen, und das ist
        # richtig so. Was `continue-on-error` zusaetzlich verschluckt hat,
        # ist alles UNERWARTETE: ein fehlgeschlagenes `git add`, ein
        # kaputter Index, ein Fehler im Neuaufbau. Genau das soll auffallen.
        run: |
          git config user.name "telco-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "Keine Aenderung an der Seite."
            exit 0
          fi
          git commit -m "geraeteradar: Seite neu gebaut $(date -u +%Y-%m-%d)"
          BRANCH="${GITHUB_REF_NAME}"
          # Bei einem Rebase-Konflikt auf generiertem HTML wird NICHT
          # zusammengefuehrt, sondern neu gebaut: `site/` ist Ausgabe, kein
          # Quelltext, und "ours"/"theirs" waere hier eine halbe Seite aus
          # zwei Laeufen. Der Rebase wird abgebrochen und der Versuch mit dem
          # frischen Stand wiederholt.
          for i in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort || true
            git reset --hard "origin/$BRANCH"
            python -c "
          from pathlib import Path
          from telco_radar.config import load_config
          from telco_radar.report.html import render_site
          root = Path('.')
          render_site(root / 'site', root / 'data' / 'reports', load_config(root))
          " || { echo "Neuaufbau nach dem Zuruecksetzen gescheitert"; exit 1; }
            git add site
            git diff --cached --quiet && exit 0
            git commit -m "geraeteradar: Seite neu gebaut $(date -u +%Y-%m-%d)"
            echo "Push fehlgeschlagen, Versuch $i - Seite neu gebaut"
            sleep $((2 ** i))
          done
          echo "Seite konnte nicht gepusht werden; der Bestand ist oben gesichert."

      # Der Push oben loest KEINEN Deploy aus - und das ist kein Verdacht,
      # sondern gemessen: `deploy.yml` lief zuletzt um 00:58 UTC fuer den
      # letzten Push von Hand, die zwei Commits dieses Laufs kamen um 01:03
      # UTC, und danach steht in der Lauf-Liste nichts mehr. Live stand
      # deshalb am Morgen des 04.09.2026 der Stand von 4f9dacb (02:25 CEST),
      # waehrend `95fa07f` (03:03 CEST) im Repo lag.
      #
      # Der Grund ist eine Regel von GitHub, keine Fehlkonfiguration: ein
      # Push mit dem voreingestellten `GITHUB_TOKEN` startet keine weiteren
      # Workflows (Schleifenschutz). `radar.yml` weiss das laengst und curlt
      # den Hook selbst; dieser Lauf hat sein `site/` erst seit dem
      # 04.09.2026 (Phase 6a) im Gepaeck und hat die Zeile nie bekommen.
      # Ohne sie ist der naechtliche Seitenaufbau dieselbe Fehlerklasse wie
      # der Navigationseintrag am 11.08.: gebaut, geprueft, committet - und
      # fuer jeden Leser nicht da.
      - name: Trigger Render deploy
        continue-on-error: true
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set - skipping"; exit 0
          fi
          sleep 15  # Render klont sofort; der Push braucht den Vorlauf
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK")
            # 202 = "Accepted": angenommen und asynchron gefahren. Ohne
            # diesen Fall stiess die Schleife fuenf Deploys an fuer einen
            # Hook, der beim ersten Mal richtig geantwortet hatte.
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "202" ]; then
              echo "Render deploy triggered (HTTP $code)"; exit 0
            fi
            echo "Render hook returned HTTP $code (attempt $attempt/5) - retrying in 30s"
            sleep 30
          done
          echo "Render hook nicht erreichbar - die Seite liegt im Repo, nur nicht live."

      # DER ABDECKUNGSWAECHTER MELDET SICH (P1/C2, 22.09.2026).
      #
      # Er steht GANZ AM ENDE, hinter Bestand, Seite und Deploy-Hook, und
      # das ist dieselbe Reihenfolge-Lehre wie bei "Commit state": ein
      # Mailserver, der nicht antwortet, darf keinen Messtag und keine
      # Seite kosten. Die Alarme selbst sind zu diesem Zeitpunkt laengst
      # im Bestand - der Schritt rechnet nichts nach, er liest
      # `GeraeteDB.ausfall_alarme()`, dieselbe Funktion, die Lauf und
      # Quellenseite lesen.
      #
      # OHNE `continue-on-error`: ein Alarmkanal, der still nicht
      # zustellt, ist genau die Fehlerklasse, gegen die dieser Waechter
      # gebaut ist ("50 Laeufe gruen, sechs Tage ohne Telekom-Zeile").
      # Fehlen die SMTP-Secrets, faellt der Schritt rot aus und sagt
      # warum. Ohne Alarm geht keine Mail hinaus - eine taegliche "alles
      # in Ordnung"-Mail ist nach zwei Wochen ein Postfachfilter.
      #
      # Die Zugangsdaten stehen NUR hier in der Umgebung: die Sammelstufe,
      # die gegen fremde Hosts spricht, sieht sie nie.
      #
      # `if: always()` - und das ist keine Kosmetik: ohne diese Zeile fiele
      # die Abdeckungsmail genau an dem Tag aus, an dem ein Schritt davor
      # scheitert. Das ist der Tag, an dem sie am noetigsten ist. Der
      # Schritt liest nur den Bestand; scheitert er selbst (kein Messtag,
      # Zustellfehler), faellt der Job weiterhin rot aus.
      - name: Abdeckungsalarme melden
        if: always()
        env:
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/geraete_abdeckung_mail.py --root .
