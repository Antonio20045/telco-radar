# Wegwerf-Workflow: EIN Testversand ueber die Brevo-HTTP-API.
#
# Zweck ist genau eine Frage, und sie entscheidet ueber das ganze Vorhaben:
# Landet die Mail im FIRMENpostfach im Posteingang oder im Spam? Ohne eigene
# Domain fehlt das DMARC-Alignment (Brevo signiert mit eigenem DKIM, im From:
# steht eine Gmail-Adresse), und Konzern-Gateways behandeln nicht
# ausgerichtete Freemail-Absender mit Massenversandmuster strenger als Gmail.
#
# Nach dem Eintragen des Ergebnisses in docs/mail-setup.md Abschnitt 4:
# DIESEN WORKFLOW LOESCHEN. Er nimmt beliebige Empfaengeradressen entgegen
# und ist damit ein Versandwerkzeug - im Dauerbetrieb hat er nichts zu suchen.
name: Mail-Testversand (Wegwerf)

on:
  workflow_dispatch:
    inputs:
      freemail_to:
        description: "Zieladresse bei einem Freemail-Anbieter"
        required: true
      unternehmen_to:
        description: "Zieladresse in einem Firmenpostfach"
        required: true

permissions:
  contents: read

jobs:
  testversand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Empfaenger maskieren
        # Vor dem ersten Gebrauch. Eine Adresse in einem Actions-Log ist
        # oeffentlich, sobald das Repo es ist - und dieses ist es.
        run: |
          echo "::add-mask::${{ inputs.freemail_to }}"
          echo "::add-mask::${{ inputs.unternehmen_to }}"

      - name: Key vorhanden und gueltig?
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -z "$BREVO_API_KEY" ]; then
            echo "::error::Secret BREVO_API_KEY fehlt."
            exit 1
          fi
          code=$(curl -sS -o /tmp/konto.json -w '%{http_code}' \
            -H "api-key: $BREVO_API_KEY" https://api.brevo.com/v3/account)
          echo "GET /v3/account -> HTTP $code"
          if [ "$code" = "401" ]; then
            echo "::error::HTTP 401. Erste Ursache: Brevo-Keys verfallen nach 90 Tagen ohne Nutzung (docs/mail-setup.md 3.2)."
            exit 1
          fi
          [ "$code" = "200" ] || { cat /tmp/konto.json; exit 1; }
          python3 - <<'PY'
          import json, sys
          konto = json.load(open("/tmp/konto.json"))
          plan = konto.get("plan") or []
          for p in plan:
              print("Plan:", p.get("type"), "Kontingent:", p.get("credits"))
          PY

      - name: Testmail an beide Postfaecher
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FREEMAIL_TO: ${{ inputs.freemail_to }}
          UNTERNEHMEN_TO: ${{ inputs.unternehmen_to }}
        run: python3 .github/scripts/mail_test.py

      - name: Events-API - kommt etwas zurueck?
        # bounce_sync.yml (N6) haengt vollstaendig an diesem Endpunkt. Wenn er
        # fuer einen frischen Versand nichts liefert, ist die Bounce-Erkennung
        # blind, und das faellt sonst erst auf, wenn die Reputation schon
        # gelitten hat. Ereignisse koennen ein paar Sekunden brauchen.
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          sleep 30
          code=$(curl -sS -o /tmp/events.json -w '%{http_code}' \
            -H "api-key: $BREVO_API_KEY" \
            "https://api.brevo.com/v3/smtp/statistics/events?limit=20")
          echo "GET /v3/smtp/statistics/events -> HTTP $code"
          python3 - <<'PY'
          import json, sys
          try:
              daten = json.load(open("/tmp/events.json"))
          except Exception as exc:
              print("nicht lesbar:", exc); raise SystemExit(1)
          events = daten.get("events") or []
          print(f"{len(events)} Ereignis(se). Nur die Typen, keine Adressen:")
          from collections import Counter
          for typ, n in Counter(e.get("event") for e in events).items():
              print(f"  {typ}: {n}")
          PY

      - name: Was jetzt zu tun ist
        if: always()
        run: |
          cat <<'TEXT'
          ------------------------------------------------------------------
          In BEIDEN Postfaechern nachsehen und docs/mail-setup.md Abschnitt 4
          ausfuellen - auch wenn das Ergebnis schlecht ist:

            1. Posteingang oder Spam? (die Firmenzeile ist die wichtige)
            2. Kopfzeilen anzeigen, Zeile "Authentication-Results" kopieren:
               spf=... dkim=... dmarc=...
               Erwartet wird dmarc=fail oder none - siehe mail-setup.md 3.3.
            3. Danach DIESEN WORKFLOW LOESCHEN.
          ------------------------------------------------------------------
          TEXT
