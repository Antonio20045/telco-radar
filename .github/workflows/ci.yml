name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: read

jobs:
  test-shard:
    name: test (Teil ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install poppler-utils for the PDF tests
        run: |
          command -v pdftoppm >/dev/null \
            || sudo apt-get install -y --no-install-recommends poppler-utils \
            || (sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils)
      # Ohne diesen Schritt ueberspringt sich tests/test_falz_browser.py, und
      # zwar lautlos - ein Skip sieht im Protokoll aus wie ein Erfolg. Genau
      # dieser Test misst, ob die Schlagzeile der Ausgabe ohne Scrollen
      # dasteht (1440x900 und 390x844); er gehoert auf die Maschine, die
      # Merges absichert. Nur Chromium, ohne --with-deps: die Messung laeuft
      # headless gegen 127.0.0.1 und braucht weder Netz noch Systempakete.
      - name: Install Chromium for the browser tests
        run: playwright install chromium
      - name: Run tests (Teil ${{ matrix.shard }}/8)
        env:
          PYTHONPATH: src
        run: |
          set +e
          pytest -q -n auto -rs --splits 8 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration --durations-path .test_durations \
            --store-durations --clean-durations \
            | tee pytest-ausgabe.txt
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 15 pytest-ausgabe.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Gemessene Zeiten dieses Teils; die Teile lassen sich zu einer neuen
          # .test_durations zusammenfuegen (siehe docs/betrieb.md).
          cp .test_durations "durations-teil-${{ matrix.shard }}.json"
          exit "$status"
      - name: Zeiten dieses Teils ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-teil-${{ matrix.shard }}
          path: durations-teil-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: test
    needs: [test-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Alle Teile grün?
        if: needs.test-shard.result != 'success'
        run: |
          echo "Teil-Ergebnis: ${{ needs.test-shard.result }}"
          exit 1
