name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install poppler-utils for the PDF tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # Ohne diesen Schritt ueberspringt sich tests/test_falz_browser.py, und
      # zwar lautlos - ein Skip sieht im Protokoll aus wie ein Erfolg. Genau
      # dieser Test misst, ob die Schlagzeile der Ausgabe ohne Scrollen
      # dasteht (1440x900 und 390x844); er gehoert auf die Maschine, die
      # Merges absichert. Nur Chromium, ohne --with-deps: die Messung laeuft
      # headless gegen 127.0.0.1 und braucht weder Netz noch Systempakete.
      - name: Install Chromium for the browser tests
        run: playwright install chromium
      - name: Kerne der Maschine
        run: |
          echo "nproc: $(nproc)"
          cat /proc/cpuinfo | grep -c processor
      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          set +e
          pytest -q -n auto -rs --durations=0 --store-durations --durations-path .test_durations --junitxml=junit-dauern.xml | tee pytest-ausgabe.txt
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 15 pytest-ausgabe.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Testdauern als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ github.run_id }}
          path: |
            .test_durations
            junit-dauern.xml
            pytest-ausgabe.txt
          if-no-files-found: warn
