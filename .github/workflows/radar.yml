name: Telco Radar Run

on:
  schedule:
    # Start early enough that the report is normally live before midday in
    # Germany, even when GitHub delays a scheduled run or NVIDIA is busy.
    - cron: "30 8 * * 2,5" # every Tuesday and Friday 08:30 UTC (~10:30 DE summer / 09:30 winter)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Only consider items newer than N days"
        required: false
        default: "8"
      sources_only:
        description: "Diagnostic only: run validate_sources.py + rescue_sources.py, no LLM/commit/deploy"
        required: false
        type: boolean
        default: false
      inspect_sources:
        description: "Diagnostic only: comma-separated operator names to DOM-dump via inspect_dom.py"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    # Headroom over the worst realistic case: collection ~2 min, analysts ~4 min,
    # and up to four LLM stages that each exhaust their 300s call budget before
    # giving up. Was 35, which killed runs #30 and #33 mid-pipeline.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # Ohne das klont checkout flach (depth 1). Der Commit-Schritt unten
          # rebast auf den Standard-Branch; ohne gemeinsame Historie haelt git
          # dann JEDE Datei fuer neu und bricht mit "CONFLICT (add/add)" ab.
          # Auf dem Standard-Branch faellt das nicht auf (dort ist HEAD schon
          # der Rebase-Zielpunkt), auf jedem anderen Branch schon: Lauf #63 hat
          # den fertigen Bericht deshalb erzeugt und dann verworfen.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pdftotext (poppler-utils) ist die einzige externe Binaerabhaengigkeit
      # dieses Projekts. Der Tarif-Extraktor braucht sie, und ihr Fehlen sieht
      # von aussen aus wie "keine Tarifdokumente gefunden": collect/tarif_pdf.py
      # wirft PDFNichtLesbar, der Sammler zaehlt das als Fehler und laeuft
      # weiter. Also lieber hier installieren als spaeter im Protokoll suchen.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Diagnose sources
        # Diagnostic-only dispatch: never touches the LLM, never commits, never
        # deploys. sources_only runs the health check + feed-rescue probe over
        # every source; inspect_sources DOM-dumps the named operators only.
        if: ${{ github.event.inputs.sources_only == 'true' || github.event.inputs.inspect_sources != '' }}
        env:
          PYTHONPATH: src
        run: |
          {
            if [ "${{ github.event.inputs.sources_only }}" = "true" ]; then
              # Sammelphase MESSEN, nicht nur pruefen. Lokal ist die Zahl
              # wertlos: die Sandbox hat kein Netz-Chromium (alle
              # newsroom_js-Quellen fallen dort sofort durch) und eine andere
              # Anbindung. Der Vergleich "alte Einstellung / neue Einstellung"
              # gehoert deshalb in genau die Umgebung, in der der Lauf spaeter
              # stattfindet - und diese Diagnose fasst weder State noch LLM an.
              echo "### miss_sammelphase.py (Drosselung: vorher/nachher)"
              echo '```text'
              python scripts/miss_sammelphase.py --vergleich 8:1000:0 64:2:0.5
              echo '```'
              echo "### validate_sources.py"
              echo '```text'
              python scripts/validate_sources.py
              echo '```'
              echo "### rescue_sources.py (kind=official)"
              echo '```text'
              python scripts/rescue_sources.py
              echo '```'
            fi
            if [ -n "${{ github.event.inputs.inspect_sources }}" ]; then
              echo "### inspect_dom.py"
              echo '```text'
              python scripts/inspect_dom.py --names "${{ github.event.inputs.inspect_sources }}"
              echo '```'
            fi
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check LLM secret presence
        if: ${{ github.event.inputs.sources_only != 'true' && github.event.inputs.inspect_sources == '' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then echo "LLM_API_KEY is present"; else echo "LLM_API_KEY is missing"; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY fallback is present"; else echo "ANTHROPIC_API_KEY fallback is missing"; fi

      - name: Run pipeline
        if: ${{ github.event.inputs.sources_only != 'true' && github.event.inputs.inspect_sources == '' }}
        env:
          # If MOONSHOT_API_KEY is set, the pipeline uses Moonshot/Kimi
          # (OpenAI-compatible) automatically; otherwise it falls back to Anthropic.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          # Push statt Pull (src/telco_radar/versand.py). Fehlen diese
          # Secrets, verschickt der Lauf nichts und schreibt den Grund ins
          # Laufprotokoll - er scheitert deswegen nicht. Genau deshalb stehen
          # sie hier ohne Bedingung: ein leeres Secret ist ein leerer String,
          # und den erkennt versand.py.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m telco_radar.pipeline --root . \
            --lookback-days "${{ github.event.inputs.lookback_days || 8 }}" \
            2>&1 | tee pipeline.log

      - name: Expose pipeline failure details
        # cancelled() matters: a job killed by timeout-minutes is "cancelled",
        # not "failed". With if: failure() alone, runs #30 and #33 skipped this
        # step and left no diagnostics at all.
        if: failure() || cancelled()
        run: |
          {
            echo "### Telco Radar pipeline failure"
            echo
            echo '```text'
            tail -300 pipeline.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pipeline log
        # IMMER, nicht nur bei Fehlschlag. Nach Lauf #83 liess sich nicht
        # beantworten, warum Telekoms fuenf Aktionsseiten kein einziges
        # Angebot ergaben - geliefert hatten sie Text (jede Seite hatte einen
        # eigenen, nicht-leeren Snapshot-Hash), aber ob die Extraktion nichts
        # FAND oder ob sie SCHEITERTE, stand nur im Log eines erfolgreichen
        # Laufs. Und das wurde nicht aufbewahrt. Ein erfolgreicher Lauf kann
        # eine halb tote Quelle verdecken; genau dafuer ist das Log da.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telco-radar-pipeline-log-${{ github.run_id }}
          path: pipeline.log
          if-no-files-found: warn

      - name: Commit state, report and site
        if: ${{ github.event.inputs.sources_only != 'true' && github.event.inputs.inspect_sources == '' }}
        run: |
          git config user.name "telco-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "radar: run $(date -u +%F)"
            # Rebase onto any commits pushed while the run was in flight, then push.
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "pushed"
                pushed=1
                break
              fi
              git rebase --abort || true
              echo "push rejected (attempt $attempt) - retrying"; sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Could not push the completed report; refusing to deploy stale content."
              exit 1
            fi
          fi

      - name: Trigger Render deploy
        if: ${{ success() && github.event.inputs.sources_only != 'true' && github.event.inputs.inspect_sources == '' }}
        continue-on-error: true   # a transient Render hiccup must not red-fail the run
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set - skipping"; exit 0
          fi
          sleep 15  # let the git push propagate before Render clones
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK")
            # 202 = "Accepted": Render hat den Deploy angenommen und faehrt
            # ihn asynchron. Ohne diesen Fall lief die Schleife fuenfmal
            # durch und stiess dabei fuenf Deploys an - fuer einen Hook, der
            # beim ersten Mal richtig geantwortet hatte.
            if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "202" ]; then
              echo "Render deploy triggered (HTTP $code)"; exit 0
            fi
            echo "Render hook returned HTTP $code (attempt $attempt/5) - retrying in 30s"
            sleep 30
          done
          echo "Render hook still failing - latest commit is pushed; Render will pick it up on its next deploy"
