# =============================================================================
# TELCO RADAR - Firmenliste fuer die mechanische Breitensuche
# =============================================================================
# Eingabe fuer `scripts/finde_quellen.py --firmen`. Hier steht NUR, WO gesucht
# wird - Name und Domain. Ob es dort eine brauchbare Quelle gibt, entscheidet
# die Suche (liefert die Adresse ueberhaupt einen Feed?) und danach allein
# scripts/pruefe_quellenvorschlag.py. Eine Zeile hier ist also keine Aussage
# ueber die Qualitaet einer Quelle, sondern ein Suchauftrag.
#
# Deshalb darf diese Liste auch Fehlgriffe enthalten: eine Domain ohne Feed
# kostet ein paar Abrufe und faellt aus der Kandidatenliste, bevor sie
# irgendwo eingetragen wird. Was NICHT passieren darf, ist der umgekehrte
# Fehler - eine Quelle in die Watchlist zu schreiben, die nie durch den
# Abnahme-Check gelaufen ist.
#
# KEINE QUOTEN. Der Auftrag verbietet ausdruecklich, die Mischung vorab
# festzulegen (AUFTRAG_SKALIERUNG_1000.md Abschnitt 4 und 9). Die Kategorien
# unten sind das Suchinventar aus dem Auftrag - eine Liste von Fundorten,
# damit keine vergessen wird, nicht eine Zielverteilung. Welche davon taugt,
# entscheidet die Trefferquote (scripts/quellen_trefferquote.py) nach den
# ersten Laeufen.
#
# Felder:
#   name     Anzeigename
#   domain   Unternehmensdomain OHNE Schema ("telenor.no")
#   region   nur fuer Netzbetreiber: europe|north_america|latin_america|
#            africa_middle_east|asia|oceania  (Schluessel der Watchlist)
#   country  ISO-Kuerzel, nur beschreibend
#   thema    fuer Nicht-Betreiber: ki|geraete|chips|netzausruester|satellit|
#            regulierung  (Schluessel aus tech_sources.yaml)
#            plus die in dieser Session ergaenzten Felder, siehe unten
# =============================================================================

