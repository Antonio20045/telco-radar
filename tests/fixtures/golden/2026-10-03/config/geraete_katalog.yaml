  # Die Marke, die in den Price Alerts der internen Lösung ganz fehlt.

  # ---------------------------------------------------------------------------
  # MARKTSTART DER PIXEL-11-REIHE: 2026-08-20, belegt aus dem Berichtsarchiv
  # ---------------------------------------------------------------------------
  # Vorgestellt am 12.08.2026 (Bericht 2026-08-19, Google Pixel: "Google hat am
  # 12. August 2026 die Pixel-11-Serie vorgestellt") - das ist NICHT der
  # Marktstart. Die Vorbestellphase ist bis zum 19./20.08. belegt: Bericht
  # 2026-08-14 (Charter/Spectrum Mobile, "nimmt bis 19. August Vorbestellungen
  # ... an"), Bericht 2026-08-19 (Xataka Movil, MediaMarkt Spanien "bei
  # Vorbestellung ... bis 20. August").
  #
  # Erster belegter VERKAUFSTAG ist der 20.08.2026 - zwei unabhaengige
  # Pressemitteilungen desselben Tages (Veroeffentlichungsdatum aus der
  # Quellenliste des Berichts vom 2026-08-25):
  #   Vodafone UK, 2026-08-20: "The new Google Pixel 11, Pixel 11 Pro Fold,
  #     Pixel 11 Pro and Pixel 11 Pro XL now available with Vodafone"
  #   Three UK, 2026-08-20: "Get the latest Google Pixel 11 range on Three
  #     Mobile today"
  # Bestaetigt am Folgetag durch Univers Freebox, 2026-08-21: "Free Mobile
  # vermarktet nach den Vorbestellungen jetzt Google Pixel 11 ... direkt".
  #
  # WIDERSPRUCH, bewusst hier notiert statt weggelassen: Googles eigener
  # Beitrag "You can officially buy the Pixel 11 phones and Pixel Watch 5."
  # ist auf den 25.08.2026 datiert (Bericht 2026-08-26). Der Vorrang des
  # 20.08. ist keine Abwaegung nach Gefuehl, sondern eine Reihenfolge: ein
  # Haendler kann nicht vor dem Marktstart verkaufen, also ist der 20.08. eine
  # obere Schranke, waehrend der 25.08. nur eine spaete Meldung sein kann.
  # Wer lieber dem Hersteller folgt, aendert die vier Zeilen unten auf
  # 2026-08-25 - die Belege stehen dafuer hier beisammen.
  - hersteller: Google
    modell: Pixel 11
    generation: 11
    vorgaenger: Pixel 10
    marktstart: 2026-08-20   # siehe Block oben (Vodafone UK / Three UK, 20.08.2026)
    speicher: [256, 512]
    segment: flagship

  - hersteller: Google
