# =============================================================================
# TELCO RADAR - Promo-Uebersicht: Quellen (Deutschland)
# =============================================================================
# Hand-gepflegt (bewusst NICHT von scripts/build_sources.py generiert): das
# sind Endkunden-Aktions-/Tarifseiten, keine Presse-Newsrooms. Andere
# Quellenart als config/watchlist.yaml, deshalb eigene Datei und eigener
# Collector (siehe src/telco_radar/collect/promo_snapshot.py).
#
# -----------------------------------------------------------------------------
# EINE MARKE, MEHRERE SEITEN (Stand 08.08.2026)
# -----------------------------------------------------------------------------
# Bis dahin hatte jede Marke genau EINE URL. Das war die eigentliche Luecke der
# Rubrik: kein Anbieter zeigt alle laufenden Aktionen auf einer Seite. Die
# Geraeteaktion steht unter /handys, der Wechselbonus unter /wechselbonus, die
# Prepaid-Aktion unter /prepaid, die Junge-Leute-Aktion noch einmal woanders -
# die Uebersichtsseite, die hier als einzige konfiguriert war, verlinkt sie
# hoechstens. Antonio: "dass man wirklich alle Promo-Aktionen von den einzelnen
# Unternehmen auf dem Schirm hat, dafuer braucht es wahrscheinlich mehr als
# eine Quelle pro Unternehmen."
#
# Deshalb: `url`/`kind` bleiben die LEITSEITE (sie wird auf der Uebersicht als
# Markenlink gezeigt und ist der Rueckfall fuer ein Angebot ohne eigenen
# Tiefenlink), `pages:` nennt die weiteren Seiten. Jede Seite hat ihren eigenen
# Aenderungsstand (analyze/promo_store.snapshot_key) und wird nur dann neu
# durch die LLM-Extraktion geschickt, wenn SIE sich geaendert hat.
#
# WIE DIESE LISTE ENTSTANDEN IST - und wie sie zu erweitern ist:
#   1. python scripts/finde_promo_seiten.py --yaml kandidaten.yaml
#      Linkernte auf den bereits konfigurierten Seiten, danach Kandidatenpfade.
#      Am 08.08.2026: 109 Kandidaten ueber 15 Marken.
#   2. python scripts/pruefe_promo_seite.py kandidaten.yaml --statisch --zweimal
#      Neun Kriterien im Code. Von 109 Kandidaten bestanden 67; nach
#      inhaltlicher Sichtung (SEO-Ratgeber, Festnetz, Einzel-SKU aussortiert)
#      blieben 44. KEIN Eintrag hier ohne PASS - mit der einen dokumentierten
#      Ausnahme Telekom, siehe dort.
#   3. Erst danach von Hand eintragen. Der Check prueft FORM, nicht WERT.
#
# Was in Schritt 3 verworfen wurde, obwohl es den Check bestand (damit es nicht
# beim naechsten Mal wieder vorgeschlagen wird):
#   * winsim.de/info/... - fuenf SEO-Ratgeberartikel ("Test Handytarife: So
#     vergleichen Sie richtig"). Traegt Angebotswoerter, aber kein Angebot.
#   * o2online.de/internet-festnetz/homespot-tarife und
#     alditalk.de/internet-zuhause/... - Festnetzersatz. Der Extraktor soll
#     genau das verwerfen (siehe promo_analyst._EXTRACT_SYSTEM).
#   * congstar.de/prepaid/tarife/prepaid-allnet-{s,m,l,xl,xs} - Einzeltarife.
#     Die Prepaid-Uebersicht /prepaid deckt sie ab.
#   * klarmobil.de/service/vertragsverlaengerung - duenne Serviceseite.
#
# Was mangels Substanz KEINE zusaetzliche Seite bekommen hat (Luecke zeigen,
# nicht verstecken):
#   * Lidl Connect - Single-Page-App: /tarife, /aktionen, /smart-tarife liefern
#     alle byteweise dieselbe Huelle. Es GIBT dort nur eine Seite.
#   * simplytel, Penny Mobil - ihre Startseite enthaelt bereits alles; jeder
#     Kandidat fiel an Kriterium 7 (Eigenstaendigkeit) durch.
#
# -----------------------------------------------------------------------------
# DIE REIHENFOLGE DER SEITE (Feld `rang`, Stand 08.08.2026)
# -----------------------------------------------------------------------------
# Die Promo Uebersicht steht in dieser Reihenfolge, und zwar unabhaengig davon,
# wie stark die Aktionen einer Marke gerade bewertet sind. Bis zum 08.08.2026
# sortierte sie nach dem Score der staerksten Aktion - damit stand Otelo oben
# und die Telekom auf Platz zehn, weil ihre JS-Seiten in dem Lauf nur zwei
# Angebote hergaben. Antonio: "die groessten Anbieter wie Telekom etc. an
# erster Stelle, soll also nach Wichtigkeit der Anbieter geordnet werden."
#
# Die Rangfolge folgt zwei Regeln, in dieser Ordnung:
#   1. Netzbetreiber vor Zweitmarken. Wer ein eigenes Netz betreibt, setzt den
#      Preis, an dem sich alle anderen ausrichten.
#   2. Danach die Konzerne in derselben Reihenfolge wie ihre Netzbetreiber
#      (Telekom -> Vodafone -> Telefónica -> 1&1), dann Vertriebs- und
#      Handelsmarken, zuletzt die reinen Online-Zweitmarken (reach 1).
# Vodafone selbst traegt Rang 2 - die Marke gehoert an diese Stelle, die SEITE
# stellt sie trotzdem ans Ende (internal_reference, siehe report/promo.py):
# der eigene Absender soll die Wettbewerbsbeobachtung nicht anfuehren.
#
# Felder:
#   rang      Platz in der Anbieter-Rangfolge, 1 = wichtigster. Gepflegt, nicht
#             gerechnet: Marktgewicht steht in keiner Zahl dieses Projekts.
#             Fehlt das Feld, faellt die Marke hinter jede gepflegte und wird
#             dort nach tier/reach/Name einsortiert.
#   tier      1 = grosse Netzbetreiber, 2 = Discount-/Zweitmarken
#             (Festnetz/Kabel/Glasfaser bewusst nicht getrackt - kein
#             Interesse an diesem Segment, siehe claude/promo-uebersicht-
#             umsetzung.md, dritte Session)
#   kind      static (per HTTP) | js (Playwright, wie newsroom_js) |
#             skip (dokumentierter Sonderfall, wird nicht gecrawlt)
#             Gilt je SEITE: eine Marke darf eine statische Uebersicht und
#             eine JS-gerenderte Kampagnenseite gleichzeitig haben.
#   group     Mutterkonzern/Markenfamilie, wo bekannt (KEINE Netzbetreiber-
#             Behauptung - manche Discounter senden ueber mehrere Netze)
#   internal_reference  true fuer Vodafone selbst: erscheint separat markiert,
#             zaehlt NICHT als Wettbewerber (siehe report/promo.py)
#   reach     1-3, Marktreichweite der Marke - Achse C des Wichtigkeits-Scores
#             (src/telco_radar/analyze/promo_ranker.py). 3 = Netzbetreiber,
#             2 = breit distribuierte Zweit-/Handelsmarke (Filialnetz, Discounter-
#             Regal, grosser Vertriebspartner), 1 = reine Online-Zweitmarke.
#             Bewusst getrennt vom Tier: ALDI TALK und simplytel sind beide
#             Tier 2, erreichen aber voellig unterschiedlich viele Menschen.
#   pages     Weitere Seiten dieser Marke. `label` ist reine Anzeige auf der
#             Quellen-Unterseite.
# =============================================================================
brands:
  # ---------------------------------------------------------- Tier 1: MNOs
  - name: Telekom Deutschland
    rang: 1
    reach: 3
    tier: 1
    group: Deutsche Telekom
    url: https://www.telekom.de/unterwegs/aktionen
    kind: js
    # ACHTUNG, dokumentierte Ausnahme: telekom.de beantwortet jeden
    # httpx-Abruf mit HTTP 202 und einer 2-KB-Challenge - auch mit
    # Browser-User-Agent, auch beim zweiten Versuch in derselben Session.
    # Mit curl kommt dieselbe URL als HTTP 200 mit vollem Inhalt zurueck; es
    # ist also eine TLS-/Client-Erkennung, keine Sperre gegen dieses Projekt.
    # scripts/pruefe_promo_seite.py kann diese vier Seiten deshalb LOKAL NICHT
    # abnehmen (sie fallen dort an Kriterium 1 durch). Nachgemessen wurde
    # stattdessen per curl, am 08.08.2026, gegen genau diese URLs:
    #   /shop/tarife/handyvertrag            20 890 Zeichen,  9 Preise
    #   /shop/tarife/prepaid-tarife           8 220 Zeichen,  6 Preise
    #   /shop/tarife/zusatzkarten            10 741 Zeichen, 12 Preise
    #   /shop/tarife/smartphone-tarife-young    595 Zeichen (nur JS-gerendert)
    # In GitHub Actions laeuft der Abruf ueber Playwright und damit ueber einen
    # echten Browser - derselbe Weg, ueber den die Leitseite oben seit Monaten
    # funktioniert. NACH DEM NAECHSTEN LAUF im Protokoll nachsehen, ob diese
    # vier Seiten Text geliefert haben; wenn nicht, gehoeren sie wieder raus.
    pages:
      - url: https://www.telekom.de/shop/tarife/handyvertrag
        kind: js
        label: Handyverträge
      - url: https://www.telekom.de/shop/tarife/prepaid-tarife
        kind: js
        label: Prepaid
      - url: https://www.telekom.de/shop/tarife/zusatzkarten
        kind: js
        label: Zusatzkarten
      - url: https://www.telekom.de/shop/tarife/smartphone-tarife-young
        kind: js
        label: Junge Leute
  - name: Vodafone Deutschland
    rang: 2
    reach: 3
    tier: 1
    group: Vodafone
    url: https://www.vodafone.de/handy/angebote.html
