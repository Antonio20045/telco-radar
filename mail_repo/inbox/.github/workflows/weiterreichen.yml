# Der ganze Zweck dieses Repositories: ein Ereignis weiterreichen.
#
# `telco-radar-inbox` ist LEER und bleibt leer. Es existiert, damit das
# GitHub-Token des Signup-Dienstes auf ein Repo ohne Daten zeigt. Ein Token
# mit contents:write auf telco-radar-mail koennte dort send_digest.py
# ueberschreiben - genau die Datei, die der Workflow danach MIT dem
# Entschluesselungsschluessel ausfuehrt. Wer den Render-Dienst uebernimmt,
# haette damit Codeausfuehrung im Runner und den entschluesselten Verteiler.
#
# Das Token, mit dem HIER weitergereicht wird, liegt nur in Actions und ist
# von aussen nicht erreichbar.
name: Ereignis weiterreichen

on:
  repository_dispatch:
    types: [send_doi, confirm, unsubscribe]

permissions: {}

jobs:
  weiterreichen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: An telco-radar-mail durchreichen
        env:
          TOKEN: ${{ secrets.MAIL_REPO_TOKEN }}
          TYP: ${{ github.event.action }}
          # Die Nutzlast reist unveraendert weiter. Sie enthaelt KEINE
          # Klaradresse - die steckt signiert im Token, und das Token geht
          # an einen privaten Workflow.
          NUTZLAST: ${{ toJSON(github.event.client_payload) }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret MAIL_REPO_TOKEN fehlt."
            exit 1
          fi
          koerper=$(jq -nc --arg t "$TYP" --argjson p "$NUTZLAST" \
            '{event_type:$t, client_payload:$p}')
          code=$(curl -sS -o /tmp/antwort.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Antonio20045/telco-radar-mail/dispatches \
            -d "$koerper")
          echo "Weitergereicht ($TYP) -> HTTP $code"
          # 204 ist der Erfolgsfall von /dispatches.
          [ "$code" = "204" ] || { cat /tmp/antwort.txt; exit 1; }
