[project]
name = "telco-radar"
version = "0.1.0"
description = "Global telco competitive-intelligence agent pipeline"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." steht seit dem 11.08.2026 daneben: der Signup-Dienst liegt unter
# `service/` und nicht unter `src/`, weil er ein eigener Prozess ist (auf
# Render, nicht in der Pipeline). Ohne diesen Eintrag laeuft
# tests/test_signup_service.py nur mit gesetztem PYTHONPATH - und ein Test,
# der sich mangels Import ueberspringt, sieht im Protokoll aus wie ein
# Erfolg. Genau derselbe Grund, aus dem ci.yml Chromium installiert.
pythonpath = ["src", "."]
addopts = "--strict-markers --disable-socket --allow-hosts=127.0.0.1 -n auto --dist worksteal"
markers = [
  "seite: rendert HTML aus einem Schnappschuss",
  "browser: braucht Chromium, gesetzt über die Fixture chromium",
  "langsam: länger als 5 s, nur im pre-push",
  "golden: goldener Lauf, nur im pre-push",
  "netz: echter Abruf, läuft nie automatisch",
]

[tool.ruff]
target-version = "py311"
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "service/**/*.py",
    "tools/**/*.py",
]
extend-exclude = ["site", "data", "_to_delete", "mail_repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C90", "I", "UP", "DTZ", "BLE", "S110", "S112", "PGH", "TID251", "D1"]
ignore = ["D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Quellen nur ueber telco_radar.collect.http abrufen"
"requests".msg = "Quellen nur ueber telco_radar.collect.http abrufen"
"urllib.request".msg = "Quellen nur ueber telco_radar.collect.http abrufen"

[tool.ruff.lint.per-file-ignores]
"src/telco_radar/collect/http.py" = ["TID251"]
"src/telco_radar/analyze/llm.py" = ["TID251"]
"src/telco_radar/newsletter/transport.py" = ["TID251"]
"src/telco_radar/versand.py" = ["TID251"]
"tests/**" = ["D1", "TID251"]
"scripts/**" = ["D1"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["telco_radar"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
