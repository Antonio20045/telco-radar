# =============================================================================
# RAHMENTEXTE DER MAIL - und der Grund, warum sie eine eigene Datei haben
# =============================================================================
# Die haerteste Anforderung des Newsletters lautet: kein inhaltstragender Satz
# in der Mail darf von dem abweichen, was im Bericht-JSON steht. Ein Test
# prueft jeden aus `items[]` stammenden Textblock als Teilstring gegen das
# Quell-JSON.
#
# Dieser Test ist ohne eine Unterscheidung nicht erfuellbar. Es gibt zwei
# Arten Text in einer Mail:
#
#   * INHALTSTRAGENDE Bloecke - Titel, Zusammenfassung, Absender. Sie kommen
#     aus dem Bericht und muessen dort wortgleich wiederzufinden sein.
#   * RAHMENTEXTE - Anrede, Kopfzeile, Abmeldehinweis, Impressumszeile, die
#     Stichwort-Markierung, die Leermeldung. Sie stehen naturgemaess nirgends
#     im Bericht.
#
# Diese Datei ist die Allowlist der zweiten Art. Sie ist versioniert, damit
# eine Aenderung am Rahmen im Diff sichtbar ist und nicht in einer Vorlage
# untergeht - und damit niemand auf die Idee kommt, den Treue-Test durch eine
# grosszuegigere Regel zu "reparieren".
#
# WER HIER EINEN SATZ ERGAENZT, ergaenzt ihn im Test mit. Genau das ist die
# Absicht: ein neuer Rahmensatz soll eine bewusste Entscheidung sein.
# -----------------------------------------------------------------------------

version: "2026-10-11"

# Der Absender. Anzeigename bewusst neutral: ein Markenname vor einer nicht
# zur Marke gehoerenden Adresse ist genau das Muster, auf das
# Konzern-Gateways als Display-Name-Spoofing anschlagen.
absender_name: "Telco Radar"

kopf:
  titel: "Telco Radar"
  untertitel: "Vodafone Product and Services Insights"
  # {datum} wird ersetzt. Kein anderer Platzhalter.
  ausgabe: "Ausgabe vom {datum}"

# Der eine Satz, der die Auswahl erklaert; er steht vor dem ersten Abschnitt.
einleitung_filter: "Neu seit der letzten Ausgabe, passend zu Ihrer Auswahl."
einleitung_alles: "Neu seit der letzten Ausgabe."

# Die Abschnitte heissen wie die Bereiche der Anmeldeseite und die Reiter des
# Portals (config/newsletter.yaml); die Reihenfolge ist die dortige.
abschnitte:
  marktrecherche: "Meldungen"
  promo: "Promo"
  geraete: "Geräte"

# Die Markierung eines additiven Stichworttreffers. Ohne sie versteht
# niemand, warum ein Eintrag in der Mail steht, den die uebrigen Filter
# ausgeschlossen haetten.
stichwort_marker: "Ihr Stichwort: {stichwort}"

# Die zwei Links je Eintrag. "Quelle" fuehrt zum Original, "im Portal" auf
# die Website.
link_quelle: "Zur Quelle"
link_bericht: "Im Portal"

# Der Abschluss.
schluss_link: "Zum Portal"

# Der Fuss. Jede Zeile hier ist rechtlich noetig oder eine Zusicherung.
fuss:
  warum: "Sie bekommen diese E-Mail, weil Sie sich am {seit_datum} für den Telco Radar angemeldet und die Anmeldung per Klick bestätigt haben."
  abmelden: "Abmelden"
  abmelden_satz: "Abmelden geht jederzeit mit einem Klick:"
  datenschutz: "Datenschutzerklärung"
  impressum: "Impressum"
  automatisch: "Automatisch erstellt aus öffentlichen Quellen. Jede Aussage ist mit ihrer Originalquelle verlinkt."

# P4: der woechentliche Geraeteblock. Zahlen, Geraet, Anbieter und Band
# kommen aus `geraete_bewegung` im Bericht-JSON; hier stehen nur die Worte
# drumherum. {euro}/{prozent} sind die Schwellen aus
# `report/geraete_bewegung.py`, nie hier eingetragen.
bewegung:
  titel: "Abstand zu Vodafone"
  zeitraum: "{von} bis {bis}"
  # Die groesste Zahl ist die AENDERUNG des Abstands, kein Preisniveau:
  # „240 € zugunsten von o2" heisst, o2 steht gegen Vodafone 240 € besser
  # da als vor einer Woche - auch wenn der Abstand dabei das Vorzeichen
  # wechselt.
  zugunsten: "zugunsten von {anbieter}"
  vorher: "vorher {abstand}"
  jetzt: "jetzt {abstand}"
  abstand_guenstiger: "{betrag} günstiger als Vodafone"
  abstand_teurer: "{betrag} teurer als Vodafone"
  abstand_gleich: "gleich teuer wie Vodafone"
  bewegt_fremd: "{anbieter} hat den Preis geändert"
  bewegt_eigen: "Vodafone hat den Preis geändert"
  bewegt_beide: "beide haben den Preis geändert"
  link_seite: "Auf der Geräteseite"
  link_angebot: "Angebot {anbieter}"
  weitere: "und {n} weitere auf der Geräteseite"
  # „Keine Bewegung" waere gelogen, solange die meisten Vergleiche ohne
  # Aussage sind (Angebotswechsel, fehlende Messung) - deshalb die Zahl.
  leer: "Keine belegte Bewegung über {euro} oder {prozent} seit dem {von} ({geprueft} von {gesamt} Vergleichen prüfbar)."
  ausfall: "Der Gerätevergleich ist diesmal ausgefallen: {grund}"
