<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus-Szene Vorschau</title>
<style>
/* Ein Bildschirm: die Szene fuellt alles, die Steuerung liegt als Glasleiste unten und laesst sich ganz wegschieben. Bewusst nur dunkel, wie ein Kinosaal. */
:root {
  --grund: #07090c;
  --glas: rgba(16, 19, 24, 0.62);
  --glas-hell: rgba(255, 255, 255, 0.08);
  --glas-rand: rgba(255, 255, 255, 0.14);
  --text: #f2f4f7;
  --text-2: rgba(242, 244, 247, 0.62);
  --rot: #e60000;
  --dunkel-text: #101317;
  --schrift: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--grund); color: var(--text); font-family: var(--schrift); overflow: hidden; }
#buehne { position: fixed; inset: 0; }
#szene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.4s ease; }
#szene.da { opacity: 1; }
.laden { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.marke { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-radius: 999px; background: var(--glas); border: 1px solid var(--glas-rand);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font-size: 14px; font-weight: 500; }
.marke i { width: 9px; height: 9px; border-radius: 50%; background: var(--rot); display: block; }
.marke span { color: var(--text-2); font-weight: 400; font-variant-numeric: tabular-nums; }

/* Startseiten-Text: rechts im freien Himmel neben dem Turm */
.kopf { position: absolute; left: 55%; top: 15vh; max-width: 42vw; color: var(--text); transition: color 1.2s ease, opacity .6s ease; text-shadow: 0 1px 30px rgba(0,0,0,.18); }
.kopf h1 { margin: 0; font-size: clamp(56px, 8.2vw, 150px); font-weight: 500; line-height: .92; letter-spacing: -.05em; text-wrap: balance; }
.kopf p { display: inline-block; margin: 16px 0 0; padding: 7px 14px; border-radius: 999px; font-size: 15px; font-weight: 500;
  background: rgba(12,14,18,.34); color: inherit; border: 1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.kopf.hell { color: var(--dunkel-text); text-shadow: 0 1px 24px rgba(255,255,255,.25); }
.kopf.hell p { background: rgba(255,255,255,.45); border-color: rgba(255,255,255,.6); }
.kopf[hidden] { display: none; }

.leiste { position: absolute; left: 16px; right: 16px; max-width: 1180px; margin-inline: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 10px; padding: 12px 14px; border-radius: 20px; background: var(--glas); border: 1px solid var(--glas-rand);
  -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); max-height: 46vh; overflow-y: auto;
  transition: transform .45s cubic-bezier(.2,.7,.2,1), opacity .45s ease; }
.leiste.weg { transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; }
.griff { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); background: var(--glas); }
.griff[hidden] { display: none; }
.griff svg, .weg-knopf svg { width: 14px; height: 14px; display: block; }
.zeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.titel { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); margin-right: 4px; }
.szenen { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
button { font: inherit; color: var(--text); background: var(--glas-hell); border: 1px solid var(--glas-rand); border-radius: 999px;
  padding: 7px 13px; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background .2s ease, color .2s ease; }
button:hover { background: rgba(255,255,255,.16); }
button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--text); color: var(--dunkel-text); border-color: var(--text); }
.weg-knopf { display: inline-flex; align-items: center; gap: 6px; }
.schalter { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.regler { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 16px; }
.breit { grid-column: span 2; }
.regler label, .regler .feld { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); min-width: 0; }
.regler b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.kopfzeile { display: flex; justify-content: space-between; gap: 8px; }
input[type=range] { width: 100%; accent-color: #ffffff; }
.knoepfe { display: flex; gap: 6px; flex-wrap: wrap; }
.knoepfe button { padding: 5px 11px; font-size: 13px; }
.stand { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
@media (max-width: 700px) {
  .kopf { left: 16px; right: 16px; max-width: none; top: 74px; }
  .breit { grid-column: auto; }
  .schalter { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { #szene, .kopf, .leiste { transition: none; } }
</style>
</head>
<body>
<div id="buehne">
  <div class="laden" id="laden">Campus wird geladen …</div>
  <canvas id="szene" aria-label="Vodafone-Turm am Campus Düsseldorf, Licht und Wetter live gerechnet"></canvas>
  <div class="marke"><i></i>Campus Düsseldorf <span id="kurz">Vorschau</span></div>
  <div class="kopf" id="kopf">
    <h1 id="datum">13. Oktober</h1>
    <p id="pille">Campus Düsseldorf · klar</p>
  </div>

  <section class="leiste" id="leiste" aria-label="Steuerung">
    <div class="zeile">
      <span class="titel">Szenen</span>
      <div class="schalter">
        <button id="rundgang" aria-pressed="true">Rundgang</button>
        <button id="raffer" aria-pressed="false">Zeitraffer</button>
        <button id="text" aria-pressed="true">Startseiten-Text</button>
        <button id="weg" class="weg-knopf" aria-controls="leiste"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Wegschieben</button>
      </div>
    </div>
    <div class="szenen" id="szenen"></div>
    <div class="regler">
      <label class="breit"><span class="kopfzeile">Uhrzeit <b id="w-zeit">13:00</b></span>
        <input id="r-zeit" type="range" min="0" max="1439" step="1" value="780"></label>
      <div class="feld breit"><span class="kopfzeile">Jahreszeit</span>
        <span class="knoepfe" id="jahr"></span></div>
      <div class="feld"><span class="kopfzeile">Tag</span>
        <span class="knoepfe" id="woche"></span></div>
      <label><span class="kopfzeile">Wolken <b id="w-wolken">30 %</b></span><input id="r-wolken" type="range" min="0" max="100" value="30"></label>
      <label><span class="kopfzeile">Regen <b id="w-regen">0 %</b></span><input id="r-regen" type="range" min="0" max="100" value="0"></label>
      <label><span class="kopfzeile">Schnee <b id="w-schnee">0 %</b></span><input id="r-schnee" type="range" min="0" max="100" value="0"></label>
      <label><span class="kopfzeile">Nebel <b id="w-nebel">0 %</b></span><input id="r-nebel" type="range" min="0" max="100" value="0"></label>
      <label><span class="kopfzeile">Wind <b id="w-wind">20 %</b></span><input id="r-wind" type="range" min="0" max="100" value="20"></label>
      <label><span class="kopfzeile">Gewitter <b id="w-gewitter">aus</b></span><input id="r-gewitter" type="range" min="0" max="1" step="1" value="0"></label>
    </div>
    <div class="stand" id="stand"></div>
  </section>
  <button class="griff" id="griff" hidden aria-controls="leiste"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Steuerung</button>
</div>

<script>
/* Wie viele Bueros Licht haben, nach Uhrzeit (Werktag) */
var CAMPUS_LEBEN = (function () {
  var BUERO = [[0, 0.04], [5, 0.04], [6, 0.3], [7, 0.75], [8, 0.95], [17, 0.95], [18, 0.75], [19, 0.5],
    [20, 0.3], [21, 0.12], [22, 0.06], [24, 0.04]];
  var kurve = function (punkte, x) {
    for (var i = 1; i < punkte.length; i++) {
      if (x <= punkte[i][0]) { var a = punkte[i - 1], b = punkte[i]; return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]); }
    }
    return punkte[punkte.length - 1][1];
  };
  return {
    buero: function (minute, werktag) {
      var v = kurve(BUERO, ((((minute % 1440) + 1440) % 1440) / 60));
      return werktag ? v : Math.min(v, 0.07);
    }
  };
})();

/* Sechs echte Fotoplatten im selben Blickwinkel (Tag, goldene Stunde, blaue Stunde, Abend mit Licht, Nacht, Regen).
   Die Szene blendet zwischen ihnen statt ein Foto umzufaerben; Wolken, Regen, Schnee, Nebel, Wind und Licht liegen darueber. */
var CAMPUS_SHADER = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 farbe;
uniform sampler2D uTag, uGold, uBlau, uNacht, uSpaet, uRegen, uSchneeP, uMA, uMB, uGlanz, uHim;
uniform vec4 uW;            // Tag, Gold, Blau, Nacht (Summe 1)
uniform float uRegenPlatte; // Anteil der Regenplatte an Tag und Gold
uniform float uBedeckt;     // geschlossene Wolkendecke 0..1
uniform float uRegenHell;   // Helligkeit der Regenplatte nach Sonnenstand
uniform vec2 uAufl, uBild, uAnker;
uniform float uZeit, uWolken, uRegenI, uSchnee, uDecke, uNebel, uWind, uBlitz, uHerbst, uWinter, uFrueh, uNass, uBuero;

float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.0;float a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,9.2);a*=0.5;}return v;}
float lum(vec3 c){return dot(c,vec3(0.2126,0.7152,0.0722));}

// Bildausschnitt wie "cover"; der Turm bleibt im Bild
vec2 cover(vec2 s){
  float ab=uAufl.x/uAufl.y, ai=uBild.x/uBild.y; vec2 k=vec2(1.0), m=vec2(0.5);
  if(ab>ai){k.y=ai/ab;m.y=clamp(uAnker.y,k.y*0.5,1.0-k.y*0.5);}else{k.x=ab/ai;m.x=clamp(uAnker.x,k.x*0.5,1.0-k.x*0.5);}
  return m+(s-0.5)*k;
}
vec3 kachel(sampler2D t,vec2 u,float i,float n,float h){float y=clamp(u.y,1.5/h,1.0-1.5/h);return texture(t,vec2(u.x,(i+y)/n)).rgb;}

void main(){
  vec2 u0=cover(vUv);
  float wT=uW.x,wG=uW.y,wB=uW.z,wN=uW.w;
  float dunkel=clamp(wN+wB*0.75+wG*0.25,0.0,1.0);

  // Wind in den Kronen: weich ausgeblendete Verschiebung, Boeen kommen und gehen, die Blaetter zittern
  vec2 u=u0;
  float weich=textureLod(uMA,u0,3.0).g;
  if(weich>0.002){
    float t=uZeit;float boe=0.5+0.5*sin(t*0.29+2.0*sin(t*0.11));
    float ph=noise(u0*vec2(14.0,9.0))*6.283;
    float sw=sin(t*(0.8+0.9*uWind)+ph)+0.4*sin(t*(2.1+1.6*uWind)+ph*1.7);
    float zit=noise(u0*vec2(300.0,210.0)+vec2(t*(1.4+3.5*uWind),t*0.8))-0.5;
    vec2 d=vec2(sw*(0.5+4.5*uWind)*(0.4+0.6*boe)+zit*(0.6+2.2*uWind),0.22*sw*(0.3+uWind)+zit*0.4);
    u=u0+d*weich/uBild;
  }
  vec3 ma=texture(uMA,u).rgb;   // r Himmel, g Baum, b Boden
  float himmel=ma.r, baum=ma.g, boden=ma.b;

  // Bedeckt ohne Regen: Gebaeude im weichen Licht der Regenplatte, der trockene Platz bleibt aus der Tagplatte
  float r=max(uRegenPlatte,uBedeckt*(1.0-boden));
  float wR=(wT+wG)*r; wT*=1.0-r; wG*=1.0-r;
  // Schneedecke bei Tag: echte Winterplatte
  float wS=(wT+wG+wR)*uDecke; wT*=1.0-uDecke; wG*=1.0-uDecke; wR*=1.0-uDecke;
  float deckeRest=uDecke*(1.0-(uW.x+uW.y));

  vec3 I=vec3(0.0), S=vec3(0.0), G=vec3(0.0);
  float an=uBuero;
  if(wT>0.001){I+=wT*texture(uTag,u).rgb;S+=wT*kachel(uHim,u,0.0,7.0,266.0);}
  if(wG>0.001){I+=wG*texture(uGold,u).rgb;S+=wG*kachel(uHim,u,1.0,7.0,266.0);}
  if(wB>0.001){I+=wB*texture(uBlau,u).rgb;S+=wB*kachel(uHim,u,2.0,7.0,266.0);G+=wB*0.55*kachel(uGlanz,u,2.0,3.0,531.0);}
  if(wN>0.001){
    // Buerolichter: jedes Fenster hat eine eigene Schwelle; liegt der Anteil besetzter Bueros darueber, brennt es
    vec3 mb=texture(uMB,u).rgb;
    an=mix(clamp(uBuero*1.15,0.0,1.0),smoothstep(mb.g-0.025,mb.g+0.025,uBuero*1.15),mb.b);
    vec3 n=texture(uNacht,u).rgb, s=texture(uSpaet,u).rgb;
    I+=wN*mix(s,n,an);S+=wN*kachel(uHim,u,4.0,7.0,266.0);
    G+=wN*mix(kachel(uGlanz,u,1.0,3.0,531.0),kachel(uGlanz,u,0.0,3.0,531.0),clamp(uBuero*1.6,0.0,1.0));
  }
  if(wR>0.001){I+=wR*texture(uRegen,u).rgb*uRegenHell;S+=wR*kachel(uHim,u,5.0,7.0,266.0)*uRegenHell;}
  if(wS>0.001){I+=wS*texture(uSchneeP,u).rgb*uRegenHell;S+=wS*kachel(uHim,u,6.0,7.0,266.0)*uRegenHell;}

  // Jahreszeit im Laub (das Foto zeigt Herbst)
  if(baum>0.01){
    float l=lum(I);float v=noise(u*vec2(20.0,14.0));
    vec3 frueh=mix(vec3(0.42,0.60,0.18),vec3(0.55,0.68,0.26),v);
    vec3 sommer=mix(vec3(0.17,0.30,0.09),vec3(0.24,0.36,0.11),v);
    float som=clamp(1.0-uFrueh-uHerbst-uWinter,0.0,1.0);
    vec3 ziel=frueh*uFrueh+sommer*som;
    float st=uFrueh+som;
    vec3 neu=ziel/max(lum(ziel),0.02)*l*mix(1.0,1.12,uFrueh);
    I=mix(I,mix(neu,vec3(l),0.06),baum*st*0.9);
    // Winter: kahl, braungrau, gegen den Himmel licht
    vec3 kahl=vec3(l)*vec3(0.86,0.79,0.72)*0.8;
    float nah=smoothstep(0.1,0.5,textureLod(uMA,u,5.5).r);
    kahl=mix(kahl,S,0.28*nah);
    I=mix(I,kahl,baum*uWinter*(1.0-wS));
  }

  vec3 col=I;

  // Wolken ueber dem echten Himmel; an Kanten mit der Himmelsschaetzung entmischt, damit kein Saum entsteht
  float opaz=1.0-(uW.x+uW.y)*max(uRegenPlatte,uBedeckt);
  if(himmel>0.002&&uWolken>0.02&&opaz>0.01){
    float hor=0.74;float e=max(hor-u0.y,0.0);float t=1.0/(e+0.11);
    float wind=uZeit*(0.005+0.024*uWind);
    vec2 p=vec2((u0.x-0.5)*1.6*t+wind*t*0.28,t*1.3+wind*0.12);
    vec2 q=vec2(fbm(p*0.6),fbm(p*0.6+vec2(5.2,1.3)));
    float d=fbm(p*0.85+q*0.7);
    float c=min(clamp(uWolken,0.0,1.0),0.72);
    float dichte=smoothstep(0.80-c*0.64,0.97-c*0.50,d)*smoothstep(0.0,0.07,e);
    float d2=fbm(p*0.85+q*0.7+vec2(0.07,-0.11));
    float hell=clamp(0.55+1.8*(d-d2),0.0,1.0);
    vec3 lichtC=uW.x*vec3(0.97,0.97,0.98)+uW.y*vec3(1.0,0.76,0.60)+uW.z*vec3(0.58,0.52,0.64)+uW.w*vec3(0.15,0.115,0.105);
    vec3 schattenC=uW.x*vec3(0.60,0.63,0.69)+uW.y*vec3(0.46,0.38,0.46)+uW.z*vec3(0.25,0.24,0.33)+uW.w*vec3(0.045,0.04,0.045);
    vec3 grau=(uW.x+uW.y*0.7+uW.z*0.3+uW.w*0.07)*vec3(0.66,0.68,0.71)*(1.0-0.35*uRegenI);
    lichtC=mix(lichtC,grau*1.08,uBedeckt*0.85);schattenC=mix(schattenC,grau*0.72,uBedeckt*0.85);
    vec3 wc=mix(schattenC,lichtC,hell);
    wc=mix(S,wc,smoothstep(0.0,0.45,dichte));
    vec3 neuHimmel=mix(S,wc,clamp(dichte*1.15,0.0,1.0)*opaz);
    // geschlossene Decke: weich, unten von der Stadt angeleuchtet
    float decke=smoothstep(0.62,0.95,uWolken);
    if(decke>0.0){
      float hh=pow(clamp((hor+0.08-u0.y)/(hor+0.08),0.0,1.0),0.7);
      vec3 strH=uW.x*vec3(0.74,0.76,0.79)+uW.y*vec3(0.66,0.58,0.56)+uW.z*vec3(0.36,0.35,0.43)+uW.w*vec3(0.14,0.115,0.105);
      vec3 strO=uW.x*vec3(0.60,0.62,0.66)+uW.y*vec3(0.44,0.42,0.47)+uW.z*vec3(0.21,0.21,0.28)+uW.w*vec3(0.05,0.047,0.055);
      vec3 str=mix(strH,strO,hh)*(1.0-0.3*uRegenI);
      float tex=fbm(vec2(u0.x*2.4+wind*0.6,u0.y*4.5))*0.6+fbm(vec2(u0.x*7.0+wind*1.2,u0.y*12.0))*0.4;
      str*=0.86+0.26*tex;
      neuHimmel=mix(neuHimmel,str,decke*opaz);
    }
    col=col+himmel*(neuHimmel-S);
  }

  // Nasser Platz ohne Regenplatte (Abend, Nacht): Spiegelung der Gebaeudesockel, gekraeuselt
  float nassOhne=uNass*(1.0-uRegenPlatte*(uW.x+uW.y));
  if(nassOhne>0.01&&boden>0.01){
    float yb=0.866;
    float rip=(noise(vec2(u0.x*90.0,u0.y*260.0+uZeit*0.8))-0.5)*0.0018*(0.4+uRegenI);
    vec2 rr=vec2(u0.x+rip,2.0*yb-u0.y);
    vec3 sp=vec3(0.0);
    for(int k=0;k<3;k++){
      vec2 rk=rr+vec2(0.0,float(k)*0.006*(u0.y-yb)*4.0);
      if(uW.z>0.001)sp+=uW.z*textureLod(uBlau,rk,2.2).rgb;
      if(uW.w>0.001)sp+=uW.w*mix(textureLod(uSpaet,rk,2.2).rgb,textureLod(uNacht,rk,2.2).rgb,an);
      if(uW.x+uW.y>0.001)sp+=(uW.x+uW.y)*textureLod(uTag,rk,2.2).rgb;
    }
    sp/=3.0;
    float fres=1.0-smoothstep(yb,1.0,u0.y)*0.45;
    float hellig=smoothstep(0.12,0.7,lum(sp));
    col=col*mix(1.0,0.74,nassOhne*boden)+sp*boden*nassOhne*fres*(0.10+0.75*hellig);
  }

  // Schneedecke auf Platz, Hecken und Kronen
  if(deckeRest>0.01){
    float licht=uW.z*0.40+uW.w*0.10;
    vec3 sc=vec3(0.80,0.84,0.95)*licht+vec3(0.05,0.055,0.08);
    sc+=I*0.9;
    float wellig=0.92+0.10*noise(u0*vec2(30.0,80.0));
    float auf=boden*0.92+baum*0.35;
    col=mix(col,sc*wellig,clamp(auf,0.0,1.0)*deckeRest);
  }

  // Leuchten in der Daemmerung und Nacht: Hof um Logo, Fenster und Laternen; rote Flugwarnlichter blinken
  col+=G*(0.30+0.9*uNebel)*dunkel;
  {
