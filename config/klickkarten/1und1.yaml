# Klick-Karte 1&1 (Format 2, Stufe 6) für Produktseite und Tarifauswahl des Bestellwegs.
# Erkundung 20.11.2026 (Shop-Umbau desselben Tages, die Karte vom 09.10. steht als
# tests/fixtures/klickcrawler/einsundeins_karte_20261009.yaml): Fixtures
# tests/fixtures/klickcrawler/einsundeins_produktseite_20261120.html (iPhone 17,
# Ausschnitt) und …_tarifauswahl_20261120.html (Folgeseite nach „Weiter zur
# Tarifauswahl“, iPhone 17 512 GB, 24 Monate Fix, Ausschnitt).
#
# Ein Vertrag aus Gerät und Tarif. Die Produktseite wählt Speicher und Laufzeit (Reiter
# „36 Monate“, „24 Monate“, „Sofort“, darunter je „Fix“ und „+ 12 Monate Flex“); der Tarif
# steht erst auf der Folgeseite /flow2/mobile/ssc-private/tariffselect. Der Crawler wählt
# je Speicher × Laufzeit auf der Produktseite, klickt einmal „Weiter zur Tarifauswahl“
# (POST /frontend/cart-facade/add legt den Warenkorb an, danach nur GET/HEAD) und liest
# jede Tarifkachel der Folgeseite (sieben: All-Net-Flat S, M, L, Unlimited on demand S,
# M, L, Unlimited XL). Je Speicher × Laufzeit ein frischer Kontext; keine Kundendaten,
# kein weiterer Schritt.
#
# Je Kachel zwei Lesungen: Die Kachel trägt am Radio ``data-tariff-price-hint`` (JSON,
# serverseitig gerendert; dieselben Werte schickt die Seite an die Preisleiste):
# Geräterate ``hardwarePricePerMonth``, Tarifpreis ``tariffPricePerMonth``, Laufzeit
# ``hardwareSelectedTermMonths``, ``tariffName``. Sichtbar steht der Tarifpreis in der
# Kachel („14,99 10 , 99 €/Monat“, durchgestrichen der Listenpreis) und die Geräterate
# in der Preisleiste unten („iPhone 17 58,– €/Mon.“). Bündelbetrag = Geräterate +
# Tarifpreis, aus beiden Lesungen gleich, sonst Befund. Die Preisleiste zeigt die
# Summe nur für den vorausgewählten Tarif; ein Klick auf eine andere Kachel müsste die
# Leiste per POST (/frontend/cart-overview/price-summary-overlay) neu rechnen lassen,
# das Tor lässt nach dem Weiter nur GET und HEAD zu (Probe 20.11.: Leiste bleibt stehen).
#
# Bewusst nicht gelesen (Lücke): „+ 12 Monate Flex“ (dieselbe Laufzeitzahl wie Fix, aber
# 12 weitere Raten; Fix ist die Lesart von rechenweise Stufe 2), „Sofort“ (Gerät einmalig,
# eigene Preisform), Einmalzahlung (die Kachel nennt keine; Anschlusspreis kommt aus den
# Tarifdetail-Seiten der Übersichten).
anbieter: 1&1
vertragsform: ein_vertrag

knoepfe:
  speicher:
    # Produktseite 20.11.: label.variant-chooser__tile aria-label „Speicherauswahl
    # iPhone 17“ mit input name hw-apple-iphone-17.storage value 256/512.
    selektor: >-
      #hwd-configuration-section
      label.variant-chooser__tile:has(input[name$=".storage"])
    wert_in: input
    wert: value
    gewaehlt: {passt: ":has(input:checked)"}
  laufzeit:
    # Reiter der Zahlungsart: button.contract-toggle__contract data-target-model-id
    # contract-tab-36 / contract-tab-24 / contract-tab-sofort, gewählt aria-expanded.
    # „Sofort“ ist keine Laufzeit und wird nicht geklickt.
    selektor: >-
      .contract-toggle
      button.contract-toggle__contract:not([data-target-model-id="contract-tab-sofort"])
    wert: data-target-model-id
    muster: '^contract-tab-(\d+)$'
    gewaehlt: {attribut: aria-expanded, wert: "true"}
  tarif:
    # Kacheln der Tarifauswahl: je Tarif ein div.content-box mit
    # input[name=tariff-plan] value „tariff-anf-s-mvl-bundle-anf-s-mvl-oos-hw“. Dieselben
    # Kacheln stehen dreimal je Tarifbox; sichtbar ist nur die Box ohne d-none.
    selektor: >-
      .tariffbox:not(.d-none) .content-box:has(input[name="tariff-plan"])
    wert_in: 'input[name="tariff-plan"]'
    wert: value
    muster: '^(tariff-[a-z0-9-]+?)-bundle-'

weiter:
  # Knopf der Preisleiste (add-to-cart-button#price-summary-overlay-cta > button, Text
  # „Weiter zur Tarifauswahl“); data-linkid „sticky_bottom :: button :: Weiter zur
  # Tarifauswahl“.
  selektor: "#price-summary-overlay-cta > button"
  text: Weiter zur Tarifauswahl
  kacheln: tarif

vorbereitung:
  # Im gewählten Reiter ist „+ 12 Monate Flex“ vorgewählt (hwdOfferTermDefaultIsFlex);
  # gelesen wird „Fix“. Erreicht ist der Zustand erst, wenn auch der Weiter-Knopf
  # dieselbe Wahl trägt: sein Attribut config (der Warenkorb des Klicks) folgt dem
  # Radio erst nach der Antwort der Preisleiste (Probe 20.11.: 0,2–0,5 s; ohne
  # dieses Warten legte der Lauf „24-flex“ in den Warenkorb). Fehlt Fix im Reiter,
  # bleibt Flex stehen, und das Echo der Laufzeit (seite.laufzeit) macht die
  # Kombination zum Befund.
  - klick: >-
      .contract-toggle__payment-models:not(.d-none)
      label.toggle-label:has(input[value$="-fix"])
    pruefe: '.contract-toggle__payment-models:not(.d-none) input[value$="-fix"]'
    bis: >-
      :checked:is(body:has(#price-summary-overlay-cta[config*='-24-fix"'])
      #contract-tab-24 *, body:has(#price-summary-overlay-cta[config*='-36-fix"'])
      #contract-tab-36 *)
    darf_fehlen: true

bildfolge:
  # Der Beleg ist die Kachel der Tarifauswahl (Tarif und Tarifpreis); Speicher und
  # Laufzeit stehen nur auf der Produktseite davor.
  geraet_speicher: {ohne: "Der Speicher steht nur auf der Produktseite, das Bild entsteht auf der Tarifauswahl"}
  tarif: {ohne: "Die Tarifkachel selbst ist das Bild des Belegs"}
  laufzeit: {ohne: "Die Laufzeit steht nur auf der Produktseite, das Bild entsteht auf der Tarifauswahl"}

seite:
  # Auf der Produktseite vor dem Weiter gelesen (Echo „Seite zeigt“).
  speicher:
    selektor: '#hwd-configuration-section input[name$=".storage"]:checked'
    attribut: value
  laufzeit:
    # Der gewählte Radio im sichtbaren Reiter, nur „<n>-fix“ zählt.
    selektor: >-
      .contract-toggle__payment-models:not(.d-none) input.toggle-label__radio:checked
    attribut: value
    muster: '^(\d+)-fix$'

zusammenfassung:
  # Die Kachel selbst; dazu die Geräterate der Preisleiste als zweiter Teil der Summe.
  selektor: >-
    .tariffbox:not(.d-none) .content-box:has(input[name="tariff-plan"])
  # Ohne die Beschriftung des Radios („Unlimited“, „Unlimitiertes Datenvolumen.“):
  # die allgemeine Lesung nähme daraus ein Volumen, das die Antwort nicht nennt
  # (Lauf 20.11.: Unlimited XL „fehlt in der Antwort, Text unbegrenzt“).
  ohne:
    - .tariffbox:not(.d-none) .toggle-label__text
    - .tariffbox:not(.d-none) .toggle-label__sub-text
  muster:
    buendelbetrag:
      muster: '(\d+,\s*\d{2})\s*€/Monat'
      summe:
        - selektor: >-
            #pso [data-pso-main-monthly-section]
            > .price-summary-overlay__item:first-child .price-summary-overlay__item-price
          muster: '(\d+,(?:\d{2}|–))\s*€/Mon'
    # Dieselbe Rechnung aus dem Text der Preisleiste (aufgeklappt sichtbar: „Ratenzahlung
    # Hardware: 24 Monate | Gesamtpreis Hardware: 1.392,– €“, zugeklappt im DOM).
    einmalzahlung:
      selektor: >-
        #pso [data-pso-main-monthly-section]
        > .price-summary-overlay__item:first-child .price-summary-overlay__item-description
      muster: 'Gesamtpreis Hardware:\s*(\d[\d.]*,(?:\d{2}|–))\s*€'
      abzug:
        - selektor: >-
            #pso [data-pso-main-monthly-section]
            > .price-summary-overlay__item:first-child .price-summary-overlay__item-description
          muster: 'Ratenzahlung Hardware:\s*(\d+)\s*Monate'
        - selektor: >-
            #pso [data-pso-main-monthly-section]
            > .price-summary-overlay__item:first-child .price-summary-overlay__item-price
          muster: '(\d+,(?:\d{2}|–))\s*€/Mon'

antwort:
  kachel: 'input[name="tariff-plan"]'
  attribut: data-tariff-price-hint
  # Nur „Fix“: dieselbe Laufzeitzahl trägt auch „+ 12 Monate Flex“ (flex: true, 12
  # weitere Raten); eine Kachel mit flex ≠ false ist Befund mit Grund.
  gleich: {flex: false}
  pfade:
    buendelbetrag: {pfad: hardwarePricePerMonth, summe: [tariffPricePerMonth]}
    # Einmalige Gerätezahlung = genannter Gerätegesamtpreis − Raten × Geräterate
    # (Entscheidung 20.11.2026: Differenz zweier genannter Zahlen; 0 heißt gemessen
    # null, negativ oder fehlend ist eine Lücke). Der Gesamtpreis selbst als Nachweis.
    einmalzahlung:
      pfad: hardwareTotalPrice
      abzug: [hardwareSelectedTermMonths, hardwarePricePerMonth]
    geraetegesamtpreis: hardwareTotalPrice
    tarifname: tariffName
  variante:
    laufzeit: hardwareSelectedTermMonths

kanarie:
  # aria-label „Speicherauswahl iPhone 17“ (Katalog: „iPhone 17“).
  selektor: "#hwd-configuration-section label.variant-chooser__tile"
  attribut: aria-label
  enthaelt: "{modell}"
