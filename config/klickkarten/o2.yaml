# Klick-Karte o2, Format 2.
# Beleg: Klick-Erkundung vom 07.10.2026, Zweig klick-erkundung, Commit f31d5543,
# erkundung/o2/2026-10-07/ (Actions-Lauf 37582071155); Seite 1 Apple iPhone 17 Pro 256 GB,
# Seite 2 Samsung Galaxy S26. Kürzel: B1/B2 = bedienelemente-1/-2.json (Element),
# P1/P2 = preise-1/-2.json (Eintrag), M1/M2 = mitschnitt-1/-2.json (Antwort), K1/K2 =
# klicks-1/-2.json (Probe). priceSummary liegt im Mitschnitt hinter der Kürzung (rund 198 kB
# von 430–483 kB); belegt ist er in tests/fixtures/geraete/o2_vertiefung_iphone17pro.json.gz
# (pageValue und 14 Konfigurationsantworten vom 29.09.2026).
#
# Bewusst nicht gelesen:
# - Tarife ohne Kachel: die Antwort kennt 12 Tarife (M1 Nr. 133 tariff.tariffOptions), die Seite
#   bietet vier als Knöpfe (B1 El. 29–36); eine eigene Adresse je Tarif ist nicht belegt.
# - Farbe (Inputs mit name, B1 El. 17–22): ändert den Preis nicht.
# - Zubuchoptionen Onlineschutz und Connect-Option (B2 El. 42–55, B1 El. 38–41): nie geklickt.
anbieter: o2

knoepfe:
  speicher:
    # Ursache-Probe 04.11.2026 (arbeit/o2-klick-0411/ursache.md): alle Radios tragen
    # jetzt einen name (vorher nameless), Speicher steckt in <tef-choice-item> mit
    # Input name="storage" (meist nur eine Option, die Adresse legt den Speicher fest).
    selektor: 'tef-choice-item:has(input[name="storage"]) > label'
    muster: '^(\d+\s*[GT]B)\b'
    gewaehlt: {passt: 'tef-choice-item:has(input[name="storage"]:checked) > label'}
  tarif:
    # Kachel-Label im tef-choice-panel mit Input name="pdp-tariff-plans-desktop" (die
    # sichtbare Gruppe im 1280-px-Fenster; "tariff-plans-desktop" und
    # "tariff-plans-mobile" sind dieselben vier Kacheln, aber unsichtbar dort). Das
    # Label trägt den vollen Tarifnamen im eigenen aria-label, ohne Preis.
    selektor: 'tef-choice-panel:has(input[name="pdp-tariff-plans-desktop"]) > label'
    wert: aria-label
    gewaehlt:
      {passt: 'tef-choice-panel:has(input[name="pdp-tariff-plans-desktop"]:checked) > label'}
  laufzeit:
    # Kachel-Label im tef-choice-panel mit Input name="payment-plans" („36 Monate“,
    # „24 Monate“, „Einmalzahlung Gerät“ als erste Zeile des Labeltexts).
    selektor: 'tef-choice-panel:has(input[name="payment-plans"]) > label'
    muster: '^(\d+)\s*Monate'
    gewaehlt: {passt: 'tef-choice-panel:has(input[name="payment-plans"]:checked) > label'}

zusammenfassung:
  # Kein table mehr (Ursache-Probe 04.11.2026, arbeit/o2-klick-0411/ursache.md): das
  # Preiswidget ist <tef-mini-basket> mit <ul class="list--reset"><li class="row">
  # ... je Posten ein eigener <div>, kein <table>. „Gerät mtl. (36 Raten): 36,50 €“ heißt
  # jetzt „Gerät monatlich: 36,50 €“ + eigene Zeile „Ratenzahlung: 36 Monate“; „Tarif mtl.
  # (Mindestlaufzeit 24 Monate): 19,99 €“ heißt „Tarif monatlich: 19,99 €“ + eigene Zeile
  # „(Mindestlaufzeit 24 Monate):“ danach. „Gerät Anzahlung: 1,00 €“ und „einmaliger
  # Anschlusspreis 0,00 €“ unverändert. Daraus liest der Text ohne Muster Anzahlung,
  # Bindung und Anschluss (Bindung über das weiterhin generische „Mindestlaufzeit …
  # Monat“-Muster, unberührt von der Umstellung).
  selektor: '#content tef-mini-basket:visible:has-text("Gerät Anzahlung")'
  muster:
    # „Gerät monatlich:“ ohne Ratenzahl im selben Posten (die steht in „Ratenzahlung:“)
    rate: 'Gerät monatlich:\s*([\d.,]+)\s*€'
    # Ratenzahl jetzt eigener Posten „Ratenzahlung: 36 Monate“, nicht mehr im Geräteposten
    ratenzahl: 'Ratenzahlung:\s*(\d+)\s*Monate'
    # Zwischen dem Tarifbetrag und einer Folgephase steht jetzt „(Mindestlaufzeit 24
    # Monate):“ (eigene Zeile, kein Zeilenumbruch im gelesenen Text); die Lücke lässt das
    # ohne € durch, bis „ab dem 25. Monat: 29,99 €“ (O2 Mobile Special) folgt oder nicht.
    tarifphasen: 'Tarif monatlich:\s*(\d[\d.,]*\s*€(?:(?:(?!ab\s)[^€]){0,60}?ab\s+(?:dem\s+)?\d{1,2}\.\s*Monat:?\s*\d[\d.,]*\s*€)*)'
    # Volumen nur an der gewählten Kachel: „Unlimited“ oder „50 GB+“
    volumen_gb:
      selektor: 'tef-choice-panel:has(input[name="pdp-tariff-plans-desktop"]:checked) > label'
      muster: '(Unlimited|\d+\s*GB)'

antwort:
  # Nach jedem Klick GET /e-shop/rest/configuration/<Base64> (M1 Nr. 133, 135, 138;
  # M2 Nr. 131, 133, 135, 137). Pfade der Variante in M1 Nr. 133–138 und M2 Nr. 131–137,
  # die der Preise in o2_vertiefung_iphone17pro.json.gz.
  - url_muster: '^https://www\.o2online\.de/e-shop/rest/configuration/'
    pfade: &pfade
      # nonRecurring „Gerät Anzahlung:“ „1,00 €“
      anzahlung: 'priceSummary.nonRecurringChargesListEntries[description=Gerät Anzahlung:].amount'
      # recurring [0] „Gerät mtl. (36 Raten):“ „36,50 €“
      rate: priceSummary.recurringChargesListEntries.0.amount
      ratenzahl: priceSummary.recurringChargesListEntries.0.description
      # recurring [1] „Tarif mtl. (Mindestlaufzeit 24 Monate):“ „19,99 €“; beim Tarif
      # O2 Mobile Special dazu [2] „ab dem 25. Monat: 29,99 €“ ohne amount. Die Liste ergibt die
      # Phasen wie die Tabelle.
      tarifphasen: priceSummary.recurringChargesListEntries
      tarifbindung: priceSummary.recurringChargesListEntries.1.description
      anschluss: 'priceSummary.nonRecurringChargesListEntries[description=einmaliger Anschlusspreis].amount'
      # „-1“ unbegrenzt, „153600+“ = 150 GB (M1 Nr. 133, 135, 138)
      volumen_gb: {pfad: 'tariff.tariffOptions[selected=true].dataVolumeMbNumeric', einheit: mb}
      # Pitch 3 (10.10.2026): Satz des Ratenplan-Hinweises, gemessen am 07.10.2026
      # (ratenlaufzeit.py); mit dem Tarifcode "-hwv-<n>m-" Beleg für Monat 1 bis n.
      ratenplan:
        pfad: hardware.contents.selectedHardwareRateDurationModal.infoBody
        muster: '([^.<>]*über die gesamte Laufzeit deines Geräte-Ratenplans[^.<>]*Rabatt auf deinen Tarif\.)'
    variante: &variante
      # „256 GB“, „24 Monate“, „O<sub>2</sub> Mobile Unlimited L Plus mit 300 MBit/s“
      speicher: 'hardware.storageOptions[selected=true].displayValue'
      laufzeit: 'hardware.paymentOptions[selected=true].displayValue'
      tarif: 'tariff.tariffOptions[selected=true].displayValue'
  # Ausgangszustand vor dem ersten Klick: dasselbe JSON in script#pageValue
  # (o2_vertiefung_iphone17pro.json.gz, Produktseite)
  - skript: 'script#pageValue'
    start: true
    pfade: *pfade
    variante: *variante

kanarie:
  # Tarifzeile des Preiswidgets (Ursache-Probe 04.11.2026): kein table mehr, die
  # Mindestlaufzeit steht als eigene Zeile hinter dem Tarifbetrag statt im selben Posten.
  selektor: '#content tef-mini-basket:visible:has-text("Gerät Anzahlung")'
  enthaelt: '(Mindestlaufzeit'
