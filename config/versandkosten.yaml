# =============================================================================
# VERSANDKOSTEN - der Pflichtversand je Anbieter
# =============================================================================
# Ein Betrag je Anbieter, einmalig, in der Kernzahl "Kosten ueber H Monate"
# (src/telco_radar/versandkosten.py; im Code kein Sonderfall je Anbieter).
#
#   betrag      Euro brutto, wie die Kostenuebersicht vor der Kasse ihn nennt.
#               0 heisst: in der Kostenuebersicht kein Versandposten (siehe
#               hinweis je Anbieter: ausdruecklich kostenlos oder keine Zeile).
#               null heisst: nicht belegt - dann
#               zaehlt der Versand 0 EUR und die Seite nennt die Luecke
#               ("Versand bei X nicht belegt"). Nie raten.
#   quelle      die Seite am Original, auf der gemessen wurde
#   datum       Tag der Messung
#   screenshot  Beleg, ausserhalb des Repos (Bereich telcoradar/abnahme)
#
# Gemessen mit Playwright (normales Chromium, Standard-User-Agent, ohne Stealth,
# robots.txt beachtet, kein Konto, nichts bestellt) bis zur Kostenuebersicht vor
# der Kasse. Jede Aenderung eines Betrags braucht eine neue Messung mit Datum.
