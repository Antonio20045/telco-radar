# =============================================================================
# TELCO RADAR - Goldliste der Abnahme (Datenkonzept Geräte, Abschnitt 11)
# =============================================================================
# Je Netzbetreiber höchstens 10 feste Varianten, die ein Mensch täglich gegen
# die Anbieterseite prüft (Stichprobe Mensch, Protokoll docs/abnahme/proben.jsonl,
# Format in src/telco_radar/analyze/geraete_abnahme.py). Die erste Variante je
# Anbieter ist die Beispielseite iPhone 17 Pro 256 GB im Band XS (Abschnitt 2);
# wo die Beispielseite zwei Zeilen hat (1&1, congstar), steht die zweite an
# zweiter Stelle.
#
# Schlüssel, nie Titeltext: device_id aus config/geraete_katalog.yaml,
# speicher_gb, farbe wie in der SKU, tarif_name wie im Bündelbestand,
# laufzeit_monate (Ratenlaufzeit). analyze/geraete_goldliste.py löst jede
# Variante zu genau einem Bündel auf oder nennt den Befund (nicht gefunden,
# mehrdeutig); scripts/abnahme_stand.py druckt das Ergebnis.
#
# Gewählt aus data/state/geraete_tco.json, Stand 2026-10-06, gestreut über
# Geräte, Bänder und Laufzeiten. Band nach der Vodafone-Tarifleiter dieses
# Tages. "Schätzung": das Bündel trägt `herleitung` und zählt nicht im
# Vergleich, steht aber als Zeile mit Betrag auf der Seite; "veraltet": eine
# eingerechnete Aktion ist abgelaufen.
#
# Lücken im Bestand (Stand 2026-10-06):
#   freenet/mobilcom-debitel  kein Bündel und keine Gerätequelle; 0 von 10
#   1&1       nur 36 Raten; zählend nur 1&1 All-Net-Flat S, Rest Schätzung
#   Telekom   nur 36 Raten, Stand 15.09. und 09.09.; nur 9 Geräte, deshalb
#             das iPhone 17 Pro zweimal (Band XS und XL)
#   o2        zählend nur die Bänder M, L und XL; XS nur als Schätzung
#   congstar  kein Band S; die Beispielseite ist veraltet (Stand 28.09.,
#             Aktion bis 29.09.)
# =============================================================================

