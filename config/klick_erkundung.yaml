# =============================================================================
# TELCO RADAR - Klick-Erkundung (Datenkonzept Geräteradar, Schritt 5a)
# =============================================================================
# Je Anbieter ein bis zwei Produktseiten, auf denen `scripts/klick_erkunden.py`
# das Material für die Klick-Karte holt: gerenderte Seite, Bedienelemente,
# Preis-Kandidaten, Mitschnitt, Klick-Effekte und Screenshot. Geladen wird über
# denselben Kontext und dasselbe Tor wie der Klick-Crawler (robots.txt samt
# Crawl-delay und Visit-time je Anfrage, Bot-Schutz heißt „gestört“).
#
# DIE ADRESSEN SIND NICHT ZUSAMMENGESETZT. Jede steht wörtlich als
# `quelle_url` im Bestand des Geräteradars (data/state/geraete_db.json bzw.
# geraete_tco.json, Stand 06.10.2026), also auf einer Seite, die der Anbieter
# selbst verlinkt. Wo der Bestand die Bündelansicht kennt (o2 mit
# `ohne-tarif=nein`, Telekom mit `tariffId`), steht sie. freenet führt im
# Bestand nur die Seiten „ohne Vertrag“; dort zeigt der Link „Passenden Vertrag
# auswählen“ die Bündelliste je Gerätevariante. Diese Adressen stehen wörtlich
# als `href` in der Erkundung vom 07.10.2026 (Zweig klick-erkundung,
# erkundung/freenet/2026-10-07/bedienelemente-1.json Element 107 und
# bedienelemente-2.json Element 105).
#
# Felder:
#   schluessel  Ordnername unter erkundung/ und Wert der Workflow-Eingabe
#   name        Anbieter wie in config/geraete_quellen.yaml (User-Agent,
#               rate_limit_sekunden und basis_url kommen von dort)
#   seiten      höchstens zwei; `geraet` ist eine device_id aus
#               config/geraete_katalog.yaml, `speicher_gb` muss dort stehen
#   weiter      optional je Seite: `selektor` (CSS) und `text` (sichtbar) für
#               genau EINEN Knopf oder Link zum nächsten Schritt der
#               Bestellstrecke. Nach Seite und Kartenprobe klickt die
#               Erkundung ihn einmal und hält die Folgeseite als eigene Seite
#               fest, ohne Klick-Proben (klickfolgeseite.py); danach gehen nur
#               noch GET und HEAD hinaus. Anmeldung, Checkout oder Zahlung dort
#               sind ein Befund. Die Element-Nummern im Kommentar
#               stehen in bedienelemente-<n>.json der Erkundung vom
#               07.10.2026 (Zweig klick-erkundung; 1und1 Commit f31d5543,
#               vodafone Commit 9dfe7a9e).
# =============================================================================

anbieter:
  - schluessel: o2
    name: o2
    seiten:
      - geraet: apple-iphone-17-pro
        speicher_gb: 256
        url: https://www.o2online.de/e-shop/apple/apple-iphone-17-pro-256gb-silber-details?ohne-tarif=nein&zielgruppe=privatkunden&ratenzahlung=36&vertragsart=ratenzahlung&tarif=o2-mobile-unlimited-m-plus
      - geraet: samsung-galaxy-s26
        speicher_gb: 256
        url: https://www.o2online.de/e-shop/samsung/samsung-galaxy-s26-256gb-cobalt-violet-details?ohne-tarif=nein&zielgruppe=privatkunden&ratenzahlung=36&vertragsart=ratenzahlung&tarif=o2-mobile-unlimited-m-plus

  - schluessel: vodafone
    name: Vodafone
    seiten:
      # Den Tarif wählt man erst nach „Zur Tarifauswahl“: Link auf
      # /privat/handys-tablets-tarife/alle-tarife-mit-vertrag.html, die
      # Gerätewahl reist im Browserzustand mit. Element 267 (Seite 1) bzw.
      # 230 (Seite 2), sichtbar, target _self; der Link daneben
      # (268 bzw. 231, „Vertrag verlängern“, Anmeldung) trägt die Klasse nicht.
      - geraet: apple-iphone-17-pro
        speicher_gb: 256
        url: https://www.vodafone.de/privat/handys/iphone-17-pro.html
        weiter:
          selektor: "#device-details-offer-summary-card a.ws10-button--primary"
          text: Zur Tarifauswahl
      - geraet: samsung-galaxy-s26
        speicher_gb: 256
        url: https://www.vodafone.de/privat/handys/samsung-galaxy-s26.html
        weiter:
          selektor: "#device-details-offer-summary-card a.ws10-button--primary"
          text: Zur Tarifauswahl

  - schluessel: 1und1
    name: 1&1
    seiten:
      # PROBE Pitch 2 Schnitt 1 (nur auf dem Probezweig): Geräteraster je Tarif
      # (Adressen wörtlich im Bestand, data/state/geraete_db.json) und der Link
      # „Smartphone wählen“ der iPhone-17-Pro-Kachel. Frage: trägt die Produktseite
      # nach dem Raster den Tarif des Rasters?
      - geraet: apple-iphone-17-pro
        speicher_gb: 256
        url: https://mobile.1und1.de/smartphones-unlimited-m
        weiter:
          selektor: 'form.hardware-box:has(a.hardware-box__heading[href="https://mobile.1und1.de/iphone-17-pro?tariffFirst=true"]) .hardware-box__button a.btn'
          text: Smartphone wählen
      - geraet: apple-iphone-17-pro
        speicher_gb: 256
        url: https://mobile.1und1.de/smartphones-all-net-flat-l
        weiter:
          selektor: 'form.hardware-box:has(a.hardware-box__heading[href="https://mobile.1und1.de/iphone-17-pro?tariffFirst=true"]) .hardware-box__button a.btn'
          text: Smartphone wählen

  - schluessel: telekom
    name: Telekom
    seiten:
      - geraet: apple-iphone-17-pro
        speicher_gb: 256
        url: https://www.telekom.de/shop/geraet/apple/apple-iphone-17-pro/tiefblau-256-gb?tariffId=MF_17791&categoryId=smartphones&forwardTradeInApplied=false
      - geraet: google-pixel-11
        speicher_gb: 256
        url: https://www.telekom.de/shop/geraet/google/google-pixel-11/frost-256-gb?tariffId=MF_17791&categoryId=smartphones&forwardTradeInApplied=false

  - schluessel: congstar
    name: congstar
    seiten:
      - geraet: apple-iphone-17-pro
        speicher_gb: 256
        url: https://www.congstar.de/geraete/apple/apple-iphone-17-pro/
      - geraet: samsung-galaxy-s26
        speicher_gb: 256
        url: https://www.congstar.de/geraete/samsung/samsung-galaxy-s26/

  - schluessel: freenet
    name: mobilcom-debitel
    seiten:
      - geraet: apple-iphone-17-pro
        speicher_gb: 256
        url: https://www.freenet.de/b/tariffs_postpaid_voice/P-M-4234664/?fl=bundle&v=P-4356815
      - geraet: google-pixel-10
        speicher_gb: 256
        url: https://www.freenet.de/b/tariffs_postpaid_voice/P-M-4206117/?fl=bundle&v=P-4292934
