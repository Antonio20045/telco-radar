  # ===========================================================================
  # NEUES THEMENFELD (05.08.2026): Passive Infrastruktur
  # ===========================================================================
  # Funktuerme, Glasfaser und Rechenzentren. Wer diese Anlagen besitzt,
  # bestimmt die groesste Kostenposition eines Netzbetreibers und darueber,
  # wie schnell er ueberhaupt ausbauen kann - naeher am Geschaeft als mancher
  # Chiphersteller. Vodafone hat mit Vantage Towers selbst einen Turmbetreiber
  # abgespalten, die Frage ist also nicht theoretisch.
  #
  # Bewusst klein gestartet: ob die Kategorie traegt, entscheidet die
  # Trefferquote (scripts/quellen_trefferquote.py) nach den ersten Laeufen,
  # nicht eine Annahme beim Eintragen. Von 18 gesuchten Firmen hat genau eine
  # einen abnahmefaehigen Kanal - die uebrigen liefern entweder gar keinen
  # Feed oder reine SEO-Ratgeberblogs (Deutsche Glasfaser: "Handy kostenlos
  # orten: So finden Sie ein verlorenes Smartphone wieder").
  infrastruktur:
    name: "Türme, Glasfaser & Rechenzentren"
    beschreibung: >-
      Die Eigentuemer der passiven Infrastruktur - Funktuerme, Glasfasernetze
      und Rechenzentren. Sie bestimmen die Kostenseite und das Tempo des
      Netzausbaus, ohne selbst Endkunden zu haben.
    quellen:
      # Welle 3c: der US-Glasfaserverband. Er buendelt, was die amerikanischen
      # Netzbetreiber gemeinsam beim Ausbau planen und fordern.
      - {name: "Fiber Broadband Association", type: json_api, url: "https://www.fiberbroadband.org/wp-json/wp/v2/posts?per_page=25&_embed=1", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # Welle 3d: das europaeische Gegenstueck. Der Verband hat sich gerade von
      # FTTH Council Europe in Fibre Council Europe umbenannt.
      - {name: "Fibre Council Europe", type: newsroom, url: "https://fibrecouncil.eu/news/news-library", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # Italiens groesster Turmbetreiber, hervorgegangen aus TIM und Vodafone.
      - {name: "INWIT", type: rss, url: "https://www.inwit.it/en/feed/", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
      # Glasfaser-Grosshandel in Nordamerika: wer Zayo mietet, baut nicht
      # selbst - und Zayos Preise sind die Kostenseite vieler Betreiber.
      # Frische-Ausnahme belegt: Meldungen etwa monatlich, neueste 23.07.2026.
      - {name: "Zayo", type: rss, url: "https://www.zayo.com/feed/", herkunft: "Firmenliste (Breitensuche)", abgenommen: "2026-08-05"}

  # ===========================================================================
  # NEUES THEMENFELD (05.08.2026): MVNO, eSIM & Kommunikationsplattformen
  # ===========================================================================
  # Die Anbieter, die Betreibern Umsatz abnehmen, ohne ein Netz zu besitzen:
  # eSIM-Reisepakete statt Roaming, CPaaS-Plattformen statt SMS-Geschaeft,
  # IoT-Konnektivitaet quer ueber alle Netze. Genau die Stelle, an der einem
  # Netzbetreiber heute Erloese wegbrechen - und die Anbieter melden ihre
  # Abschluesse selbst, oft Monate bevor ein Betreiber es zugibt.
  #
  # Auch hier gilt: die Kategorie ist ein Versuch, keine Setzung. Nicht
  # aufgenommen wurden Twilio (reiner Entwicklerblog) und Thales (Konzern von
  # Ruestung bis Chipkarte, entsprechend wenig Telekommunikation je Abruf).
  mvno:
    name: "MVNO, eSIM & Plattformen"
    beschreibung: >-
      Anbieter ohne eigenes Netz, die Betreibern Erloese abnehmen: eSIM- und
      Reisedatenpakete, Nachrichtenplattformen (CPaaS) und netzuebergreifende
      IoT-Konnektivitaet.
    quellen:
      # eSIM- und SIM-Technik fuer Betreiber weltweit; meldet die Vertraege,
      # bevor die Betreiber sie kommunizieren.
      - {name: "IDEMIA", type: rss, url: "https://www.idemia.com/feed", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
      # Eine der grossen CPaaS-Plattformen: geschaeftliche Nachrichten laufen
      # ueber sie statt ueber die SMS-Abrechnung des Netzbetreibers.
      - {name: "Infobip", type: rss, url: "https://www.infobip.com/news/feed", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
      # Sponsored Roaming und eSIM-Anbindung - genau das Geschaeft, das
      # klassische Roaming-Erloese ersetzt.
      - {name: "Telna", type: rss, url: "https://www.telna.com/blog/rss.xml", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
      # Netzuebergreifende IoT-Konnektivitaet (Tochter von NTT). Zeigt, welche
      # Industriekunden ihre Geraete NICHT mehr bei einem einzelnen Betreiber
      # anbinden.
      - {name: "Transatel", type: rss, url: "https://www.transatel.com/feed/", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
      # eSIM fuer Geschaeftskunden - der Anbieter, der Konzernen Mobilfunk
      # ueber Laendergrenzen verkauft, ohne dass ein Betreiber den Vertrag
      # sieht. Frische-Ausnahme belegt: 40 Meldungen im Abruf, neueste
      # 28.07.2026.
      - {name: "1GLOBAL (Truphone)", type: rss, url: "https://www.1global.com/rss", herkunft: "Firmenliste (Breitensuche)", abgenommen: "2026-08-05"}
      # Roaming- und Interconnect-Grosshandel (Tochter von Proximus): der
      # Zwischenhaendler, ueber den Roaming-Erloese laufen.
      # Frische-Ausnahme belegt: neueste Meldung im Abruf 16.07.2026.
      - {name: "BICS", type: rss, url: "https://www.bics.com/feed/", herkunft: "Firmenliste (Breitensuche)", abgenommen: "2026-08-05"}
      # Zweite grosse CPaaS-Plattform neben Infobip. Frische-Ausnahme belegt:
      # neueste Meldung im Abruf 20.07.2026.
      - {name: "Sinch", type: rss, url: "https://sinch.com/blog/feed/", herkunft: "Firmenliste (Breitensuche)", abgenommen: "2026-08-05"}
