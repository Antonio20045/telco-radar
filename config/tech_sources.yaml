# =============================================================================
# TELCO RADAR - Themenfelder (dritte Signalebene)
# =============================================================================
# Was den Telco-Markt veraendert, kommt laengst nicht nur von anderen
# Netzbetreibern: KI-Anbieter, Geraete- und Chiphersteller, Netzausruester,
# Satellitenbetreiber und Regulierer entscheiden mit, was ein Netz kann, was
# ein Handy unterstuetzt, was etwas kostet und was erlaubt ist.
#
# WARUM EINE EIGENE DATEI und nicht die Watchlist:
# Nvidia, Qualcomm, die GSMA oder Ofcom sind keine Netzbetreiber. In der
# Watchlist braeuchten sie eine Region und einen Alias-Eintrag - beides falsch.
# Schlimmer: das Alias-Tagging der Fachpresse wuerde anfangen, jede Meldung
# mit "Nvidia" im Titel einer Region zuzuschlagen, und die Rundlauf-Sortierung
# wuerde sie gegen echte Betreibermeldungen antreten lassen. Hier tragen sie
# stattdessen ein Themen-Tag; jedes Themenfeld laeuft als eigener Analyst
# (mit eigenem Prompt, siehe analyze/agents.py::TECH_ANALYST_SYSTEM) und
# bekommt im Wochenbericht einen eigenen Abschnitt.
#
# ABNAHME: Jede Quelle hier ist mit
#   python scripts/pruefe_quellenvorschlag.py <datei> --no-overlap
# durch die Kriterien aus AUFTRAG_QUELLEN_AUSBAU.md Abschnitt 4 gelaufen
# (>= 5 Meldungen, >= 80 % datiert, >= 1 im Frischefenster, echte
# Ueberschriften, eigene Domain, keine Dublette, kein newsroom_js).
# Nichts kommt hier ohne PASS hinein.
#
# Quellentypen wie in der Watchlist: rss | json_api | newsroom.
# =============================================================================

themen:
  ki:
    name: "KI-Anbieter"
    beschreibung: >-
      Die Anbieter der Modelle, die Betreiber in Tarife, Kundenservice und
      Netzbetrieb einbauen. Sie bestimmen, was ein "KI-Tarif" ueberhaupt
      enthalten kann und was er kostet.
    quellen:
      # Der offizielle News-Feed von OpenAI. Produkt- und Partnerschafts-
      # meldungen laufen hier zuerst - inklusive der Telco-Deals, die spaeter
      # als Betreiber-Pressemitteilung erscheinen.
      - {name: "OpenAI", type: rss, url: "https://openai.com/news/rss.xml"}
      # Google DeepMind: Modellgenerationen und Forschung, die 6-12 Monate
      # spaeter in Android- und Pixel-Funktionen landen.
      - {name: "Google DeepMind", type: rss, url: "https://deepmind.google/blog/rss.xml"}
      # Googles eigener KI-Blog - naeher am Produkt als DeepMind und damit
      # naeher an dem, was Endkunden bei ihrem Mobilfunkanbieter erwarten.
      - {name: "Google AI", type: rss, url: "https://blog.google/technology/ai/rss/"}
      # Metas Newsroom. Relevant weniger wegen der Modelle als wegen WhatsApp
      # und der Business-Messaging-Umsaetze, an denen Betreiber mitverdienen.
      - {name: "Meta", type: rss, url: "https://about.fb.com/news/feed/"}
      # Nvidia steht im Auftrag unter den KI-Anbietern, nicht unter Chips:
      # fuer Betreiber zaehlt vor allem das AI-RAN- und Edge-Geschaeft.
      - {name: "Nvidia Blog", type: rss, url: "https://blogs.nvidia.com/feed/"}
      # Zweiter Nvidia-Kanal, bewusst zusaetzlich: der Blog erklaert Technik,
      # der Newsroom meldet Vertraege und Partnerschaften. Inhaltlich getrennt,
      # deshalb keine Dublette.
      - {name: "Nvidia Newsroom", type: rss, url: "https://nvidianews.nvidia.com/releases.xml"}
      # Anthropic hat keinen Feed; die Newsroom-Seite ist statisch abrufbar.
      # Einschraenkung, ehrlich benannt: der Parser bekommt Ueberschrift,
      # Datum und Anrisstext als EINE Zeile ("Introducing Claude Opus 5
      # Product Jul 24, 2026 Opus 5 is a step change ..."). Die Ueberschrift
      # steht vorn, der Titel bleibt also lesbar - schoen ist er nicht. Vier
      # item_selector-Varianten wurden probiert, keine trennt sauber.
      - {name: "Anthropic", type: newsroom, url: "https://www.anthropic.com/news", item_selector: "article"}
      # Microsofts offizieller Azure-Blog. blogs.microsoft.com/ai ist seit
      # 2026 abgeschaltet (HTTP 410); hier laufen die Telco-relevanten
      # Meldungen ("AT&T and Microsoft scale trillion-token workloads").
      # Publiziert unregelmaessig, im Abruf lag die neueste Meldung genau auf
      # der Grenze des Frischefensters.
      - {name: "Microsoft Azure", type: rss, url: "https://azure.microsoft.com/en-us/blog/feed/"}

  geraete:
    name: "Geräte"
    beschreibung: >-
      Was ein Endgeraet kann, entscheidet, was ein Betreiber verkaufen kann -
      von eSIM ueber Satellitenfunk bis zu KI-Funktionen, die Datenvolumen
      erzeugen.
    quellen:
      # Apples Newsroom ist der Taktgeber fuer eSIM, Satelliten-Notruf und
      # Geraetefinanzierung - alles Themen, die direkt auf Tarife durchschlagen.
      - {name: "Apple", type: rss, url: "https://www.apple.com/newsroom/rss-feed.rss"}
      # Samsung Global Newsroom: Geraetestarts und Netzsparte in einem Feed.
      - {name: "Samsung", type: rss, url: "https://news.samsung.com/global/feed"}
      # Androids Produktblog. Systemfunktionen (RCS, eSIM-Transfer, Satellit)
      # erscheinen hier, bevor die Betreiber sie unterstuetzen muessen.
      - {name: "Android", type: rss, url: "https://blog.google/products/android/rss/"}
      # Lenovo fuehrt Motorola; Motorola-Geraetestarts laufen ueber diesen Feed.
      - {name: "Lenovo / Motorola", type: rss, url: "https://news.lenovo.com/feed/"}
      # Pixel ist Googles Referenzgeraet: was hier zuerst erscheint (eSIM,
      # Satellit, KI-Funktionen), muessen Betreiber spaeter unterstuetzen.
      # Der Blog publiziert schubweise rund um Geraetestarts - im Abruf war
      # die neueste Meldung vom 14.07.2026 und damit ausserhalb des Fensters.
      - {name: "Google Pixel", type: rss, url: "https://blog.google/products-and-platforms/devices/pixel/rss/"}

  chips:
    name: "Chips & Modems"
    beschreibung: >-
      Modem- und SoC-Generationen legen Jahre im Voraus fest, welche
      Netzfunktionen (5G-SA, NTN, RedCap) ueberhaupt in Geraeten ankommen.
    quellen:
      # Arm-Newsroom: Architektur-Ankuendigungen, die den gesamten
      # Smartphone- und Basisstationsmarkt betreffen.
      - {name: "Arm", type: rss, url: "https://newsroom.arm.com/rss"}
      # Broadcom veroeffentlicht seine Produkt- und Vertragsmeldungen ueber
      # die Investor-Relations-Seite; ein separater Presse-Feed existiert nicht.
      - {name: "Broadcom", type: rss, url: "https://investors.broadcom.com/rss/news-releases.xml"}
      # MediaTek beliefert die Mittelklasse, also den Massenmarkt der
      # Betreiber. Die Meldungen sind ungewoehnlich netznah ("MediaTek and
      # Samsung Achieve 3Tx 5-Layer Uplink Breakthrough"). Publiziert
      # monatlich; neueste Meldung im Abruf vom 03.06.2026.
      - {name: "MediaTek", type: rss, url: "https://www.mediatek.com/press-room/rss.xml"}
      # Intel ist ueber Netzwerk-Silizium und Edge-Infrastruktur im Spiel,
      # nicht ueber Smartphone-Modems - fuer den Netzbetrieb trotzdem relevant.
      - {name: "Intel", type: rss, url: "https://newsroom.intel.com/feed"}

      # ---- Welle 2 (Themenfelder und Regulierung), abgenommen 2026-08-04
      # UWB, NFC und Secure Elements - die Bausteine hinter eSIM, digitalem
      # Autoschluessel und Bezahlen im Handy. 10/10 datiert, 10 eindeutige
      # Titel, neueste 04.08.2026 ("NXP Trimension Ultra-Wideband Powers BMW
      # Group's Digital Key Plus"). Gute Mischung aus Produkt und
      # Finanzkalender. Abnahme: 10 Meldungen, 10 datiert, 2 im
      # Frischefenster.
      - {name: "NXP Semiconductors", type: "rss", url: "https://investors.nxp.com/rss/news-releases.xml", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
  netzausruester:
    name: "Netzausrüster"
    beschreibung: >-
      Ericsson, Nokia, Huawei & Co. bauen die Netze, ueber die alles laeuft.
      Ihre Ankuendigungen zeigen Monate vorher, welche Funktionen Betreiber
      als naechstes ausrollen koennen.
    quellen:
      # ericsson.com sperrt jeden Abruf aus der Sandbox mit 403. Cision ist
      # Ericssons offizieller Verbreitungsweg - dieselbe Ausnahme wie bei
      # Telia in der Watchlist, und mit demselben item_selector.
      - {name: "Ericsson", type: newsroom, url: "https://news.cision.com/ericsson", item_selector: ".card-item"}
      # HPE hat Juniper uebernommen und fuehrt dessen Carrier-Geschaeft
      # weiter; der Newsroom ist der einzige der grossen westlichen
      # Ausruester-Feeds, der zuverlaessig antwortet.
      - {name: "HPE (Juniper)", type: rss, url: "https://www.hpe.com/us/en/newsroom/rss.xml"}
      # Nokia. Achtung bei der Bewertung dieser Quelle: nokia.com antwortet
      # unter Last zeitweise mit 403 - beim ersten Anlauf sah der Feed deshalb
      # tot aus. In sechs Abrufen hintereinander lieferte er dann sechsmal 25
      # von 25 datierten Meldungen. Der 403 ist eine Drosselung, kein Block.
      # Der Feed mischt Insider-Meldepflichten ("Managers' transactions") mit
      # den eigentlichen Produktmeldungen ("Nokia defines the next era of
      # radio with the industry's first AI-native RAN platform"); der Analyst
      # sortiert Ersteres aus.
      - {name: "Nokia", type: rss, url: "https://www.nokia.com/newsroom/feed/"}

      # ---- Welle 2 (Themenfelder und Regulierung), abgenommen 2026-08-04
      # Optischer Transportnetz-Ausruester; Blue-Planet-Automatisierung laeuft
      # bei europaeischen Betreibern. 10 von 10 Meldungen datiert, 10
      # eindeutige Titel, neueste vom 04.08.2026. Inhalt ist ueberwiegend
      # echte Technik- und Kundenmeldung, nicht Finanzkalender ("Telefonica
      # Deutschland and Blue Planet Demonstrate How AI Agents Can Accelerate
      # 5G Network Slicing"). ciena.com selbst antwortet mit Cloudflare-403 -
      # nur der IR-Host ist erreichbar. Abnahme: 10 Meldungen, 10 datiert, 1
      # im Frischefenster.
      - {name: "Ciena", type: "rss", url: "https://investor.ciena.com/rss/pressrelease.aspx?T=1", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Glasfaser-Zugangstechnik (PON) und Netzsynchronisation, seit der
      # ADVA-Uebernahme auch in Europa relevant. 10/10 datiert, 10 eindeutige
      # Titel, neueste 04.08.2026, darunter "TOHKnet and Adtran conduct
      # Japan's first 50G PON trial on a live network" - genau die Art
      # Meldung, die Monate vor dem Betreiber-Rollout kommt. Etwa jede dritte
      # Zeile ist Finanzkalender. Abnahme: 10 Meldungen, 10 datiert, 2 im
      # Frischefenster.
      - {name: "Adtran", type: "rss", url: "https://investors.adtran.com/rss/pressrelease.aspx?T=1", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Groesster Glasfaser-Hersteller der Welt; Kapazitaets- und
      # Preisentscheidungen hier schlagen auf jeden Glasfaserausbau durch.
      # 10/10 datiert, 9 von 10 eindeutigen Titeln (die Dividendenmeldung
      # wiederholt sich), neueste 28.07.2026. EINSCHRAENKUNG ehrlich benannt:
      # im Abruf waren 7 der 10 Meldungen Finanzkalender/Dividende. Wert der
      # Quelle haengt daran, ob der Analyst die Kapazitaetsmeldungen
      # ("Springboard Plan") erkennt. Abnahme: 10 Meldungen, 10 datiert, 1 im
      # Frischefenster.
      - {name: "Corning", type: "rss", url: "https://investor.corning.com/rss/pressrelease.aspx?T=1", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Ergiebigste Quelle dieser Runde: 30 Meldungen je Abruf, 30/30 datiert,
      # 30 eindeutige Titel, neueste 29.07.2026. NEC baut Open-RAN-Radios und
      # Seekabelsysteme und ist Nokias und Ericssons Herausforderer in Japan.
      # HINWEIS: der Feed ist Konzernbreite - es laufen auch Halbleiter-,
      # Bahn- und Behoerdenmeldungen mit, der Themenanalyst muss aussortieren.
      # Abnahme: 30 Meldungen, 30 datiert, 1 im Frischefenster.
      - {name: "NEC", type: "rss", url: "https://www.nec.com/en/press/rss.xml", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Sprachkern (IMS/VoIP) und optische Aggregation - der Teil des Netzes,
      # den Vodafone gerade von TDM auf IP umbaut. 10/10 datiert, 10
      # eindeutige Titel, neueste 28.07.2026, Mischung aus Kundenmeldungen und
      # Quartalszahlen. Abnahme: 10 Meldungen, 10 datiert, 1 im
      # Frischefenster.
      - {name: "Ribbon Communications", type: "rss", url: "https://investors.ribboncommunications.com/rss/news-releases.xml", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
  satellit:
    name: "Satellit & NTN"
    beschreibung: >-
      Direct-to-Cell verschiebt gerade die Grenze zwischen Mobilfunk und
      Satellit - und damit die Frage, wofuer Kunden ihren Betreiber brauchen.
    quellen:
      # AST SpaceMobile baut das Direct-to-Cell-Netz, mit dem Vodafone in
      # Europa arbeitet - die Meldungen zu Satellitenstarts sagen direkt,
      # wann der Dienst wo verfuegbar wird. Publiziert um Starts herum;
      # neueste Meldung im Abruf vom 17.06.2026.
      - {name: "AST SpaceMobile", type: rss, url: "https://ast-science.com/feed/"}

      # ---- Welle 2 (Themenfelder und Regulierung), abgenommen 2026-08-04
      # Betreibt das L-Band-Netz (Inmarsat) und arbeitet mit Skylo an
      # Direct-to- Device - der direkte Gegenspieler zu Starlinks D2C. 10/10
      # datiert, 10 eindeutige Titel, neueste 29.07.2026, darunter "Viasat
      # demonstrates first integrated automotive satellite voice call
      # capability with BMW Group". Abnahme: 10 Meldungen, 10 datiert, 1 im
      # Frischefenster.
      - {name: "Viasat", type: "rss", url: "https://investors.viasat.com/rss/news-releases.xml", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
  regulierung:
    name: "Regulierung & Verbände"
    beschreibung: >-
      Frequenzvergaben, Fusionsentscheidungen, Roaming- und KI-Regeln setzen
      den Rahmen, in dem sich jedes Angebot bewegen muss.
    quellen:
      # Die GSMA ist der Branchenverband der Mobilfunkbetreiber; ihre
      # Veroeffentlichungen setzen den Rahmen fuer Standards und MWC-Themen.
      - {name: "GSMA", type: rss, url: "https://www.gsma.com/newsroom/feed/"}
      # DG CNECT der EU-Kommission: Digital Networks Act, KI-Verordnung,
      # Frequenzpolitik - die Regeln, unter denen der europaeische Markt steht.
      - {name: "EU-Kommission (DG CNECT)", type: rss, url: "https://digital-strategy.ec.europa.eu/en/rss.xml"}
      # ETSI normt, was europaeische Netze koennen muessen - Standards
      # erscheinen hier Jahre vor dem Produkt.
      - {name: "ETSI", type: rss, url: "https://www.etsi.org/newsroom/feed/"}
      # Die ITU ist die UN-Organisation fuer Telekommunikation: Frequenzen,
      # weltweite Standards, Marktzahlen.
      - {name: "ITU", type: rss, url: "https://www.itu.int/hub/feed/"}
      # TRAI reguliert den groessten Mobilfunkmarkt der Welt und
      # veroeffentlicht ungewoehnlich konkrete Messberichte zur Netzqualitaet.
      # Vollstaendig telekomspezifisch - anders als die zunaechst geprueften
      # allgemeinen Wettbewerbsbehoerden.
      - {name: "TRAI (Indien)", type: rss, url: "https://www.trai.gov.in/rss.xml"}
      # Die kanadische Regulierungsbehoerde - zustaendig fuer den Markt, in
      # dem mit Bell, Rogers und Telus drei beobachtete Betreiber sitzen.
      # Publiziert etwa monatlich; neueste Meldung im Abruf vom 16.06.2026.
      # Anders als die zunaechst geprueften allgemeinen Wettbewerbsbehoerden
      # ist die CRTC ausschliesslich fuer Telekommunikation und Rundfunk
      # zustaendig.
      - {name: "CRTC (Kanada)", type: rss, url: "https://crtc.gc.ca/eng/rss/news.xml"}

      # ---- Welle 2 (Themenfelder und Regulierung), abgenommen 2026-08-04
      # Rumaenische Regulierungsbehoerde fuer Kommunikation (Telekom und
      # Post), keine allgemeine Wettbewerbsbehoerde. Vodafone Romania ist
      # beobachteter Markt. Abruf: 10 Meldungen, 10 datiert, neueste
      # 2026-08-04, mit substanziellen Titeln (Konsultation zur
      # Frequenzinventarisierung, Jahresbericht zu Netzstoerungen,
      # GPAI/KI-Verordnung in Rumaenien). EINSCHRAENKUNG: 2 der 10 Eintraege
      # waren Beschaffungsbekanntmachungen der eigenen Verwaltung ("Comanda
      # servicii dezinsectie si deratizare"). Kein reiner Ausschreibungsfeed,
      # aber der Analyst wird solche Zeilen sehen. Abnahme: 10 Meldungen, 10
      # datiert, 6 im Frischefenster.
      - {name: "ANCOM (RO)", type: "rss", url: "https://www.ancom.ro/rss", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Chilenische Telekom-Aufsicht (Subsecretaria de Telecomunicaciones),
      # ausschliesslich Telekommunikation. WordPress-Feed, sehr aktuell.
      # Abruf: 10 Meldungen, 10 datiert, neueste 2026-08-03, mit direkt
      # wettbewerbsrelevanten Titeln ("Subsecretaria de Telecomunicaciones
      # ordena cobro integro de garantias a WOM por incumplimiento"). Abnahme:
      # 10 Meldungen, 10 datiert, 1 im Frischefenster.
      - {name: "SUBTEL (CL)", type: "rss", url: "https://www.subtel.gob.cl/feed/", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Kenianische Kommunikationsbehoerde - Regulierer fuer Mobilfunk,
      # Breitband und Rundfunk in einem Markt, in dem Vodafone ueber Vodacom
      # und Safaricom vertreten ist. Abruf: 10 Meldungen, 10 datiert, neueste
      # 2026-07-29. Titel echt und teils regulatorisch relevant ("Authority
      # weighs light-touch rules as OTT platforms reshape Kenya's digital
      # economy", "Cyber Security Report Q4 2025-2026"), teils
      # Oeffentlichkeitsarbeit (Computerspenden an Schulen). Abnahme: 10
      # Meldungen, 10 datiert, 3 im Frischefenster.
      - {name: "Communications Authority of Kenya", type: "rss", url: "https://www.ca.go.ke/rss.xml", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Nigerian Communications Commission, reine Telekomregulierung im
      # groessten afrikanischen Mobilfunkmarkt. Abruf: 10 Meldungen, 10
      # datiert, neueste 2026-08-04, klar fachliche Titel ("Cyber Resilience
      # Framework for Nigeria Communication Sector", "NCC, African Regulators
      # Push Stronger Collaboration for Smarter Digital Governance"). Abnahme:
      # 10 Meldungen, 10 datiert, 3 im Frischefenster.
      - {name: "NCC (NG)", type: "rss", url: "https://www.ncc.gov.ng/rss.xml", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # National Telecommunications and Information Administration - die
      # US-Regierungsstelle fuer Frequenzpolitik und Breitbandfoerderung
      # (BEAD-Programm). Ergaenzt die bereits vorhandene FCC: die FCC
      # entscheidet, die NTIA verwaltet das Bundesspektrum und das Geld.
      # Abruf: 10 Meldungen, 10 datiert, neueste 2026-07-28 ("Call to Action
      # for 6G Leadership and Security"). Hinweis: einzelne Eintraege sind
      # Foerderprogramm-Verwaltung ("Round 4 Frequently Asked Questions").
      # Abnahme: 10 Meldungen, 10 datiert, 1 im Frischefenster.
      - {name: "NTIA (US)", type: "rss", url: "https://www.ntia.gov/rss.xml", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Das Forschungs- und Normungskonsortium der Kabelnetzbetreiber (DOCSIS,
      # 10G, Konvergenz Kabel/Mobilfunk). Relevant, weil Vodafone in
      # Deutschland selbst Kabelnetzbetreiber ist und Kabel-MVNOs in mehreren
      # Maerkten die Hauptkonkurrenz stellen. Abruf: 12 Meldungen, 12 datiert,
      # neueste 2026-07-28. Hinweis: mischt Personalmeldungen ("CableLabs
      # Names Mark Bridges President") unter die technischen Beitraege.
      # Abnahme: 12 Meldungen, 12 datiert, 1 im Frischefenster.
      - {name: "CableLabs", type: "rss", url: "https://www.cablelabs.com/feed", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Deutscher Digitalverband - Studien und Positionen zu TKG-Novelle,
      # Netzausbau und KI-Regulierung, im deutschen Heimatmarkt von Vodafone
      # meinungsbildend. WICHTIG: der naheliegende Pfad
      # https://www.bitkom.org/rss.xml liefert Muell (leere Titel,
      # Navigationsseiten wie "Get Started Mitgliedschaft", 6 verwertbare von
      # 10) - der richtige Pfad ist /feed und steht als rel-Verweis auf
      # bitkom.org/Presse. Abruf /feed: 20 Meldungen, 20 datiert, neueste
      # 2026-08-04, echte Pressetitel ("EU-Digitalranking: Deutschland auf
      # Platz 17"). Thematisch breiter als Telekommunikation. Abnahme: 20
      # Meldungen, 20 datiert, 6 im Frischefenster.
      - {name: "Bitkom", type: "rss", url: "https://www.bitkom.org/feed", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Verband der Anbieter von Telekommunikations- und Mehrwertdiensten -
      # die Wettbewerber der Deutschen Telekom, also Vodafones eigenes Lager
      # im deutschen Regulierungsstreit. Abruf: 10 Meldungen, 10 datiert,
      # neueste 2026-07-31 ("Netzanschlusspaket: Zentrale Luecken fuer den
      # Mobilfunkausbau bleiben"). Enthaelt auch Mitgliedermeldungen
      # regionaler Glasfaserbauer. Abnahme: 10 Meldungen, 10 datiert, 8 im
      # Frischefenster.
      - {name: "VATM", type: "rss", url: "https://www.vatm.de/feed/", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # Bundesverband Breitbandkommunikation - der Glasfaserverband, dessen
      # Stellungnahmen bei jeder Bundesnetzagentur-Entscheidung zum Netzzugang
      # auftauchen. Abruf: 10 Meldungen, 10 datiert, neueste 2026-08-04,
      # unmittelbar regulatorisch ("BREKO Stellungnahme zum Regierungsentwurf
      # des Gesetzes zur Aenderung des Telekommunikationsgesetzes", "BREKO
      # Pressestatement zur Entscheidung der Bundesnetzagentur ueber den
      # Zugang zu Leerrohren"). Abnahme: 10 Meldungen, 10 datiert, 1 im
      # Frischefenster.
      - {name: "BREKO", type: "rss", url: "https://www.brekoverband.de/feed/", herkunft: "Welle 2 (Themenfelder und Regulierung)", abgenommen: "2026-08-04"}
      # AUSDRUECKLICH ALS NEWSROOM VORGESCHLAGEN - der Verband hat sich 2026
      # von FTTH Council Europe in Fibre Council Europe umbenannt und die
      # Domain gewechselt; unter ftthcouncil.eu und fibrecouncil.eu sind
      # /feed, /feed/ und /rss.xml jeweils 404. Die Nachrichtenseite ist
