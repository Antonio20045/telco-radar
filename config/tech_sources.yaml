# =============================================================================
# TELCO RADAR - Themenfelder (dritte Signalebene)
# =============================================================================
# Was den Telco-Markt veraendert, kommt laengst nicht nur von anderen
# Netzbetreibern: KI-Anbieter, Geraete- und Chiphersteller, Netzausruester,
# Satellitenbetreiber und Regulierer entscheiden mit, was ein Netz kann, was
# ein Handy unterstuetzt, was etwas kostet und was erlaubt ist.
#
# WARUM EINE EIGENE DATEI und nicht die Watchlist:
# Nvidia, Qualcomm, die GSMA oder Ofcom sind keine Netzbetreiber. In der
# Watchlist braeuchten sie eine Region und einen Alias-Eintrag - beides falsch.
# Schlimmer: das Alias-Tagging der Fachpresse wuerde anfangen, jede Meldung
# mit "Nvidia" im Titel einer Region zuzuschlagen, und die Rundlauf-Sortierung
# wuerde sie gegen echte Betreibermeldungen antreten lassen. Hier tragen sie
# stattdessen ein Themen-Tag; jedes Themenfeld laeuft als eigener Analyst
# (mit eigenem Prompt, siehe analyze/agents.py::TECH_ANALYST_SYSTEM) und
# bekommt im Wochenbericht einen eigenen Abschnitt.
#
# ABNAHME: Jede Quelle hier ist mit
#   python scripts/pruefe_quellenvorschlag.py <datei> --no-overlap
# durch die Kriterien aus AUFTRAG_QUELLEN_AUSBAU.md Abschnitt 4 gelaufen
# (>= 5 Meldungen, >= 80 % datiert, >= 1 im Frischefenster, echte
# Ueberschriften, eigene Domain, keine Dublette, kein newsroom_js).
# Nichts kommt hier ohne PASS hinein.
#
# Quellentypen wie in der Watchlist: rss | json_api | newsroom.
# =============================================================================

themen:
  ki:
    name: "KI-Anbieter"
    beschreibung: >-
      Die Anbieter der Modelle, die Betreiber in Tarife, Kundenservice und
      Netzbetrieb einbauen. Sie bestimmen, was ein "KI-Tarif" ueberhaupt
      enthalten kann und was er kostet.
    quellen:
      # Der offizielle News-Feed von OpenAI. Produkt- und Partnerschafts-
      # meldungen laufen hier zuerst - inklusive der Telco-Deals, die spaeter
      # als Betreiber-Pressemitteilung erscheinen.
      - {name: "OpenAI", type: rss, url: "https://openai.com/news/rss.xml"}
      # Google DeepMind: Modellgenerationen und Forschung, die 6-12 Monate
      # spaeter in Android- und Pixel-Funktionen landen.
      - {name: "Google DeepMind", type: rss, url: "https://deepmind.google/blog/rss.xml"}
      # Googles eigener KI-Blog - naeher am Produkt als DeepMind und damit
      # naeher an dem, was Endkunden bei ihrem Mobilfunkanbieter erwarten.
      - {name: "Google AI", type: rss, url: "https://blog.google/technology/ai/rss/"}
      # Metas Newsroom. Relevant weniger wegen der Modelle als wegen WhatsApp
      # und der Business-Messaging-Umsaetze, an denen Betreiber mitverdienen.
      - {name: "Meta", type: rss, url: "https://about.fb.com/news/feed/"}
      # Nvidia steht im Auftrag unter den KI-Anbietern, nicht unter Chips:
      # fuer Betreiber zaehlt vor allem das AI-RAN- und Edge-Geschaeft.
      - {name: "Nvidia Blog", type: rss, url: "https://blogs.nvidia.com/feed/"}
      # Zweiter Nvidia-Kanal, bewusst zusaetzlich: der Blog erklaert Technik,
      # der Newsroom meldet Vertraege und Partnerschaften. Inhaltlich getrennt,
      # deshalb keine Dublette.
      - {name: "Nvidia Newsroom", type: rss, url: "https://nvidianews.nvidia.com/releases.xml"}
      # Anthropic hat keinen Feed; die Newsroom-Seite ist statisch abrufbar.
      # Einschraenkung, ehrlich benannt: der Parser bekommt Ueberschrift,
      # Datum und Anrisstext als EINE Zeile ("Introducing Claude Opus 5
      # Product Jul 24, 2026 Opus 5 is a step change ..."). Die Ueberschrift
      # steht vorn, der Titel bleibt also lesbar - schoen ist er nicht. Vier
      # item_selector-Varianten wurden probiert, keine trennt sauber.
      # Mistral ist der einzige grosse europaeische Modellanbieter. Fuer einen
      # europaeischen Netzbetreiber ist das keine Nebensache: Datenhaltung in
      # der EU entscheidet mit, welches Modell ueberhaupt in einen Tarif oder
      # in den Kundenservice darf.
      - {name: "Mistral AI", type: rss, url: "https://mistral.ai/news/rss", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
      - {name: "Anthropic", type: newsroom, url: "https://www.anthropic.com/news", item_selector: "article"}
      # Microsofts offizieller Azure-Blog. blogs.microsoft.com/ai ist seit
      # 2026 abgeschaltet (HTTP 410); hier laufen die Telco-relevanten
      # Meldungen ("AT&T and Microsoft scale trillion-token workloads").
      # Publiziert unregelmaessig, im Abruf lag die neueste Meldung genau auf
      # der Grenze des Frischefensters.
      - {name: "Microsoft Azure", type: rss, url: "https://azure.microsoft.com/en-us/blog/feed/"}

  geraete:
    name: "Geräte"
    beschreibung: >-
      Was ein Endgeraet kann, entscheidet, was ein Betreiber verkaufen kann -
      von eSIM ueber Satellitenfunk bis zu KI-Funktionen, die Datenvolumen
      erzeugen.
    quellen:
      # Apples Newsroom ist der Taktgeber fuer eSIM, Satelliten-Notruf und
      # Geraetefinanzierung - alles Themen, die direkt auf Tarife durchschlagen.
      - {name: "Apple", type: rss, url: "https://www.apple.com/newsroom/rss-feed.rss"}
      # Samsung Global Newsroom: Geraetestarts und Netzsparte in einem Feed.
      - {name: "Samsung", type: rss, url: "https://news.samsung.com/global/feed"}
      # Androids Produktblog. Systemfunktionen (RCS, eSIM-Transfer, Satellit)
      # erscheinen hier, bevor die Betreiber sie unterstuetzen muessen.
      - {name: "Android", type: rss, url: "https://blog.google/products/android/rss/"}
      # Lenovo fuehrt Motorola; Motorola-Geraetestarts laufen ueber diesen Feed.
      - {name: "Lenovo / Motorola", type: rss, url: "https://news.lenovo.com/feed/"}
      # Pixel ist Googles Referenzgeraet: was hier zuerst erscheint (eSIM,
      # Satellit, KI-Funktionen), muessen Betreiber spaeter unterstuetzen.
      # Der Blog publiziert schubweise rund um Geraetestarts - im Abruf war
      # die neueste Meldung vom 14.07.2026 und damit ausserhalb des Fensters.
      - {name: "Google Pixel", type: rss, url: "https://blog.google/products-and-platforms/devices/pixel/rss/"}

  chips:
    name: "Chips & Modems"
    beschreibung: >-
      Modem- und SoC-Generationen legen Jahre im Voraus fest, welche
      Netzfunktionen (5G-SA, NTN, RedCap) ueberhaupt in Geraeten ankommen.
    quellen:
      # Arm-Newsroom: Architektur-Ankuendigungen, die den gesamten
      # Smartphone- und Basisstationsmarkt betreffen.
      - {name: "Arm", type: rss, url: "https://newsroom.arm.com/rss"}
      # Broadcom veroeffentlicht seine Produkt- und Vertragsmeldungen ueber
      # die Investor-Relations-Seite; ein separater Presse-Feed existiert nicht.
      - {name: "Broadcom", type: rss, url: "https://investors.broadcom.com/rss/news-releases.xml"}
      # Welle 3: Marvell baut die Custom-Silicon- und Speicherinfrastruktur
      # hinter KI-Rechenzentren und optischen Transportnetzen - die Ebene,
      # auf der sich entscheidet, was ein Betreibernetz an KI-Last traegt.
      - {name: "Marvell", type: newsroom, url: "https://www.marvell.com/company/newsroom/press-releases.html", herkunft: "Firmenliste Welle 3", abgenommen: "2026-08-05"}
      # Welle 3d: Quectel ist der groesste IoT-Modulhersteller der Welt. Was
      # seine Module koennen (RedCap, NTN, Wi-Fi HaLow), entscheidet, welches
      # IoT-Geschaeft ein Betreiber ueberhaupt verkaufen kann.
      - {name: "Quectel", type: rss, url: "https://www.quectel.com/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # Sierra Wireless (Semtech) beliefert dasselbe Segment und rechnet
      # offen vor, was 4G gegen 5G RedCap ueber die Lebensdauer kostet.
      - {name: "Sierra Wireless", type: rss, url: "https://www.sierrawireless.com/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # MediaTek beliefert die Mittelklasse, also den Massenmarkt der
      # Betreiber. Die Meldungen sind ungewoehnlich netznah ("MediaTek and
      # Samsung Achieve 3Tx 5-Layer Uplink Breakthrough"). Publiziert
      # monatlich; neueste Meldung im Abruf vom 03.06.2026.
      - {name: "MediaTek", type: rss, url: "https://www.mediatek.com/press-room/rss.xml"}
      # Intel ist ueber Netzwerk-Silizium und Edge-Infrastruktur im Spiel,
      # nicht ueber Smartphone-Modems - fuer den Netzbetrieb trotzdem relevant.
      - {name: "Intel", type: rss, url: "https://newsroom.intel.com/feed"}

      # AMD liefert die Rechenkerne fuer Edge- und Kernnetz-Rechenzentren und
      # ist damit die Alternative zu Nvidia, an der die Kostenseite von
      # AI-RAN haengt.
      # Modems fuer IoT und 5G-RedCap - die Chips in Zaehlern, Trackern und
      # Industrieanlagen, die Betreiber als Konnektivitaet verkaufen.
      - {name: "Sequans", type: rss, url: "https://sequans.com/feed/", herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
      - {name: "AMD", type: rss, url: "https://newsroom.amd.com/rss.xml", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}

  netzausruester:
    name: "Netzausrüster"
    beschreibung: >-
      Ericsson, Nokia, Huawei & Co. bauen die Netze, ueber die alles laeuft.
      Ihre Ankuendigungen zeigen Monate vorher, welche Funktionen Betreiber
      als naechstes ausrollen koennen.
    quellen:
      # ericsson.com sperrt jeden Abruf aus der Sandbox mit 403. Cision ist
      # Ericssons offizieller Verbreitungsweg - dieselbe Ausnahme wie bei
      # Telia in der Watchlist, und mit demselben item_selector.
      - {name: "Ericsson", type: newsroom, url: "https://news.cision.com/ericsson", item_selector: ".card-item"}
      # Welle 3: ZTE fehlte bisher ganz, obwohl es nach Huawei der zweite
      # grosse chinesische Ausruester ist. Der globale Auftritt traegt die
      # Vertrags- und Technikmeldungen ("ZTE and SKY47 Unveil Pakistan's
      # Largest Purpose-Built Data Center").
      - {name: "ZTE", type: newsroom, url: "https://www.zte.com.cn/global/", herkunft: "Firmenliste Welle 3", abgenommen: "2026-08-05"}
      # Welle 3: Adtran ist der Glasfaser- und PON-Ausruester der europaeischen
      # Netzbetreiber ("TOHKnet and Adtran conduct Japan's first 50G PON
      # trial"). Achtung: die erste Kachel der Seite traegt statt einer
      # Ueberschrift die Zeile "<Datum> Press release" - der Rest ist sauber.
      - {name: "Adtran", type: newsroom, url: "https://www.adtran.com/en/newsroom", item_selector: "article", herkunft: "Firmenliste Welle 3", abgenommen: "2026-08-05"}
      # HPE hat Juniper uebernommen und fuehrt dessen Carrier-Geschaeft
      # weiter; der Newsroom ist der einzige der grossen westlichen
      # Ausruester-Feeds, der zuverlaessig antwortet.
      - {name: "HPE (Juniper)", type: rss, url: "https://www.hpe.com/us/en/newsroom/rss.xml"}
      # Nokia. Achtung bei der Bewertung dieser Quelle: nokia.com antwortet
      # unter Last zeitweise mit 403 - beim ersten Anlauf sah der Feed deshalb
      # tot aus. In sechs Abrufen hintereinander lieferte er dann sechsmal 25
      # von 25 datierten Meldungen. Der 403 ist eine Drosselung, kein Block.
      # Der Feed mischt Insider-Meldepflichten ("Managers' transactions") mit
      # den eigentlichen Produktmeldungen ("Nokia defines the next era of
      # radio with the industry's first AI-native RAN platform"); der Analyst
      # sortiert Ersteres aus.
      - {name: "Nokia", type: rss, url: "https://www.nokia.com/newsroom/feed/"}

      # Open-RAN-Anbieter, der Betreibern die Alternative zu Ericsson/Nokia
      # verkauft - relevant fuer jede Ausschreibung. Frische-Ausnahme belegt:
      # Meldungen im Monatsrhythmus, neueste 22.06.2026.
      - {name: "Mavenir", type: json_api, url: "https://www.mavenir.com/wp-json/wp/v2/posts?per_page=25&_embed=1", herkunft: "Firmenliste (Breitensuche)", abgenommen: "2026-08-05"}
      # Kleinzellen und Inhouse-Versorgung - die Technik, mit der Betreiber
      # Stadien, Bahnhoefe und Buerotuerme abdecken. Frische-Ausnahme belegt:
      # neueste Meldung im Abruf 20.07.2026.
      - {name: "JMA Wireless", type: rss, url: "https://jmawireless.com/feed/", herkunft: "Firmenliste (Breitensuche)", abgenommen: "2026-08-05"}

  satellit:
    name: "Satellit & NTN"
    beschreibung: >-
      Direct-to-Cell verschiebt gerade die Grenze zwischen Mobilfunk und
      Satellit - und damit die Frage, wofuer Kunden ihren Betreiber brauchen.
    quellen:
      # Das duennste Themenfeld im Bestand hatte genau eine Quelle. Omnispace
      # baut ein 5G-NTN-Netz und fusioniert gerade mit Lynk Global - also
      # genau die Direct-to-Device-Frage, die Betreiber betrifft.
      # Frische-Ausnahme belegt: publiziert quartalsweise, neueste 31.03.2026.
      # Einer der grossen Satelliten-Breitbandanbieter; seit dem
      # Chapter-11-Verfahren im Umbau, was fuer den Markt selbst eine
      # Nachricht ist.
      - {name: "Hughes Network Systems", type: rss, url: "https://www.hughes.com/feed", herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
      - {name: "Omnispace", type: rss, url: "https://omnispace.com/feed/", herkunft: "Firmenliste (Breitensuche)", abgenommen: "2026-08-05"}
      # AST SpaceMobile baut das Direct-to-Cell-Netz, mit dem Vodafone in
      # Europa arbeitet - die Meldungen zu Satellitenstarts sagen direkt,
      # wann der Dienst wo verfuegbar wird. Publiziert um Starts herum;
      # neueste Meldung im Abruf vom 17.06.2026.
      - {name: "AST SpaceMobile", type: rss, url: "https://ast-science.com/feed/"}

  regulierung:
    name: "Regulierung & Verbände"
    beschreibung: >-
      Frequenzvergaben, Fusionsentscheidungen, Roaming- und KI-Regeln setzen
      den Rahmen, in dem sich jedes Angebot bewegen muss.
    quellen:
      # Die GSMA ist der Branchenverband der Mobilfunkbetreiber; ihre
      # Veroeffentlichungen setzen den Rahmen fuer Standards und MWC-Themen.
      - {name: "GSMA", type: rss, url: "https://www.gsma.com/newsroom/feed/"}
      # DG CNECT der EU-Kommission: Digital Networks Act, KI-Verordnung,
      # Frequenzpolitik - die Regeln, unter denen der europaeische Markt steht.
      - {name: "EU-Kommission (DG CNECT)", type: rss, url: "https://digital-strategy.ec.europa.eu/en/rss.xml"}
      # ETSI normt, was europaeische Netze koennen muessen - Standards
      # erscheinen hier Jahre vor dem Produkt.
      - {name: "ETSI", type: rss, url: "https://www.etsi.org/newsroom/feed/"}
      # Die ITU ist die UN-Organisation fuer Telekommunikation: Frequenzen,
      # weltweite Standards, Marktzahlen.
      - {name: "ITU", type: rss, url: "https://www.itu.int/hub/feed/"}
      # Welle 3: AGCOM reguliert den italienischen Telekommunikations- und
      # Medienmarkt - Frequenzen, Netzzugang, Verbraucherschutz. Italien ist
      # ein Vodafone-Kernmarkt und war auf der Regulierungsebene blind.
      - {name: "AGCOM (Italien)", type: rss, url: "https://www.agcom.it/rss.xml", herkunft: "Firmenliste Welle 3", abgenommen: "2026-08-05"}
      # Welle 3: ICASA ist die suedafrikanische Regulierungsbehoerde. Sie
      # entscheidet ueber die Frequenzvergaben, an denen Vodacom und MTN
      # haengen ("ICASA Publishes Draft IMT Roadmap and Implementation Plans").
      - {name: "ICASA (Suedafrika)", type: newsroom, url: "https://www.icasa.org.za/news", item_selector: "div.news", herkunft: "Firmenliste Welle 3", abgenommen: "2026-08-05"}
      # --- Welle 3c (05.08.2026), aus der Sonnet-Recherche.
      # Nationale Telekom-Regulierer und Branchenverbaende. Der Auftrag nennt
      # genau diese Sorte als lohnend: sauber datiert und klar abgegrenzt.
      # NICHT aufgenommen, obwohl sie den Check bestanden haben:
      #   asep.gob.pa, our.org.jm  Mehrspartenregulierer (erste Meldung von
      #                            ASEP handelt vom Strommarkt) - derselbe
      #                            Grund, aus dem die spanische CNMC in
      #                            Session 4 verworfen wurde
      #   ttja.ee                  estnische Verbraucherschutzbehoerde, erste
      #                            Meldung ueber zahlungsunfaehige Fluglinien
      #   lta.gov.lr, rrt.lt       Titel sind "PRESS RELEASE" bzw. ein
      #                            Menuelabel, keine Ueberschriften
      #   akep.al, bicma.gov.bt, incm.gov.mz, telcor.gob.ni
      #                            nur Verwaltungs- und Personalmitteilungen
      #                            in der Stichprobe
      #   cs.gov.tj (3 Sprachen)   veroeffentlicht fremde Weltnachrichten
      #                            ("Orange Expands Investments in France")
      #   nmhh.hu/feed/rss-hu.xml  40 Meldungen je Abruf, ueberwiegend
      #                            Baugenehmigungsbescheide - eingetragen ist
      #                            nur der Forschungsfeed
      #   coai.com, apt.int        abgeschnittene Titel bzw. Terminkalender
      #   ntca.org                 erste Meldung ein persoenlicher Blogbeitrag
      - {name: "ARTCI (Côte d'Ivoire)", type: rss, url: "https://artci.ci/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "INACOM (Angola)", type: rss, url: "https://inacom.gov.ao/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "INDOTEL (Dominikanische Republik)", type: json_api, url: "https://indotel.gob.do/feed/json/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "CRC (Kolumbien)", type: rss, url: "https://www.crcom.gov.co/es/rss.xml", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "MCA (Malta)", type: rss, url: "https://www.mca.org.mt/rss.xml", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "AKOS (Slowenien)", type: newsroom, url: "https://www.akos-rs.si", item_selector: "span.news-related-news-date", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # Das chinesische Industrieministerium ist der Regulierer fuer den
      # groessten Mobilfunkmarkt der Welt und fehlte bisher komplett.
      - {name: "MIIT (China)", type: newsroom, url: "https://www.miit.gov.cn", item_selector: "li", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # Der Forschungsfeed der ungarischen Behoerde: Marktzahlen und
      # Mediennutzungsstudien statt Verwaltungsbescheide.
      - {name: "NMHH Forschung (Ungarn)", type: rss, url: "https://nmhh.hu/feed/kutatasok-hu.xml", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # BREKO ist der groesste deutsche Glasfaserverband und kommentiert jede
      # TKG-Novelle - fuer den Heimatmarkt der Kollegin die relevanteste
      # Verbandsstimme.
      - {name: "BREKO (Deutschland)", type: rss, url: "https://brekoverband.de/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "Asstel (Italien)", type: rss, url: "https://www.asstel.it/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "PIIT (Polen)", type: rss, url: "https://piit.org.pl/feed", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "African Telecommunications Union", type: rss, url: "https://atuuat.africa/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      - {name: "AICTO (Arabische IKT-Organisation)", type: rss, url: "https://www.aicto.org/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # --- Welle 3d: Normungs- und Branchengremien
      # ATIS normt in Nordamerika, was 3GPP global normt - und fuehrt die
      # US-6G-Initiative ("Why Has the US Launched a 6G Leadership Initiative?").
      - {name: "ATIS (Nordamerika)", type: rss, url: "https://atis.org/news/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # Die GSA zaehlt weltweit, welche Geraete und Netze welche Baender und
      # Funktionen unterstuetzen - die Zahlenbasis hinter jeder 5G-Aussage.
      - {name: "GSA (Global mobile Suppliers Association)", type: rss, url: "https://gsacom.com/paper/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # LoRaWAN ist die Konkurrenz zu NB-IoT und LTE-M, also zum IoT-Geschaeft
      # der Betreiber.
      - {name: "LoRa Alliance", type: rss, url: "https://lora-alliance.org/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # Communications Alliance ist der australische Branchenverband.
      - {name: "Communications Alliance (Australien)", type: rss, url: "https://www.austelco.org.au/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # eco ist der Verband der deutschen Internetwirtschaft und der
      # Gegenpol zu BREKO: Netzbetreiber gegen Diensteanbieter.
      - {name: "eco (Deutschland)", type: rss, url: "https://www.eco.de/feed/", herkunft: "Sonnet-Recherche Welle 3", abgenommen: "2026-08-05"}
      # TRAI reguliert den groessten Mobilfunkmarkt der Welt und
      # veroeffentlicht ungewoehnlich konkrete Messberichte zur Netzqualitaet.
      # Vollstaendig telekomspezifisch - anders als die zunaechst geprueften
      # allgemeinen Wettbewerbsbehoerden.
      - {name: "TRAI (Indien)", type: rss, url: "https://www.trai.gov.in/rss.xml"}
      # Die kanadische Regulierungsbehoerde - zustaendig fuer den Markt, in
      # dem mit Bell, Rogers und Telus drei beobachtete Betreiber sitzen.
      # Publiziert etwa monatlich; neueste Meldung im Abruf vom 16.06.2026.
      # Anders als die zunaechst geprueften allgemeinen Wettbewerbsbehoerden
      # ist die CRTC ausschliesslich fuer Telekommunikation und Rundfunk
      # zustaendig.
      - {name: "CRTC (Kanada)", type: rss, url: "https://crtc.gc.ca/eng/rss/news.xml"}
      # Die US-Fernmeldeverwaltung: Frequenzplanung und die milliardenschweren
      # Breitband-Foerderprogramme, an denen die amerikanischen Betreiber
