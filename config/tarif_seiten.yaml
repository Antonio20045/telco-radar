# =============================================================================
# AENDERUNGSRADAR - Tarifseiten der Wettbewerber
# =============================================================================
#
# Warum das mehr bringt als weitere Newsquellen
# ---------------------------------------------
# Die wichtigsten Preisbewegungen im Endkundengeschaeft werden NIE per
# Pressemitteilung kommuniziert. Eine geaenderte Option, ein neuer
# Anschlusspreis, ein still verschwundener Aktionstarif - das steht nur auf
# der Seite. Newsmonitoring erwischt es strukturell nicht, egal wie viele
# Feeds dazukommen.
#
# Umfang: bewusst klein. 15-25 URLs, je Anbieter die Tarifuebersicht und die
# Aktionsseite. Das ist ueberschaubar zu pflegen und deckt den Grossteil ab;
# ein breiter Scrape des ganzen Sortiments waere eine andere Sache, technisch
# wie rechtlich (siehe collect/aenderungen.py, Abschnitt "Rahmen").
#
# Was hier NICHT hineingehoert
# ----------------------------
# Aktionsseiten mit Endkundenangeboten stehen in config/promo_sources.yaml und
# laufen ueber die Promo-Pipeline. Diese Datei ist fuer die DAUERTARIFE - die
# Seite, auf der der Normalpreis steht. Genau dort passiert die stille
# Aenderung, die keine Aktion ist.
#
# `selector` ist optional. Ohne ihn wird der Hauptinhalt der Seite gelesen;
# mit ihm nur der genannte Bereich, was das Rauschen weiter senkt.

seiten:
  # ---------------------------------------------------------- Deutsche Telekom
  - marke: "Telekom"
    was: "Mobilfunk-Tarifübersicht"
    url: "https://www.telekom.de/mobilfunk/tarife"
