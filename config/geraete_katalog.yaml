# =============================================================================
# TELCO RADAR - Geraete- und Preisradar: der verfolgte Gerätekatalog
# =============================================================================
# Hand-gepflegt. Das hier ist NICHT der Markt, sondern die Liste der Modelle,
# deren Preise verfolgt werden - Flaggschiffe und Volumenmodelle. Ein Gerät,
# das hier nicht steht, wird von `geraete_model.erkenne_geraet()` nicht
# erkannt und landet nicht in der Datenbank. Das ist Absicht: ein Katalog,
# der alles aufnimmt, was in einer Shop-Kategorie steht, füllt die
# Positionskarte mit Zubehör und Auslaufware.
#
# -----------------------------------------------------------------------------
# DIE FELDER
# -----------------------------------------------------------------------------
#   hersteller   Pflicht. Geht in die device_id ein.
#   modell       Pflicht. Geht in die device_id ein. So schreiben, wie der
#                Hersteller es schreibt - Händlerschreibweisen kommen unter
#                `aliase`.
#   generation   Zahl, für die Sortierung "aktuelle Generation / mit Vorgängern".
#   vorgaenger   MODELLNAME des Vorgängers desselben Herstellers. Das Feld, an
#                dem die ganze Lifecycle-Auswertung hängt. Ohne gepflegte Kette
#                gibt es keine Nachfolger-Analyse - und zwar still, denn eine
#                fehlende Kette sieht aus wie "kein Effekt gemessen".
#   marktstart   YYYY-MM-DD. SIEHE UNTEN.
#   aliase       weitere Schreibweisen, unter denen Händler das Gerät führen.
#                Groß-/Kleinschreibung und Sonderzeichen sind egal (alles läuft
#                durch `wortmarken()`); nötig sind Aliase nur, wenn sich die
#                WORTFOLGE unterscheidet ("iPhone 17 ProMax" ist KEIN Alias -
#                "ProMax" zerfällt ohnehin nicht -, "Galaxy Fold 7" ohne das
#                "Z" dagegen schon).
#   speicher     die angebotenen Stufen in GB. Wird als Filter benutzt: eine
#                Zahl im Titel, die hier nicht steht, gilt nicht als Speicher.
#   segment      flagship | premium | mid | entry. Ordnet die Positionskarte.
#
# -----------------------------------------------------------------------------
# WARUM VIELE `marktstart`-FELDER LEER SIND - und was das kostet
# -----------------------------------------------------------------------------
# Ein Marktstartdatum wird hier NUR eingetragen, wenn es belegt ist. Ein
# geratenes Datum ist schlimmer als ein fehlendes: der Nachfolger-Effekt
# rechnet Preisbewegungen in den 30/60/90 Tagen NACH dem Start des Nachfolgers,
# und ein um zwei Monate verschobenes Datum erzeugt genau die Art Zahl, die
# plausibel aussieht und falsch ist.
#
# Ein leeres Feld schaltet für dieses Gerät die Nachfolger-Analyse ab
# (`geraete_lifecycle.nachfolger_effekt` gibt dann None statt einer Kurve).
# Listungsdauer, Preisverfall und Portfolio-Tiefe laufen weiter - die brauchen
# nur die eigene Zeitreihe. Wie viele Modelle betroffen sind, steht auf
# /geraete.html unter "Datenbasis und Lücken"; die Zeile ist der Auftrag an
# den Menschen, der diese Datei pflegt.
#
# Eintragen kann man ein Datum aus der Pressemitteilung des Herstellers
# (Verkaufsstart, nicht Ankündigung) - eine Zeile pro Recherche, keine
# Massenpflege.
# =============================================================================

