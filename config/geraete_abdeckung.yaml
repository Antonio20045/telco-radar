# =============================================================================
# Pflichtabdeckung des Geräteradars (Bündel = Gerät plus Tarif)
# =============================================================================
# Gelesen von `analyze/buendel_abdeckung.py` und dem Wächterschritt in
# `.github/workflows/geraete.yml`. Fehlt am Messtag ein Pflichtanbieter oder
# ein Pflichtmodell bei einem Pflichtanbieter, wird der Lauf rot.
#
# Eine Lücke ist nur dann kein Befund, wenn sie hier mit Grund steht:
# „Anbieter führt das Gerät nicht“ (geprüft an seiner Seite, mit Datum) oder
# „Anbieter nicht erreichbar“ (gemessen). Eine Lücke ohne Grund gibt es nicht.
# =============================================================================

pflicht_anbieter:
  - Telekom
  - Vodafone
  - o2
  - 1&1
  - congstar

# Pflichtanbieter, die erst gelten, wenn ihre Quelle in
# `config/geraete_quellen.yaml` `aktiv: true` trägt (Schlüssel = Name der Quelle,
# Werte = Anbieterzeilen der Bündel). Ist die Quelle `aktiv: false`, misst der
# Wächter sie nicht; sonst gelten sie wie jeder Pflichtanbieter (Modelle unten,
# belegte Lücken mit Grund). Saturn/MediaMarkt mit Tarif (Tarifwelt), aktiv seit
# 08.11.2026: je Netz eine Zeile. Probelauf 08.11.2026: 214 von 450 Netz-Band-
# Zellen gefüllt; für den Wächter zählt nur, ob ein Netz ein Pflichtmodell
# überhaupt führt (zwei Paare, belegte Lücken unten). Band-Lücken sind kein
# Wächter-Thema (Seite: "Noch nicht erfasst").
pflicht_anbieter_wenn_aktiv:
  "MediaMarkt/Saturn Tarifwelt":
    - "Saturn/MediaMarkt · Telekom-Netz"
    - "Saturn/MediaMarkt · Vodafone-Netz"
    - "Saturn/MediaMarkt · o2-Netz"

# Welche Pflichtmodelle der Wächter für die Zeilen einer vorbereiteten Quelle
# prüft: genau die, die ihr Leser erfasst (`MODELL_SLUGS` in
# `collect/geraete/tarifwelt_lauf.py`; Test: Gleichheit beider Listen). Gilt nur
# für die Zeilen oben, nie für `pflicht_anbieter` - die Netzbetreiber werden
# immer gegen alle `pflicht_modelle` geprüft. Führt ein Netz ein Modell bei
# Saturn/MediaMarkt nicht, steht das unten als belegte Lücke (Screenshot am
# Original, höchstens 14 Tage), nicht hier.
pflicht_modelle_wenn_aktiv:
  "MediaMarkt/Saturn Tarifwelt":
    - apple-iphone-18-pro
    - apple-iphone-18-pro-max
    - apple-iphone-17
    - apple-iphone-17-pro
    - apple-iphone-17-pro-max
    - apple-iphone-17e
    - apple-iphone-duo
    - apple-iphone-air
    - samsung-galaxy-s26
    - samsung-galaxy-s26-plus
    - samsung-galaxy-s26-ultra
    - samsung-galaxy-z-fold8
    - samsung-galaxy-z-flip8
    - samsung-galaxy-a57
    - google-pixel-11
    - google-pixel-11-pro
    - google-pixel-11-pro-xl
    - google-pixel-10a

# Anbieter, deren Pflichtmodelle zusätzlich je SPEICHERSTUFE geprüft werden:
# führt ein anderer Pflichtanbieter am Messtag eine Stufe, die dieser
# Anbieter nicht führt, und steht dafür unten keine belegte Lücke, ist das
# ein Befund `speicher_fehlt`. Rollout je Anbieter, erst nach einer echten
# Prüfung an seiner Seite - sonst stünde hier eine erfundene Portfolio-
# Aussage. o2 seit 08.11.2026 (Auftrag „o2-Lücken Band S“, Belege unten).
speicher_pflicht_anbieter:
  - o2

# Modell-IDs wie in der SKU (`geraete_model.device_id`): die aktuellen
# Topmodelle je Hersteller, die jeder Netzbetreiber üblicherweise führt.
pflicht_modelle:
  - apple-iphone-18-pro
  - apple-iphone-18-pro-max
  - apple-iphone-17
  - apple-iphone-17-pro
  - apple-iphone-17-pro-max
  - apple-iphone-17e
  - apple-iphone-duo
  - apple-iphone-air
  - samsung-galaxy-s26
  - samsung-galaxy-s26-plus
  - samsung-galaxy-s26-ultra
  - samsung-galaxy-z-fold8
  - samsung-galaxy-z-flip8
  - samsung-galaxy-a57
  - google-pixel-11
  - google-pixel-11-pro
  - google-pixel-11-pro-xl
  - google-pixel-10a

# anbieter + modelle (fehlt `modelle`, gilt der Grund für den ganzen
# Anbieter) + grund + geprueft (Datum der Prüfung am Original) + bis (Ablauf,
# höchstens 14 Tage nach `geprueft`). Optional `art: nicht_im_portfolio` plus
# `beleg` (Link auf den Screenshot) und `original` (Seite des Anbieters): nur
# so eine Ausnahme zeigt die Portfolio-Ansicht der Geräteseite als Lücke, jede
# andere ist dort eine Messlücke. Nach `bis` ist die Ausnahme ein Befund
# (rot), bis sie neu geprüft und verlängert oder gestrichen ist. Kommt ein
# Bündel zurück, warnt der Wächter: Eintrag streichen.
belegte_luecken:
  # congstar: iPhone 17 Pro ist nicht in der Geräteliste. Belegt (05.11.2026,
  # docs/belege/congstar-17pro-0511/): Apple-Übersicht (3, Screenshot, 4, Linkliste)
  # und sitemap/devices.xml (5) führen nur 17, 17 Pro Max, 17e, 18 Pro, 18 Pro Max,
  # Air und 16, kein 17 Pro. Die Einzelseite leitet per 307 auf die Übersicht um
  # (Screenshot 1 zeigt dort „Gerät derzeit nicht verfügbar“): das allein wäre nur
  # „nicht lieferbar“ und kein Beleg; maßgeblich ist die fehlende Geräteliste. Die
  # Portfolio-Ansicht zählt einen Beleg nur, wenn `grund` eine Sortiments-Aussage
  # trägt („nicht im Sortiment“, „Seite entfernt“, „nicht in der Geräteliste“).
  # Der Tageslauf liest die Seite weiter und meldet sie als „Gerät nicht mehr
  # angeboten“; kommt sie zurück, entsteht wieder ein Bündel.
  - anbieter: congstar
    modelle:
      - apple-iphone-17-pro
    grund: Gerät ist nicht in der Geräteliste (Apple-Übersicht) und nicht in der Sitemap; die Seite leitet auf die Übersicht um
    art: nicht_im_portfolio
    beleg: https://github.com/Antonio20045/telco-radar/blob/main/docs/belege/congstar-17pro-0511/3-apple-uebersicht-ganz.png
    original: https://www.congstar.de/geraete/apple/apple-iphone-17-pro/
    geprueft: "2026-11-05"
    bis: "2026-11-19"
  # congstar: iPhone 17 Pro Max ist nicht mehr in der Geräteliste. Lauf
  # 42356867331 (07.11.2026, 08:46 UTC) war deshalb rot: "congstar, 1
  # Pflichtmodell ohne Bündel und ohne belegte Lücke: apple-iphone-17-pro-max".
  # Belegt (08.11.2026, docs/belege/congstar-17promax-0811/): die Einzelseite
  # /geraete/apple/apple-iphone-17-pro-max/ leitet per 307 auf die
  # Apple-Übersicht um (redirectFrom=device-details, Screenshot 1). Die
  # Übersicht (Screenshot 2, Linkliste 3, 28 Links) führt nur noch 18 Pro,
  # 18 Pro Max, 17, 17e, 16, Air - kein 17 Pro Max mehr. Die Sitemap
  # /sitemap/devices.xml (4) bestätigt das. Die Links der Übersicht vom
  # Vorfall-Beleg (docs/belege/congstar-17pro-0511/4, 05.11.2026) führten das
  # Gerät noch - zwischen 05.11. und 07.11.2026 aus dem Sortiment genommen.
  # Der Tageslauf liest die Seite weiter; kommt das Gerät zurück, warnt der
  # Wächter "überholt".
  - anbieter: congstar
    modelle:
      - apple-iphone-17-pro-max
    grund: Gerät ist nicht mehr in der Geräteliste (Apple-Übersicht) und nicht in der Sitemap; die Seite leitet auf die Übersicht um
    art: nicht_im_portfolio
    beleg: https://github.com/Antonio20045/telco-radar/blob/main/docs/belege/congstar-17promax-0811/2-apple-uebersicht-ganz.png
    original: https://www.congstar.de/geraete/apple/apple-iphone-17-pro-max/
    geprueft: "2026-11-08"
    bis: "2026-11-22"
