    geprueft: "2026-11-08"
    bis: "2026-11-22"
  - anbieter: o2
    modelle:
      - google-pixel-11
    speicher:
      - 512gb
    grund: Speicherstufe bei o2 nicht im Angebot (geprüft 08.11.2026) - der Speicher-Wähler der Produktseite zeigt nur 256 GB
    art: nicht_im_portfolio
    beleg: https://github.com/Antonio20045/telco-radar/blob/main/docs/belege/o2-speicher-0811/6-pixel11-512gb-nicht-waehlbar.png
    original: https://www.o2online.de/e-shop/google/google-pixel-11-details?tarif=o2-mobile-m&ratenzahlung=24&zielgruppe=privatkunden
