  # congstar: Apple iPhone Duo ist nicht in der Geräteliste. Belegt (08.11.2026,
  # docs/belege/congstar-duo-0811/): die Einzelseite /geraete/apple/apple-iphone-duo/
  # antwortet HTTP 200, trägt aber <title>Error 404</title> (Soft-404, curl,
  # TelcoRadar/1.0). Maßgeblich ist die Geräteliste: die Apple-Übersicht (1,
  # Screenshot) nennt kein „Duo“, die Sitemap sitemap/devices.xml (2) führt nur
  # 14/15-refurbished, 16, 17, 17e, 18 Pro, 18 Pro Max, Air - kein Duo.
  - anbieter: congstar
    modelle:
      - apple-iphone-duo
    grund: Gerät ist nicht in der Geräteliste (Apple-Übersicht) und nicht in der Sitemap; die Einzelseite antwortet HTTP 200 mit Error-404-Inhalt (Soft-404)
    art: nicht_im_portfolio
    beleg: https://github.com/Antonio20045/telco-radar/blob/main/docs/belege/congstar-duo-0811/1-apple-uebersicht-ohne-duo.png
    original: https://www.congstar.de/geraete/apple/apple-iphone-duo/
    geprueft: "2026-11-08"
    bis: "2026-11-22"
  # 1&1: iPhone 16e und iPhone 15 werden nicht mehr verkauft. Belegt (08.11.2026,
  # docs/belege/1und1-sortiment-0811/, Playwright, ehrliche Kennung, nichts im
  # Warenkorb): /iphone-16e leitet auf /iphone-17e um (Screenshot 2; das 17e gibt es
  # nur ab 256 GB, 128 GB steht dort nicht), /iphone-15 zeigt "Leider ist dieses
  # Gerät nicht mehr verfügbar" (1); die M-Übersicht (3) führt keines von beiden.
  # Die Bündelzeilen im Bestand (16e abgerufen 05.11.2026 als "gueltig", 15 am
  # 08.10.2026) stehen deshalb ohne Preis als Lücke ("nicht im Sortiment", Seite,
  # Export, Grafik; `report/geraete_sortiment`), nicht als gültiger Preis. Wird
  # ein Bündel NACH dem Prüfdatum abgerufen, ist das Gerät zurück: die Zeile
  # zählt wieder, der Wächter warnt "überholt".
  - anbieter: 1&1
    modelle:
      - apple-iphone-16e
    grund: Gerät ist bei 1&1 nicht im Sortiment; die Seite /iphone-16e leitet auf das iPhone 17e um (erst ab 256 GB)
    art: nicht_im_portfolio
    beleg: https://github.com/Antonio20045/telco-radar/blob/main/docs/belege/1und1-sortiment-0811/2-iphone16e-leitet-auf-iphone17e.png
    original: https://www.1und1.de/iphone-16e
    geprueft: "2026-11-08"
    bis: "2026-11-22"
