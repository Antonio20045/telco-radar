  - name: o2
    typ: netzbetreiber
    gruppe: Telefónica Deutschland
    rang: 3
    methode: o2_katalog
    aktiv: true
    basis_url: https://www.o2online.de
    rate_limit_sekunden: 2
    kopfzeilen:
      # Der Endpunkt weist diesen Medientyp in der Nutzlast von /e-shop/
      # selbst aus. Mit `Accept: application/json` antwortet er mit einer
      # Weiterleitung in die 404-Seite - gemessen am 28.08.2026.
      Accept: application/vnd.commerce.message+json
    hinweis: >-
      Der Befund vom 11.08.2026 bleibt richtig und gilt für die HTML-Seite:
      deren ld+json trägt "price":"1.00", den Lockpreis im Tarifbündel.
      Gelesen wird stattdessen der Katalog, den die Einstiegsseite /e-shop/
      selbst aufruft - eine Antwort, 93 Geräte (28.08.2026), Preis als
      `totalPrice` der Ratenzahlung OHNE Tarif (`hwOnly=true`; die
      Detailadresse jedes Geräts trägt `ohne-tarif=ja`). Nachgerechnet:
      Anzahlung plus 24 Monatsraten ergibt bei 92 der 93 Einträge exakt den
      totalPrice. 18 Einträge sind Gerät PLUS Zubehör ("mit Watch Ultra 3")
      und werden verworfen - ihr Preis gilt für beides zusammen.
      ROBOTS: `Disallow: /e-shop/rest/` steht ausschließlich in der Gruppe
      `User-agent: googlebot`, zusammen mit /chat-ui/ und /ebooking/. Die für
      uns gültige Gruppe `User-agent: *` sperrt den Pfad nicht; unser
      Absender ist TelcoRadar/1.0.
      SEIT DEM 04.09.2026 WIRD DIESELBE ADRESSE EIN ZWEITES MAL GELESEN,
      ohne `hwOnly=true` — auch sie gibt /e-shop/ in seiner eigenen Nutzlast
      aus, und die Antwort nennt ihren Zustand selbst (HW_ONLY | BUNDLE).
      Sie trägt 88 Geräte MIT Tarif; 22 davon sind Gerät plus Zubehör und
      fallen heraus. Aus den übrigen 66 werden Bündel für
      `data/state/geraete_tco.json` — Zuzahlung, Geräterate, Tarifbetrag,
      Anschlusspreis und Laufzeit getrennt —, KEINE Listungen: ein
      Bündelmonatspreis gehört nicht in dieselbe Spalte wie ein Barpreis.
      Die Aufteilung in Geräterate und Tarif steht nur im Trackingblock der
      Antwort und wird deshalb gegen die typisierten Zahlen derselben
      Antwort nachgerechnet (Summe = monthlyPrice, Anzahlung = oneTimePrice,
      Anschluss = activationFee); geht eine Probe nicht auf, wird der Satz
      verworfen. Am 04.09.2026 gingen alle drei bei 66 von 66 auf, und
      sieben von sieben nachgeprüften Produktseiten nennen dieselben Beträge
      in ihrem serverseitigen pdp:PriceSummaryValue.
    einstiege:
      # Die Einstiegsseite IST die Nutzlast (direkt=True): eine Antwort mit
      # allen Geraeten und Preisen, keine Produktseite wird nachgeladen.
      - url: https://www.o2online.de/e-shop/rest/catalog/o2shop/privatkunden/ratenzahlung/default/__not-specified__/__not-specified__/__not-specified__?hwOnly=true
        label: Geraetekatalog ohne Tarif
        kind: static
      # DIESELBE ADRESSE, EIN PARAMETER WENIGER - und beide gibt /e-shop/ in
      # seiner eigenen Nutzlast aus. Es ist der Umschalter, den die Seite
      # ihren Lesern anbietet ("ohne Tarif" / "mit Tarif"); die Antwort sagt
      # selbst, in welchem Zustand sie steht
      # (hwCatalogSwitcherStateValue.hwOnlyOrBundleState = HW_ONLY | BUNDLE).
      # Kein Parameter ist geraten, keine Kombinatorik durchprobiert.
      #
      # `kind: buendel` heisst: die Saetze werden KEINE Listungen. Ein
      # Buendelmonatspreis gehoert nicht in dieselbe Spalte wie ein
      # Barpreis - er landet als tco_model.Buendel in geraete_tco.json.
      #
      # Gemessen 04.09.2026: HTTP 200, 583 KB, 88 Eintraege, davon 22
      # Geraet PLUS Zubehoer (verworfen). Von den 66 uebrigen gehen alle
      # drei Rechenproben bei 66 von 66 auf:
      #   metric3 + metric2 == monthlyPrice   (Geraeterate + Tarif)
      #   metric5           == oneTimePrice   (Anzahlung)
      #   metric4           == activationFee  (Anschlusspreis)
      # Gegengeprueft an acht Produktseiten, die o2 selbst verlinkt: ihr
      # serverseitiger pdp:PriceSummaryValue nennt dieselben Betraege
      # ("Geraet mtl. (36 Raten): 34,00 €", "Tarif mtl.
      # (Mindestlaufzeit 24 Monate): 14,99 €"). Im Betrieb werden diese
      # Seiten NICHT abgerufen - 66 Seiten a rund 950 KB fuer eine
      # Aufteilung, die schon in der einen Katalogantwort steht.
      - url: https://www.o2online.de/e-shop/rest/catalog/o2shop/privatkunden/ratenzahlung/default/__not-specified__/__not-specified__/__not-specified__
        label: Geraetekatalog mit Tarif
        kind: buendel

  - name: 1&1
    typ: netzbetreiber
    gruppe: United Internet
    rang: 4
    methode: einsundeins_buendel
    aktiv: true
    basis_url: https://mobile.1und1.de
    rate_limit_sekunden: 2
    # 42 Kacheln plus Luft. Der Deckel bleibt kleiner als die 167 Adressen
    # der Seite - fiele die Kachelernte je aus und griffe eine allgemeine
    # Linkernte, liefe der Sammler in den Deckel und die Seite gälte als
    # unvollständig gelesen, statt still hundert Themenseiten abzurufen.
    max_produkte: 45
    hinweis: >-
      ANGEBUNDEN SEIT 04.09.2026 — als BÜNDEL, nicht als Barpreis. Der
      alte Grund bleibt in seinem Kern richtig: offers.price im ld+json
      ist der MONATSPREIS des Bündels aus Gerät und Tarif, nicht der
      Gerätepreis (gemessen 04.09.2026 an mobile.1und1.de/iphone-17-pro:
      HTTP 200, 325 KB, "iPhone 17 Pro mit 1&1 All-Net-Flat S",
      price 44.99). Als Barpreis gespeichert wäre die Zahl plausibel
      falsch. Falsch war nur die Folgerung, dass man deshalb warten müsse:
      1&1 verkauft Geräte ausschließlich im Tarifbund, einen Barpreis gibt
      es dort nicht — und unter TCO-first ist der Monatspreis ohnehin die
      Leitgröße.
      Der Betrag landet deshalb in preis_mit_vertrag_ab, zusammen mit
      tarif_referenz (aus der description der Seite) und laufzeit_monate
      (36, aus window.currentHardwareOfferDuration).
      preis_ohne_vertrag bleibt LEER; ihn aus 44,99 × 36 minus Tarifpreis
      zu rechnen wäre eine Rechnung dieses Projekts und keine Angabe des
      Anbieters. Ohne Tarifnamen in der Beschreibung wird der Satz
      verworfen — eine Bündelzahl ohne ihren Vertrag ist bedeutungslos.
      Gelesen wird je Produktseite genau die VORAUSGEWÄHLTE Variante
      (window.currentProductVariants: cosmic orange, 256 GB). Die
      Preismatrix über Tarif × Speicher lädt die Seite erst im Browser
      nach; sie braucht einen eigenen Spike und wird hier nicht aus einer
      einzigen Zahl vervielfältigt.
      LINKERNTE: die Kategorieseite /smartphones führt 167 Adressen der
      eigenen Domain, davon 42 Produktseiten. Geerntet wird ausschließlich,
      was die Seite selbst als Katalogkachel auszeichnet
      (a.hardware-box__heading). Ein Pfadmuster kann das nicht leisten -
      /iphone-17-pro und /handyvertrag-ohne-laufzeit sind pfadgleich.
      ROBOTS (04.09.2026 gelesen): mobile.1und1.de sperrt für User-agent *
      /xml/, /static/, /modules/ sowie einzelne Aktions- und
      Bestellstrecken. /smartphones und die Produktseiten sind frei, der
      Parameter ?chosenTariff= ist ausdrücklich erlaubt.
      Die Tarife desselben Anbieters kommen NICHT von hier, sondern aus
      config/tarif_quellen.yaml (1und1.de/handytarife, methode ldjson) -
      dort trägt derselbe Anbieter seine eigene Marke, hier trägt das
      Gerät die des Herstellers.
    einstiege:
      - url: https://mobile.1und1.de/smartphones
        label: Smartphones
        kind: static

