# =============================================================================
# TELCO RADAR - Geräte- und Preisradar: die beobachteten Anbieter
# =============================================================================
# Drei Ebenen, alle in dieser Datei, unterschieden durch `typ`:
#   handel        Elektronikfachhandel, nach Marktgröße in Deutschland
#   netzbetreiber Telekom, Vodafone, o2, 1&1
#   discount      Discount- und Zweitmarken, mit `netz` als Zuordnung
#
# -----------------------------------------------------------------------------
# JEDE ZEILE HIER IST GEMESSEN, NICHT GERATEN
# -----------------------------------------------------------------------------
# Am 10.08.2026 wurde jeder dieser Anbieter einzeln abgerufen: robots.txt zuerst,
# dann eine Kategorie-/Sitemap-Seite, dann eine Produktseite, und der Preis
# wurde mit `json.loads` aus dem strukturierten Datensatz gezogen - nicht per
# Augenmaß aus dem sichtbaren Text. `methode` und `grund` geben genau dieses
# Messergebnis wieder. Eine URL, die nicht abgerufen wurde, steht hier nicht.
#
# -----------------------------------------------------------------------------
# DIE FELDER
# -----------------------------------------------------------------------------
#   name          Pflicht. Geht als `anbieter` in jede listung_id ein.
#   typ           handel | netzbetreiber | discount
#   netz          bei typ=discount: in wessen Netz die Marke funkt
#   gruppe        Konzern
#   rang          gepflegt, nicht gerechnet - die Reihenfolge auf der Seite.
#                 Dieselbe Regel wie `rang` in promo_sources.yaml: Marktgewicht
#                 steht in keiner Zahl dieses Projekts.
#   eigen         true nur für Vodafone: eigene Referenz, kein Wettbewerber
#   methode       Der Name des ADAPTERS, der diesen Anbieter liest - oder
#                 eine Diagnose ohne Adapter. Die gültige Liste steht in
#                 `geraete_config.METHODEN`; ein Tippfehler deaktiviert den
#                 Anbieter sichtbar, statt still null zu liefern.
#                 GEBAUT (Stand 05.09.2026): `ldjson` (inklusive der
#                 schema.org-Microdata-Stufe), `shopify`, `vodafone_api`,
#                 `o2_katalog`, `congstar_next`, `telekom_kategorie`,
#                 `einsundeins_buendel`, `saturn_brand`.
#                 DIAGNOSE OHNE ADAPTER: `json_endpunkt`, `html`, `js`, `api`
#                 - gemessen und dokumentiert, aber nichts liest sie. Sie sind
#                 bewusst keine gemeinsame Methode: fünf Anbieter tragen
#                 `json_endpunkt` und meinen fünf verschiedene Nutzlasten.
#                 KEIN ABRUF: `kein_hardware` (gemessen: verkauft keine
#                 Geräte), `deaktiviert`.
#   aktiv         false = wird nicht abgefragt. Dann ist `grund` PFLICHT; er
#                 steht wörtlich auf /geraete-quellen.html. Kein Anbieter
#                 verschwindet stillschweigend.
#   einstiege     die Seiten, von denen aus Produktlinks GEERNTET werden.
#                 kind: static (HTML) | sitemap (XML) | shopify (products.json) | js
#                 pfadmuster: nur Links, deren Adresse das enthält.
#                 Es wird ausschließlich abgerufen, was hier steht oder von
#                 hier aus verlinkt ist. Keine hochgezählten IDs - dieselbe
#                 Regel und derselbe Grund wie beim Tarif-Sammler
#                 (§ 87b UrhG, Datenbankherstellerrecht).
#   rate_limit_sekunden  Mindestabstand zweier Abrufe derselben Domain. Eine
#                 `Crawl-delay` aus der robots.txt gewinnt, wenn sie größer ist.
#   max_produkte  Deckel je Lauf.
#
# -----------------------------------------------------------------------------
# DAS BESUCHSFENSTER - der Befund, der den Zeitplan bestimmt
# -----------------------------------------------------------------------------
# medimax.de und ep.de (derselbe Shop-Betreiber, dieselbe robots.txt) schreiben
# wörtlich:
#
#     Request-rate: 1/10
#     Crawl-delay: 10
#     Visit-time: 0200-0800          # only visit between 02:00 and 08:00 UTC
#
# Der Wochenlauf startet dienstags und freitags um 08:30 UTC - also AUSSERHALB
# dieses Fensters. `collect/geraete/robots.py` erzwingt das: außerhalb der
# Besuchszeit wird der Anbieter nicht abgerufen, er erscheint auf der
# Quellenseite mit genau diesem Grund, und - das ist der wichtigere Teil -
# seine Geräte werden NICHT gealtert. Sonst hätte jeder Tageslauf die halbe
# Palette dieser zwei Händler Richtung "ausgelistet" geschoben.
#
# Deshalb hat der Gerätezweig einen eigenen nächtlichen Lauf
# (.github/workflows/geraete.yml, 03:10 UTC). Im Tageslauf kommen die Anbieter
# ohne Fenster dran, nachts alle.
# =============================================================================

anbieter:

  # =========================================================== ELEKTRONIKHANDEL

  - name: Amazon
    typ: handel
    gruppe: Amazon
    rang: 1
    methode: deaktiviert
    aktiv: false
    # Teil C3 des Auftrags, wörtlich umgesetzt: Adapter mit klarer
    # Schnittstelle, in der Konfiguration deaktiviert ausgeliefert. Kein
    # Scraping-Versuch, keine Proxy-Konstruktion, kein Workaround.
    grund: >-
      Nicht angebunden - erfordert Zugang zur Product Advertising API 5.0
      (PartnerNet-Konto mit qualifizierenden Verkäufen). Scraping von
      amazon.de verstößt gegen die Nutzungsbedingungen und wird zuverlässig
      gesperrt. Sobald Zugangsdaten vorliegen, ist das ein
      Konfigurationsschalter und kein Umbau.
    hinweis: "Größter Händler Deutschlands - die wichtigste bekannte Lücke dieser Seite."

  - name: MediaMarkt
    typ: handel
    gruppe: Ceconomy
    rang: 2
    methode: json_endpunkt
    aktiv: false
    grund: >-
      Produktdetailseiten antworten mit HTTP 403 und einer Cloudflare-Captcha-
      Wand - auf Chrome-, Edge- und den ehrlichen ClaudeBot-Absender gleich,
      obwohl robots.txt ClaudeBot ausdrücklich erlaubt. Lesbar ist nur die
      Kampagnenseite /de/campaign/angebote-smartphones; ihre 26 Gerätepreise
      stehen in window.__PRELOADED_STATE__, das kein gültiges JSON am Stück
      ist und einen eigenen Adapter braucht.
    basis_url: https://www.mediamarkt.de
    einstiege:
      - url: https://www.mediamarkt.de/de/campaign/angebote-smartphones
        label: Angebote Smartphones
        kind: static
        pfadmuster: /de/product/

  - name: Saturn
    typ: handel
    gruppe: Ceconomy
    rang: 2
    methode: saturn_brand
    aktiv: true
    basis_url: https://www.saturn.de
    # Zehn Sekunden statt der Voreinstellung, obwohl robots.txt fuer
    # User-agent "*" keinen Crawl-delay nennt (gelesen 05.09.2026) - 17
    # Markenseiten hintereinander bei zwei Sekunden waeren immer noch nur
    # 34s, aber dieses Radar fragt hier einen Cloudflare-Host ab, keine
    # Presse-Feeds. Dieselbe konservative Haltung wie bei Telekom.
    rate_limit_sekunden: 10
    # PER-ANBIETER-UEBERSCHREIBER des User-Agent (BRIEF_SATURN_ADAPTER_R2,
    # 05.09.2026, EVAL_saturn-adapter-r1.md Befund 1): R1 behauptete diese
    # Kennung im Bericht, sendete aber PRIMAER die Chrome-Vortaeuschung aus
    # config/settings.yaml:549 - der Evaluator hat das an den echten
    # Kopfzeilen widerlegt. Diese Zeile erzwingt die ehrliche Kennung als
    # Primary NUR fuer Saturn, ohne die globale settings.yaml anzufassen
    # (E-1 bleibt Antonios Entscheidung). Der 200er-Erfolg der 6 liefernden
    # Markenseiten steht damit nicht mehr auf einer Chrome-Vortaeuschung.
    user_agent: "TelcoRadar/1.0 (+https://telco-radar.onrender.com/ueber)"
    # `grund` ist gestrichen: das Feld beantwortet "warum NICHT aktiv", und
    # die Frage stellt sich seit dem 05.09.2026 nicht mehr (siehe Spike
    # outputs/saturn-spike-2026-09-05.md und die Produktivmessung im
    # zugehoerigen Bericht outputs/phase-saturn-adapter-2026-09-05.md).
    hinweis: >-
      ANGEBUNDEN SEIT 05.09.2026, nach dem Spike vom selben Tag - der
      alte Befund ("HTTP 403 auf Produktseiten wie MediaMarkt") war eine
      Verwechslung mit der falschen Zielseite (der frueher konfigurierten
      Kampagnenseite). Jede Markenseite
      (/de/brand/<hersteller>/<serie>/<modell>) traegt den Preis
      SERVERSEITIG in zwei unabhaengigen Strukturen derselben Antwort:
      einem ld+json-Block vom Typ ItemList UND window.__PRELOADED_STATE__
      (Apollo-Cache). Nur der Apollo-Cache traegt das Feld
      isProductOfTypeMarketplace - PFLICHT, um Saturn-eigene Preise von
      Drittanbietern im Marktplatz zu trennen (auf
      /de/brand/apple/iphone/iphone-17 sind 7 von 12 gelisteten Angeboten
      fremd, mit bis zu 2036 EUR fuer ein Geraet, das Saturn selbst fuer
      939,99 EUR fuehrt). Reiner HTTP-GET ohne Playwright reicht; kein
      Browser im Produktionspfad, keine der zwei robots-gesperrten
      GraphQL-Operationen (GetPaidBundles/GetFreeBundles) wird beruehrt -
      der Preis steht schon in der ersten Antwort. Die im urspruenglichen
      Auftrag genannte Kategorie-ID (/de/category/_..._701440.html) ist
      dagegen eine tote, im Sitemap-Index nicht mehr gefuehrte Adresse
      (HTTP 200, aber 0 Artikel) und wird NICHT verwendet.
      GRENZE, gemessen im ersten Produktivlauf (05.09.2026,
      scripts/lokallauf_saturn.py): NUR 6 der 17 Markenseiten liefern
      Saturn-eigene Listungen (iPhone 16/16e/17/17 Pro/Air/17e, 21
      Listungen). Die uebrigen ELF liefern strukturell einwandfrei, aber
      ZU DIESEM ZEITPUNKT keine einzige Saturn-eigene
      (nicht-Marktplatz-)Listung: iPhone 14/14 Pro/14 Pro Max/15/15 Plus/
      15 Pro Max (0 Angebote insgesamt) sowie iPhone 15 Pro/16 Plus/16 Pro/
      16 Pro Max/17 Pro Max (Angebote vorhanden, aber ausnahmslos
      Marktplatz-Drittanbieter oder - bei 16 Plus/16 Pro Max - schon in der
      "iphone-16"-Seite mit erfasst, siehe outputs/phase-saturn-adapter-
      2026-09-05.md). Saturn fuehrt diese Modelle aktuell offenbar nur
      ueber Drittanbieter oder gar nicht mehr neu. Das ist kein
      Abruffehler (die Seite antwortet 200 und ist strukturell lesbar),
      sondern eine Marktaussage - der Bericht fuehrt jede Seite einzeln.
    einstiege:
      # Jede Zeile ist eine Markenseite, die Modelle des Geraetekatalogs
      # (config/geraete_katalog.yaml) fuehrt - Start-Scope laut Auftrag
      # (BRIEF_SATURN_ADAPTER.md): alle Apple-iPhone-Serien des Katalogs.
      # Jede Adresse ist am 05.09.2026 einzeln mit HTTP 200 gemessen
      # (siehe outputs/phase-saturn-adapter-2026-09-05.md fuer die
      # vollstaendige Tabelle inkl. der aktuell leeren). `direkt=True` in
      # der Adapter-Registry: jede Seite IST ihre Nutzlast, es wird keine
      # Produktseite nachgeladen - kein `pfadmuster` noetig.
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-14
        label: iPhone 14
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-14-pro
        label: iPhone 14 Pro
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-14-pro-max
        label: iPhone 14 Pro Max
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-15
        label: iPhone 15
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-15-plus
        label: iPhone 15 Plus
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-15-pro
        label: iPhone 15 Pro
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-15-pro-max
        label: iPhone 15 Pro Max
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-16
        label: iPhone 16
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-16-plus
        label: iPhone 16 Plus
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-16-pro
        label: iPhone 16 Pro
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-16-pro-max
        label: iPhone 16 Pro Max
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-16e
        label: iPhone 16e
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-17
        label: iPhone 17
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-17-pro
        label: iPhone 17 Pro
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-17-pro-max
        label: iPhone 17 Pro Max
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-air
        label: iPhone Air
        kind: static
      - url: https://www.saturn.de/de/brand/apple/iphone/iphone-17e
        label: iPhone 17e
        kind: static

  - name: expert
    typ: handel
    gruppe: expert
    rang: 3
    methode: json_endpunkt
    aktiv: false
    grund: >-
      GESPERRT, nicht "wartet auf einen Adapter" — nachgemessen am
      29.08.2026 am Nuxt-3-Payload selbst. Der Befund vom 11.08.2026 (kein
      verwertbares ld+json, Preis im <script id="__NUXT_DATA__">) stimmt,
      war aber unvollständig: der Payload einer Produktseite trägt den
      Preis DIESES Artikels gar nicht. Der Schlüssel
      "pricePds/webcode=<nummer>;storeId=<markt>" löst im flachen
      Referenz-Array auf -1 auf, also auf undefined; der Preis wird erst im
      Browser nachgeladen. Der zugehörige Endpunkt liegt unter /api/, und
      genau das sperrt expert in seiner robots.txt ("Disallow: /api/").
      Im Payload stehen ausschließlich SCHWESTERartikel mit eigenem
      Webcode, Speicher und Preis (28 Objekte auf der geprüften Seite).
      Ihre Preise ihrem jeweiligen Artikel zuzuordnen ist nicht belegbar —
      der Webcode der aufgerufenen Seite steht nicht darunter. Eine Zahl,
      deren Zugehörigkeit man raten muss, gehört nicht in diese Datenbank.
      Die Sitemap bleibt sauber (16 293 Adressen, davon die
      Smartphone-Strecke); sobald expert einen Preis serverseitig
      ausliefert oder /api/ freigibt, ist das ein Adapter und kein Umbau.
    basis_url: https://www.expert.de
    einstiege:
      - url: https://www.expert.de/sitemap/urls/produkte/telekom-navigation.xml
        label: Produkt-Sitemap Telekommunikation
        kind: sitemap
        pfadmuster: /handys-smartphones/smartphones/

  - name: Medimax
    typ: handel
    gruppe: ElectronicPartner
    rang: 3
    methode: ldjson
    aktiv: true
    grund: >-
      ANGEBUNDEN UND AKTIV, findet aber seit dem 15.08.2026 nichts: 20
      abgerufene Produktseiten, 0 Listungen, sechzehn Nächte in Folge. Es
      liegt NICHT an der Besuchszeit - Lauf #17 lief um 03:59 UTC im Fenster
      02:00-08:00. Ein Adapter mit null Funden ist kein funktionierender
      Adapter; welche Stufe versagt, beantwortet der Rohsatz-Zähler beim
      nächsten Nachtlauf (die Protokollzeile nennt "N Preissaetze gelesen"
      neben den Listungen). Messen geht nur im Fenster, deshalb steht der
      Befund hier und nicht als Vermutung.
    basis_url: https://www.medimax.de
    rate_limit_sekunden: 10
    max_produkte: 20
    hinweis: >-
      Besuchszeit 02:00-08:00 UTC laut eigener robots.txt - im Tageslauf wird
      dieser Anbieter deshalb übersprungen, nicht gealtert.
    einstiege:
      - url: https://www.medimax.de/c/116/telefon-navi/handy-smartphone/smartphones
        label: Smartphones
        kind: static
        pfadmuster: /p/

  - name: ElectronicPartner
    typ: handel
    gruppe: ElectronicPartner
    rang: 3
    methode: ldjson
    aktiv: true
    grund: >-
      ANGEBUNDEN UND AKTIV, findet aber seit dem 15.08.2026 nichts: 20
      abgerufene Produktseiten, 0 Listungen, sechzehn Nächte in Folge. Es
      liegt NICHT an der Besuchszeit - Lauf #17 lief um 03:59 UTC im Fenster
      02:00-08:00. Ein Adapter mit null Funden ist kein funktionierender
      Adapter; welche Stufe versagt, beantwortet der Rohsatz-Zähler beim
      nächsten Nachtlauf (die Protokollzeile nennt "N Preissaetze gelesen"
      neben den Listungen). Messen geht nur im Fenster, deshalb steht der
      Befund hier und nicht als Vermutung.
    basis_url: https://www.ep.de
    rate_limit_sekunden: 10
    max_produkte: 20
    hinweis: >-
      Derselbe Shop-Betreiber wie Medimax - gleiche Sitemap-Struktur, gleiche
      Kategorie-IDs, gleiches ld+json-Schema, gleiche Besuchszeit. Ihre Preise
      sind kein unabhängiger zweiter Marktpunkt.
    einstiege:
      - url: https://www.ep.de/c/116/telefon-navi/handy-smartphone/smartphones
        label: Smartphones
        kind: static
        pfadmuster: /p/

  - name: Euronics
    typ: handel
    gruppe: Euronics
    rang: 3
    methode: deaktiviert
    aktiv: false
    grund: >-
      Antwortet auf JEDEN Abruf mit HTTP 403, auch auf die robots.txt selbst -
      mit nacktem Browser-Absender wie mit vollem Kopfzeilensatz, mit und ohne
      www, über HTTP/2 wie HTTP/1.1. Das ist eine Sperre gegen den IP-Bereich
      beziehungsweise den TLS-Fingerabdruck, kein Absenderfilter; dieselbe Lage
      wie bei Telecompetitor. Kein Kopfzeilentrick löst das, und Bot-Schutz
      umgehen ist ausgeschlossen.

  - name: mobilcom-debitel
    typ: handel
    gruppe: freenet
    # Derselbe LADEN, nicht nur derselbe Konzern: mobilcom-debitel.de leitet
    # vollstaendig auf freenet.de. Die Positionskarte fuehrt ihn deshalb
    # einmal - und unter dem Namen, unter dem seine Quelle erreichbar ist.
    # Nicht aus `gruppe` ableitbar: klarmobil traegt dieselbe Gruppe, ist
    # aber ein eigener Shop mit eigenem Sortiment.
    shop: freenet
    anzeige: freenet (mobilcom-debitel)
    rang: 4
    methode: ldjson
    aktiv: true
    basis_url: https://www.freenet.de
    rate_limit_sekunden: 2
    max_produkte: 120
    hinweis: >-
      mobilcom-debitel.de leitet vollständig auf freenet.de - es ist derselbe
      Shop. Die Produktseite trägt neben dem Hauptangebot bis zu sieben
      Varianten mit eigenem Preis und eigener Farbe unter isSimilarTo, also
      genau die Granularität, die ein SKU-Radar braucht.
    einstiege:
      # Die Listenstrecke */b/smartphones* ist in der robots.txt gesperrt und
      # wird deshalb NICHT abgerufen. Als Einstieg dient die Sitemap, die die
      # Seite selbst in ihrer robots.txt ausweist: 227 Geräteadressen, davon
      # die "-ohne-vertrag"-Fassung mit dem Preis OHNE Vertrag.
      #
      # Beide Muster müssen treffen (UND). Gemessen am 28.08.2026: das
      # Gerätemuster allein trifft 83 Adressen, davon 6 unter /tablets/ —
      # Seiten, die nie den Katalog treffen und trotzdem je einen
      # Crawl-Abstand des Zeitbudgets kosten. Genau diese Streuung (Tablets,
      # Watches, Router) hat den Nachtlauf so lange gemacht, dass ALDI TALK
      # ab dem 15.08. verhungerte.
      - url: https://www.freenet.de/sitemap.xml
        label: Sitemap (Smartphones ohne Vertrag)
        kind: sitemap
        pfadmuster:
          - /handys-smartphones/
          - -ohne-vertrag/p/P-M-

  # ============================================================ NETZBETREIBER

  - name: Telekom
    typ: netzbetreiber
    gruppe: Deutsche Telekom
    rang: 1
    methode: telekom_kategorie
    aktiv: true
    basis_url: https://www.telekom.de
    # Mindestens zehn Sekunden, obwohl nur EINE Seite abgerufen wird: die
    # Zahl steht hier, damit sie auch dann gilt, wenn irgendwann ein
    # zweiter Einstieg dazukommt.
    rate_limit_sekunden: 10
    max_produkte: 15
    # `grund` ist gestrichen und nicht etwa leer geblieben: das Feld
    # beantwortet die Frage "warum NICHT aktiv", und die stellt sich seit
    # dem 04.09.2026 nicht mehr. Was gemessen wurde, steht in `hinweis`
    # und damit weiterhin wörtlich auf /geraete-quellen.html.
    hinweis: >-
      ANGEBUNDEN SEIT 04.09.2026 — mit einer Preisform, die keine
      Barpreisform ist. Die Kategorieseite /shop/geraete/smartphones/
      ohne-vertrag antwortet dem Absender TelcoRadar/1.0 mit HTTP 200 und
      2,23 MB und trägt in window.__INITIAL_STATE__.productList.data zehn
      Geräte mit absoluten Beträgen: upfrontPrice, recurringPrice über 36
      Raten und totalPrice. Nachgerechnet geht die Probe bei 10 von 10 auf
      (Apple iPhone 17 Pro: 99,00 + 36 × 30,50 = 1197,00; Samsung Galaxy Z
      Fold8 Ultra: 399,00 + 36 × 50,00 = 2199,00). Das ist ein
      36-Monats-Ratengesamtbetrag und kein Kassenpreis, und genau das ist
      die Bedingung, die der alte Grund gestellt hatte: der Adapter
      schreibt die Preisform mit (anzahlung, monatsrate, laufzeit_monate),
      und geht die Probe nicht auf, wird der Satz verworfen statt als
      Barpreis gespeichert.
      Der Befund vom 11.08.2026 zur PRODUKTSEITE bleibt richtig und ist der
      Grund, warum hier die Kategorieseite steht: productDetailed.
      productDetailsData trägt je Speicherstufe nur einen deltaPrice, also
      einen Aufschlag ohne Grundbetrag. Einen Zinssatz nennt die Seite
      nicht; zins_effektiv bleibt leer und heißt "unbekannt", nicht "null
      Prozent". Die zehn Produktadressen stehen als echte a-href
      (/shop/geraet/) im selben HTML und werden dem Gerät über seine drei
      Slugs zugeordnet — nicht aus ihnen zusammengesetzt.
      GRENZE, unverändert: aus dem GitHub-Actions-IP-Bereich antwortet
      telekom.de httpx mit HTTP 202 und rund 2 KB Challenge-HTML
      (CLAUDE.md § 6). Der Adapter ändert daran nichts und soll es nicht —
      ein Fingerprint-Trick wäre eine Umgehung. Fällt der Abruf so aus,
      trägt die Nutzlast kein Gerät, die Seite gilt als ungelesen, und die
      Bestandsdaten altern NICHT.
      ROBOTS (04.09.2026 gelesen): /robots.txt sperrt für User-agent * nur
      /is-bin/intershop.enfinity/BOS/ und /is-bin/intershop.static/. Die
      Shop-Pfade sind frei.
    einstiege:
      # Die Kategorieseite IST die Nutzlast (direkt=True): sie trägt die
      # Beträge serverseitig, es wird keine Produktseite nachgeladen.
      # /mobilfunk/geraete/smartphone landet über eine OAuth-Kette
      # (prompt=none) auf genau dieser Adresse — eine Kette weniger ist
      # eine Fehlerquelle weniger.
      # Kein `pfadmuster`: es wirkt nur auf eine Linkernte, und die findet
      # hier nicht statt. Eine Zeile, die nichts tut, behauptet einen
      # Abruf, den es nicht gibt.
      - url: https://www.telekom.de/shop/geraete/smartphones/ohne-vertrag
        label: Smartphones ohne Vertrag
        kind: static

  - name: Vodafone
    typ: netzbetreiber
    gruppe: Vodafone
    rang: 2
    eigen: true
    methode: vodafone_api
    aktiv: true
    basis_url: https://www.vodafone.de
    rate_limit_sekunden: 2
    max_produkte: 60
    # Der oeffentliche Browser-Schluessel der Geraeteuebersicht. Er steht
    # woertlich in Vodafones eigenem Skriptbuendel
