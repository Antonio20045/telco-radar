    methode: congstar_next
    aktiv: true
    grund: >-
      ANGEBUNDEN UND AKTIV, aber noch nie gelaufen - der leere Bestand ist
      kein Messergebnis, sondern das Fehlen einer Messung. Gemessen am
      03.09.2026 an den GitHub-Actions-Läufen von geraete.yml: die fünf
      letzten Nachtläufe (33303341444 vom 30.08. bis 33730902762 vom 03.09.)
      trugen an ihrem headSha ausnahmslos noch "methode: ldjson, aktiv:
      false"; der Commit, der auf congstar_next und aktiv: true umstellt
      (27ef589), ist Vorfahr von keinem dieser fünf Läufe. Die Protokollzeile
      des Laufs 33730902762 vom 03.09.2026 08:15 UTC sagt entsprechend
      "congstar -> uebersprungen, 0 Listungen aus 0 Produktseiten" und nennt
      als Grund den alten Text von aktiv: false. Es ist also weder ein
      Adapter- noch ein Zugangsproblem: die Aktivierung war zum Startzeitpunkt
      des letzten Laufs (07:58 UTC) noch nicht auf main. Der erste belastbare
      Befund fällt mit dem nächsten Nachtlauf an. Bleibt er dann leer, ist
      als Erstes die robots.txt von www.congstar.de zu messen - für diese
      Messrunde lag keine vor.
    hinweis: >-
      Messrunde 31.08.2026: DER EINE Discount-Anbieter im Telekom-Netz mit
      belegbarem Preis ohne Vertrag - die Telekom selbst steht nicht in
      dieser Datenbank, weil ihr Gerätepreis nur als Ratenzahlung ausgewiesen
      wird (nicht, wie hier bis zum 03.09.2026 stand, wegen ihrer AWS-WAF:
      die ist zwar vorhanden, blockiert den Abruf aber nicht - siehe grund
      beim Anbieter Telekom). congstar trifft Apple, Samsung,
      Google UND Xiaomi (Google fehlte bisher ganz).
      Der Befund vom 30.08.2026 (ld+json traegt nur den Einmalpreis IM
      TARIFBUENDEL, ohne Speichergroesse) bleibt fuer das ld+json richtig -
      dieser Adapter liest es deshalb NICHT. Der Geraetepreis ohne Vertrag
      steht stattdessen im Next.js-Flight-Payload der Produktseite
      (`self.__next_f.push([1,"…"])`), je Variante unter
      `prices.paymentVariants[]`, im Eintrag mit
      `type == "ONE_TIME_PURCHASE"` UND `contractDuration == 0`, dessen Wert
      `oneTime.listed`.
      DIE FALLE: derselbe Knoten traegt auch `oneTime.discounted` - einen
      Rabatt, der laut der Fussnote "bei Abschluss der ANF M" entsteht, also
      an einen TARIFABSCHLUSS gebunden ist. Gemessen an vier Belegdateien:
      iPhone 17 256GB listed 919,00 EUR (discounted waere 811), Galaxy S25
      128GB 699,00 (519), Pixel 11 256GB 991,00 (757), Redmi Note 17 Pro
      256GB 477,00 (225) - Abstand bis 252 EUR, discounted haette congstar in
      jedem der vier Faelle faelschlich als Preisfuehrer gezeigt.
      OFFEN: dass das Geraet auch WIRKLICH ganz ohne SIM-Vertrag zu diesem
      Preis zu haben ist, ist nicht statisch bewiesen - die Kauflabels
      rendert React im Browser nach. Belegt ist `contractDuration: 0`,
      `recurring.listed: 0`, und der Marktvergleich stuetzt es (919/699/
      991/477 gegen Vodafones 949,90/849,90/999,90/499,90 fuer dieselben
      Geraete - dieselbe Groessenordnung, nicht der Sprung, den ein
      versteckter Tarifzwang verursachen wuerde).
    basis_url: https://www.congstar.de
    einstiege:
      - url: https://www.congstar.de/sitemap/devices.xml
        label: Geräte-Sitemap
        kind: sitemap
        pfadmuster: /geraete/

