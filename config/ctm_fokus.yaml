# Kategorien, in denen eine Meldung ueberhaupt direkt handlungsrelevant sein
# KANN. Sie stammen aus derselben Liste, die der Analyst vergibt (agents.py) -
# eine zweite Klassifizierung waere eine zweite Wahrheit.
direkte_kategorien:
  - Tarif/Pricing
  - Produktlaunch
  - Kampagne

# Zusaetzlich: Woerter, die eine Meldung auch ohne passende Kategorie zur
# Portfolio- oder Logistikfrage machen. Bewusst kurz gehalten - jede Zeile
# hier verschiebt die Startseite.
direkte_stichworte:
