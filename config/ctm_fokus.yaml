# =============================================================================
# CTM-FOKUS - der Zuschnitt des Teams, fuer das dieses Portal geschrieben wird
# =============================================================================
#
# Warum es diese Datei gibt
# -------------------------
# Bis zum 08.08.2026 kannte die Bewertung nur "Prioritaet 1-5", und ihr Massstab
# war branchenweite Bedeutung. Fuer ein Team, das Portfolio, Tarifoptionen und
# Logistik im deutschen ENDKUNDENGESCHAEFT verantwortet, ist das der falsche
# Massstab. Gemessen an der Ausgabe vom 07.08.2026: von den sieben Eintraegen
# der Spalte "Was wichtig ist" war KEIN EINZIGER fuer ein deutsches
# Consumer-Portfolio handlungsrelevant (Turminfrastruktur in Afrika, zweimal
# ein rumaenischer Spamfilter, OpenAI, ein oesterreichischer Discounter,
# US-Spektrum, indisches FWA) - waehrend "Telekom-Flatrate mit Unlimited-Daten
# fuer 34,95 Euro bei Freenet" in einer kleinen Kachel der dritten Reihe stand.
#
# Diese Datei ist die eine Stelle, an der steht, was "fuer uns" heisst. Sie
# speist `src/telco_radar/analyze/ctm.py`; die Stufen selbst stehen dort.
#
# Wer sie aendert, aendert die Reihenfolge der Startseite. Das ist gewollt -
# aber es ist eine Redaktionsentscheidung, keine Konfigurationsfrage.

# ---------------------------------------------------------------------------
# Stufe 3 (DIREKT): deutscher Markt, Endkunde, Preis/Portfolio/Option/Logistik.
# Diese Stufe wird DETERMINISTISCH vergeben, nicht vom Modell - dieselbe
# Bauweise wie beim Promo-Score, wo 45 % im Code gerechnet werden und genau das
# ihn stabil macht. Ein Modell, das seinen eigenen Massstab jeden Lauf neu
# auslegt, ist als Sortierkriterium wertlos.
# ---------------------------------------------------------------------------

