# ---------------------------------------------------------------------------
# Stufe 2 (UEBERTRAGBAR): Consumer-Mechanik in einem vergleichbaren Markt.
# Hier entscheidet das Modell - aber nur innerhalb dieser Maerkte. Ein
# Endkundenangebot in einem westeuropaeischen Markt ist uebertragbar, dasselbe
# Angebot in einem Markt mit anderem Preisniveau und anderer Geraetelogistik
# ist Kontext.
# ---------------------------------------------------------------------------
vergleichbare_maerkte:
  - Europa
  - Nordamerika

# ---------------------------------------------------------------------------
# Die Sicherheitsskala. Sie steht hier und NICHT im Prompt-Text, damit die
# Erklaerung auf der Transparenzseite und die Vorgabe an das Modell dieselbe
# Quelle haben. Getrennt gehalten wird bewusst zweierlei, was gern vermischt
# wird: wie wahrscheinlich das Ereignis ist, und wie belastbar die Quellenlage
# ist. "Wir sind sicher, dass es wahrscheinlich passiert" verschleiert genau
# das.
# ---------------------------------------------------------------------------
sicherheitsskala:
  - wort: möglich
    bedeutung: "Es gibt Anzeichen, aber die Quelle laesst offen, ob es kommt."
  - wort: wahrscheinlich
    bedeutung: "Die Quelle nennt einen Plan oder eine Absicht, aber kein Datum und keine Zusage."
  - wort: sehr wahrscheinlich
    bedeutung: "Die Quelle nennt eine Entscheidung, ein Datum oder einen Preis."
