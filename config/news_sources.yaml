  - {name: "TelecomLead (Indien)", type: rss, url: "https://telecomlead.com/feed", region: asia, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
  - {name: "MediaNama (Indien)", type: rss, url: "https://www.medianama.com/feed/", region: asia, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
  - {name: "Mobile Time (Brasilien)", type: rss, url: "https://www.mobiletime.com.br/feed/", region: latin_america, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
  - {name: "TELETIME (Brasilien)", type: rss, url: "https://teletime.com.br/feed/", region: latin_america, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
  - {name: "DPL News (Lateinamerika)", type: rss, url: "https://dplnews.com/feed/", region: latin_america, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
  - {name: "Connecting Africa", type: rss, url: "https://www.connectingafrica.com/rss.xml", region: africa_middle_east, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
  - {name: "Telecom Review (Naher Osten)", type: rss, url: "https://www.telecomreview.com/feed/", region: africa_middle_east, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
