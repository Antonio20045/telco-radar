# =============================================================================
# TELCO RADAR - Telco trade press (the primary, telco-only signal layer)
# =============================================================================
# ONLY specialised telecom trade press + working operator press feeds. Every
# item is a real telco article with a direct publisher link. Items are tagged
# to a watchlist operator when its name/alias appears in the headline.
# No keyword news-search (that pulled in off-topic noise). Validate: scripts/validate_sources.py
# =============================================================================
news_sources:
  # -- international telecom trade press
  - {name: "Mobile World Live", type: rss, url: "https://www.mobileworldlive.com/feed/"}
  - {name: "Light Reading", type: rss, url: "https://www.lightreading.com/rss.xml"}
  - {name: "Fierce Network", type: rss, url: "https://www.fierce-network.com/rss/xml"}
  - {name: "Total Telecom", type: rss, url: "https://totaltele.com/feed/"}
  - {name: "RCR Wireless", type: rss, url: "https://www.rcrwireless.com/feed"}
  - {name: "Developing Telecoms", type: rss, url: "https://developingtelecoms.com/?format=feed&type=rss"}
  - {name: "Mobile Europe", type: rss, url: "https://www.mobileeurope.co.uk/feed/"}
  - {name: "Broadband TV News", type: rss, url: "https://www.broadbandtvnews.com/feed/"}
  - {name: "Telecoms Tech News", type: rss, url: "https://www.telecomstechnews.com/feed/"}
  - {name: "The Fast Mode", type: rss, url: "https://www.thefastmode.com/?format=feed&type=rss"}
  - {name: "Telecompetitor", type: rss, url: "https://www.telecompetitor.com/feed/", region: north_america}
  - {name: "TelecomTalk", type: rss, url: "https://telecomtalk.info/feed/", region: asia}
  - {name: "ISPreview UK", type: rss, url: "https://www.ispreview.co.uk/index.php/feed", region: europe}
  - {name: "CommsRisk", type: rss, url: "https://commsrisk.com/feed/"}
  # -- German telco press (Telekom, O2, 1&1, Vodafone DE)

  # ===========================================================================
  # REGIONALE UND NICHT-ENGLISCHE FACHPRESSE (05.08.2026)
  # ===========================================================================
  # Bis hierher waren ALLE 14 Feeds englischsprachig - laut
  # AUFTRAG_SKALIERUNG_1000.md die auffaelligste Luecke im ganzen Bestand. Ein
  # spanischer Tarifkrieg, eine franzoesische Frequenzauktion oder ein
  # brasilianischer Glasfaserdeal erscheinen in der internationalen
  # Fachpresse fruehestens Tage spaeter und meist gar nicht.
  #
  # Der Analyst versteht diese Sprachen; die Grenze ist der Datums-Parser in
  # collect/newsroom.py, der nur die eingetragenen Monatsnamen kennt. Genau
  # deshalb ist jede Quelle hier durch Kriterium 3 gelaufen (>= 80 % datiert) -
  # was der Parser nicht lesen kann, ist gar nicht erst hereingekommen.
  #
  # Alle mit scripts/pruefe_quellenvorschlag.py abgenommen (05.08.2026),
  # gefunden mit scripts/finde_quellen.py --firmen.
  #
  # BEWUSST NICHT AUFGENOMMEN, obwohl sie den Check bestanden haben - der
  # prueft Form, nicht Wert:
  #   golem.de/rss.php          allgemeine IT-Presse, 39 Meldungen je Abruf,
  #                             davon die wenigsten Telekommunikation
  #   zdnet.fr/feed             Unternehmens-IT, kaum Telekommunikation
  #   expansion.com/rss/...     allgemeine Wirtschaftsnachrichten
  #   gov.br/rss.xml            das ganze brasilianische Regierungsportal,
  #                             nicht Anatel (erste Meldung im Abruf: ein
  #                             Studienplatz-Auswahlverfahren der UFMG)

  # -- Deutsch
  # Rein telekommunikationsspezifisch, taeglich, mit Tarifdetails - genau die
  # Ebene, auf der die Kollegin arbeitet.
  - {name: "teltarif", type: rss, url: "https://www.teltarif.de/feed/news/20.rss2", region: europe, herkunft: "Breitensuche (rel=alternate)", abgenommen: "2026-08-05"}
  # Handelsblatt des Telekommunikationsvertriebs: Tarife, Endgeraete, Handel.
  - {name: "Telecom Handel", type: rss, url: "https://www.telecom-handel.de/feed/rss", region: europe, herkunft: "Breitensuche (rel=alternate)", abgenommen: "2026-08-05"}

  # -- Franzoesisch
  # Deckt den franzoesischen Markt (Orange, SFR, Bouygues, Free) taeglich ab.
  - {name: "Univers Freebox", type: rss, url: "https://www.universfreebox.com/feed", region: europe, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}

  # -- Spanisch (Spanien)
  - {name: "Xataka Móvil", type: rss, url: "https://www.xatakamovil.com/feedburner.xml", region: europe, herkunft: "Breitensuche (rel=alternate)", abgenommen: "2026-08-05"}
  - {name: "ADSLZone", type: rss, url: "https://www.adslzone.net/feed/", region: europe, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}

  # -- Italienisch
  - {name: "Corriere Comunicazioni", type: rss, url: "https://www.corrierecomunicazioni.it/feed/", region: europe, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}

  # -- Portugiesisch / Spanisch (Lateinamerika)
  # Der brasilianische Markt war bisher nur ueber die Betreiber selbst
  # sichtbar; TeleSintese lieferte im Abruf 40 von 40 Meldungen im
  # Frischefenster.
  - {name: "TeleSíntese (BR)", type: rss, url: "https://telesintese.com.br/feed/", region: latin_america, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  - {name: "TeleSemana (LatAm)", type: rss, url: "https://www.telesemana.com/feed/", region: latin_america, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}

  # -- Regionale englischsprachige Fachpresse (Asien, Afrika, Indien)
  # Nicht "noch ein internationaler Feed": diese vier berichten ueber Maerkte,
  # die in der bestehenden Fachpresse praktisch nicht vorkommen.
  - {name: "Communications Today (Indien)", type: rss, url: "https://www.communicationstoday.co.in/feed/", region: asia, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  - {name: "Telecom Review Asia", type: rss, url: "https://www.telecomreviewasia.com/feed/", region: asia, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  - {name: "Telecom Review Africa", type: rss, url: "https://www.telecomreviewafrica.com/feed/", region: africa_middle_east, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  # Suedafrika ist der groesste Markt, in dem Vodacom und MTN aufeinander
  # treffen - und war bisher nur ueber die Betreiber selbst sichtbar.
  - {name: "ITWeb (Südafrika)", type: rss, url: "https://www.itweb.co.za/rss", region: africa_middle_east, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  - {name: "TechCentral (Südafrika)", type: rss, url: "https://techcentral.co.za/feed/", region: africa_middle_east, herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}

  # -- International, aber im Bestand bisher nicht vertreten
  - {name: "TelecomTV", type: rss, url: "https://www.telecomtv.com/content/news/rss.xml", herkunft: "Breitensuche (rel=alternate)", abgenommen: "2026-08-05"}
  - {name: "Telecoms.com", type: rss, url: "https://www.telecoms.com/rss.xml", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  # Grosshandel, Seekabel, Interconnect - die Kostenseite, ueber die sonst
  # niemand berichtet.
  - {name: "Capacity Media", type: json_api, url: "https://capacityglobal.com/wp-json/wp/v2/posts?per_page=25&_embed=1", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  - {name: "Broadband Communities", type: rss, url: "https://bbcmag.com/feed/", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  # Frequenzpolitik weltweit - die einzige Quelle im Bestand, die
  # Auktionsverfahren und Bandvergaben systematisch verfolgt.
  - {name: "PolicyTracker", type: rss, url: "https://www.policytracker.com/feed/", herkunft: "Breitensuche (Kandidatenpfad)", abgenommen: "2026-08-05"}
  # Ookla misst Netzqualitaet weltweit und veroeffentlicht die Vergleiche, mit
  # denen Betreiber werben - also die Zahlen hinter den Werbeaussagen.
  - {name: "Ookla Insights", type: rss, url: "https://www.ookla.com/articles/rss", herkunft: "Breitensuche (rel=alternate)", abgenommen: "2026-08-05"}

  # -- Welle 2 (05.08.2026): weitere Sprachen und Regionen
  # Wieder gilt: der Check prueft Form, nicht Wert. Von 35 gesuchten
  # Fachpressetiteln bestanden 22 den Check, eingetragen sind 11. Verworfen
  # wurde durchweg ALLGEMEINE IT- und Verbraucherpresse, die zwar sauber
  # datierte Artikel liefert, aber kaum Telekommunikation: Computerwoche
  # ("Die besten Android Launcher"), Computerworld PL, Data Manager IT,
  # Silicon FR, Muy Computer Pro, Les Numeriques und Frandroid (Testberichte),
  # Der Standard (allgemeine Nachrichten), inside digital und Tuttoandroid
  # (Schnaeppchen-Feeds), Emerce NL, Datanews BE (Wirtschaft), Tivi FI.
  # Fuer die betroffenen Maerkte gibt es jeweils schon einen telekom-
  # spezifischen Titel im Bestand.
  # Ebenfalls verworfen: die "comments/feed"-Varianten mehrerer Titel - das
  # sind Leserkommentare, keine Artikel.
  - {name: "Telepolis (Polen)", type: rss, url: "https://www.telepolis.pl/rss", region: europe, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
  - {name: "Lupa (Tschechien)", type: rss, url: "https://www.lupa.cz/rss/clanky/", region: europe, herkunft: "Firmenliste Welle 2", abgenommen: "2026-08-05"}
