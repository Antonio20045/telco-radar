  # ===========================================================================
  # RUBRIKFEEDS BESTEHENDER TITEL - Welle 3 (05.08.2026)
  # ===========================================================================
  # Der Hebel aus AUFTRAG_1000_QUELLEN_WELLE3.md Abschnitt 3: eine Firma ist
  # nicht eine Quelle. Fast jede Fachpresse-Site liefert zu jeder Rubrik einen
  # eigenen Feed, und der Hauptfeed zeigt immer nur die letzten 10 bis 30
  # Meldungen. Wer nur den Hauptfeed abfragt, sieht von einem taeglich
  # publizierenden Titel zwischen zwei Laeufen einen Ausschnitt.
  #
  # Gefunden mit `scripts/finde_quellen.py --rubriken` (WordPress-Kategorie-
  # Schnittstelle, sonst die Rubriknavigation der Site), abgenommen mit
  # scripts/pruefe_quellenvorschlag.py: 138 Kandidaten -> 53 bestanden ->
  # 33 eingetragen. Haeufigster Ablehnungsgrund war Kriterium 4 (84-mal) -
  # eine Rubrik, die seit acht Tagen nichts veroeffentlicht hat, traegt zum
  # Wochenbericht nichts bei.
  #
  # BEWUSST NICHT AUFGENOMMEN, obwohl sie den Check bestanden haben - er
  # prueft Form, nicht Wert:
  #   corrierecomunicazioni.it/whitepaper/intelligenza-artificiale/
  #                             Whitepaper-Rubrik, also Advertorial ("ERP
  #                             evoluto: il prerequisito per un'AI che
  #                             funziona davvero")
  #   telecomreview*/technology-pick/ (drei Titel)
  #                             dieselbe syndizierte Gadget-Strecke auf allen
  #                             drei Schwestertiteln ("Autonomous Skin Cancer
  #                             Detection Arrives on Smartphones")
  #   bbcmag.com/category/technology/ai/ und /innovation/
  #                             beide lieferten dieselbe Konferenzwerbung
  #                             ("How Summit 2026 will dive into the future
  #                             of Multifamily")
  #   bbcmag.com/category/technology/fiber-broadband/
  #                             hyperlokale US-ISP-Rundschau ("ISP Roundup:
  #                             Wire 3 begins construction in Anderson, SC") -
  #                             derselbe Fehler wie corporate.comcast.com/rss
  #                             in Session 4
  #   telecomtalk.info/category/ai/
  #                             driftet in allgemeine IT ("Google AI Finds
  #                             Sandbox Escape Bug in Chrome's Codebase")
  #   dplnews.com/category/redes/cloud/ und /brasil/redes-sociais/
  #                             Unternehmens-IT (Oracle/Gemini) bzw. soziale
  #                             Netze - keine Telekommunikation
  #   rcrwireless.com/category/ai-ml/
  #                             Reader Forum, also Meinung, und ueberschneidet
  #                             sich mit ai-infrastructure
  #   mobileeurope.co.uk/.../edge/
  #                             erste Meldung identisch mit cloud-nfv
  #   totaltele.com/category/technology/
  #                             Oberrubrik von technology/5g und damit fast
  #                             der Hauptfeed
  #   telecomlead.com/category/4g-lte/
  #                             4G ist Altbestand
  #   telefonica.com/es/tag/inteligencia-artificial/ und
  #   liquid.tech/category/cyber-security/
  #                             Konzern-Thought-Leadership ("Educacion e
  #                             inteligencia artificial: como aprender mejor
  #                             en la era de la IA") - dieselbe Sorte wie der
  #                             in Session 4 verworfene ESG-Kategoriefeed
  #   blogs.nvidia.com/.../generative-ai/ und /enterprise/
  #                             identische erste Meldung, und Nvidia Blog wie
  #                             Nvidia Newsroom stehen schon im Bestand
  #   news.sktelecom.com/category/ai-service/ und /tag/AI/
  #                             derselbe Newsroom, den SK Telecom mit
  #                             news.sktelecom.com/en/feed schon auf Englisch
  #                             im Bestand hat - nur auf Koreanisch
  #
  # WICHTIG fuer die naechste Runde: der Dublettencheck des Abnahme-Skripts
  # vergleicht gegen den BESTAND, nicht gegen die anderen Kandidaten. Zwei
  # Rubriken derselben Site, die dasselbe ausliefern, bestehen deshalb beide -
  # das muss von Hand auffallen (hier: SK Telecom ai-service gegen tag/AI,
  # Mobile Europe cloud-nfv gegen edge, Nvidia generative-ai gegen enterprise,
  # bbcmag ai gegen innovation).

