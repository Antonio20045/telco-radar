# =============================================================================
# TELCO RADAR - Third-party press (the secondary signal layer)
# =============================================================================
# Two groups, both machine-tagged via the "group" field (default: telco):
#   telco - specialised telecom trade press. Every item is a real telco
#           article with a direct publisher link, tagged to a watchlist
#           operator when its name/alias appears in the headline.
#   tech  - general AI/hardware/technology press. Not telco-specific; kept
#           separate on site/sources.html and judged by the analyst as
#           "would this matter to Vodafone's network/product strategy" even
#           without a telco named (see analyze/agents.py).
# No keyword news-search (that pulled in off-topic noise). Validate: scripts/validate_sources.py
# =============================================================================
news_sources:
  # -- international telecom trade press
  - {name: "Mobile World Live", type: rss, url: "https://www.mobileworldlive.com/feed/"}
  - {name: "Light Reading", type: rss, url: "https://www.lightreading.com/rss.xml"}
  - {name: "Fierce Network", type: rss, url: "https://www.fierce-network.com/rss/xml"}
  - {name: "Total Telecom", type: rss, url: "https://totaltele.com/feed/"}
  - {name: "RCR Wireless", type: rss, url: "https://www.rcrwireless.com/feed"}
  - {name: "Developing Telecoms", type: rss, url: "https://developingtelecoms.com/?format=feed&type=rss"}
  - {name: "Mobile Europe", type: rss, url: "https://www.mobileeurope.co.uk/feed/"}
  - {name: "Broadband TV News", type: rss, url: "https://www.broadbandtvnews.com/feed/"}
  - {name: "Telecoms Tech News", type: rss, url: "https://www.telecomstechnews.com/feed/"}
  - {name: "The Fast Mode", type: rss, url: "https://www.thefastmode.com/?format=feed&type=rss"}
  - {name: "Telecompetitor", type: rss, url: "https://www.telecompetitor.com/feed/"}
  - {name: "TelecomTalk", type: rss, url: "https://telecomtalk.info/feed/"}
  - {name: "ISPreview UK", type: rss, url: "https://www.ispreview.co.uk/index.php/feed"}
  - {name: "CommsRisk", type: rss, url: "https://commsrisk.com/feed/"}
  # -- Technology, AI & hardware trends relevant to a telco (not telco-specific
  #    press - vendors, chips, AI/network infrastructure). Tagged group: tech
  #    (see config.py Source.group / site/sources.html). Judged by the same
  #    analyst, see analyze/agents.py scoring guide for the "not a telco" case.
  #    Added 2026-07-28 - health (OK/EMPTY/FAIL) shows up per-source in the
  #    next run's report (data/reports/*.json -> run.sources); recheck there
  #    or with scripts/validate_sources.py if one looks off.
  - {name: "The Next Platform", type: rss, url: "https://www.nextplatform.com/feed/", group: tech}
  - {name: "IEEE Spectrum", type: rss, url: "https://spectrum.ieee.org/rss", group: tech}
  - {name: "IEEE Spectrum: Semiconductors", type: rss, url: "https://spectrum.ieee.org/feeds/topic/semiconductors.rss", group: tech}
  - {name: "VentureBeat AI", type: rss, url: "https://venturebeat.com/category/ai/feed/", group: tech}
