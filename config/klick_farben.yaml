# =============================================================================
# SKU-Farbe der Klick-Sätze (`collect/geraete/klickfarbe.py`)
# =============================================================================
# Die Klick-Karte klickt keine Farbe; ihre Sätze tragen die SKU „…-ohne-farbe“. Bei 1&1
# trägt der Bestand (data/state/geraete_tco.json) aber die Farbe, die der Adapter bis
# 20.11.2026 las: die erste Variante der Preiskarte `hwdVariantsHardwarePrices` (iPhone
# 17: NEBELBLAU), nicht die vorgewählte der Seite (LAVENDEL). Die Seite nennt diese
# Reihenfolge nirgends sichtbar; damit die Bündel-IDs fortlaufen (kein zweites Bündel
# neben dem Bestand), steht die Farbe je Gerät und Speicher hier fest.
#
# Herkunft: 1&1-Bündel im Zustand „neu“ in data/state/geraete_tco.json, Stand main
# c1738cfe (20.11.2026): je Gerät und Speicher die Farbe des jüngsten Bündels mit
# All-Net-Flat S (sonst des jüngsten überhaupt), ohne „ohne-farbe“. Ein Gerät, das
# hier fehlt (neu seit dem Adapter), behält „ohne-farbe“.
