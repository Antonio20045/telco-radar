# Schlüssel im Secret YOUTUBE_API_KEY). Der Video-Feed /feeds/videos.xml ist
# in der robots.txt gesperrt und bleibt draußen.
# kanal_id: belegt am 11.10.2026 über die öffentliche Kanalseite
