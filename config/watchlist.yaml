      - type: newsroom
        url: https://www.threemediacentre.co.uk/
        item_selector: a.card
    - name: Cosmote
      country: GR
      website: cosmote.gr
      aliases:
      - OTE Group
      - OTE
      sources:
      - type: official
        url: https://www.cosmote.gr/otegroupcompanysite/en/media/press-releases
        plan: 'Echter Imperva-Incapsula-Bot-Wall, kein Timing-/Consent-Problem: selbst reiner curl
          mit Browser-UA bekommt HTTP 200, aber der Body ist nur das
          _Incapsula_Resource-Challenge-Script (585 Byte, 0 <a>-Tags); mit Googlebot-UA sogar HTTP 404.
          Playwright mit Cookie-Consent-Klick + 8s Wartezeit liefert dasselbe Ergebnis
          (visid_incap_*/x-iinfo-Cookies vorhanden, Titel "404 Not Found"). JS wird nie ausgefuehrt,
          das ist eine serverseitige WAF-Entscheidung, kein Render-Problem. Nur mit
          Residential-Proxy oder expliziter Incapsula-Allowlist loesbar; bis dahin Referenz.'
  north_america:
    name: Nordamerika
    operators:
    - name: Verizon
      country: US
      website: verizon.com
      sources:
      # /about/news lieferte Eltern-Ratgeber ("A busy parent guide to students
      # using AI") und Nav-Links. Die newsroom-eigene JSON-API filtert auf
      # type=press_release. Der apikey ist der oeffentliche Client-Key aus der
      # Seite selbst, kein Geheimnis von uns - faellt er weg, schlaegt nur
      # diese eine Quelle fehl.
      - type: json_api
        url: https://www.verizon.com/about/nextgen/api/articles?limit=25&type=press_release
        headers:
          apikey: QOQZl9rcsiV1w70xBD635aDfwSyqubQcl5b2fs2jUEPGkaDA
        exclude_url_pattern: /about/news/es/
    - name: AT&T
      country: US
      website: att.com
      aliases:
      - ATT
      sources:
      # about.att.com ist vollstaendig hinter Akamai (403 mit Browser- UND
      # Bot-UA, auch fuer einzelne Story-URLs). Die IR-Meldungsliste auf der
      # Schwester-Subdomain ist frei zugaenglich und verlinkt genau die
      # about.att.com-Meldungen, an die wir sonst nicht herankommen.
      - type: newsroom
        url: https://investors.att.com/news-and-events/news-releases
        item_selector: tr[class*=yr-]
    - name: T-Mobile US
      country: US
      website: t-mobile.com
