    - name: Tele2
      country: SE
      website: tele2.com
      sources:
      # Ohne Selektor nahm der Parser den kompletten Kartentext (Label + Datum
      # + Teaser, oft ueber 300 Zeichen) als Titel und verwarf die Karte dann
      # wegen Ueberlaenge - es kamen 2 statt 5 Meldungen an.
