        url: https://www.tele2.com/media/press-releases
        item_selector: a.item
    - name: Elisa
      country: FI
      website: elisa.com
      sources:
      # Das JS-Widget auf der Seite hat maxResults:4 fest verdrahtet, deshalb
      # kamen pro Lauf nur 4 Karten an. Dies ist der Endpunkt dahinter.
      # WICHTIG: nur der Tag "press" - "national-press" schleppt Meldungen
      # FREMDER Firmen ein (daher "TenForce recognized for..." im Seen-Store).
      - type: json_api
        url: https://cms-rest-api-public.csf.elisa.fi/public/bulletins?tags=corporate.elisa.com:press&maxResults=30
        link_template: https://elisa.com/corporate/news-room/press-releases/press-release/{id}/
    - name: Three UK
      country: GB
      website: three.co.uk
      aliases:
      - CK Hutchison
      - Hutchison 3
      sources:
