# =============================================================================
# TELCO RADAR - Watchlist  (gepflegte Wahrheitsquelle, siehe Hinweis unten)
# =============================================================================
# Each operator has ONE primary source on its OWN official domain.
# Source types: rss | json_api | newsroom (static HTML) |
#   newsroom_js (headless/Playwright) | official (verified reference, not
#   crawled, carries a 'plan' explaining why + how to enable crawling).
# Third-party trade press lives separately in news_sources.yaml.
#
# DIESE DATEI IST DIE WAHRHEITSQUELLE - hier wird direkt editiert.
# scripts/build_sources.py hat sie urspruenglich erzeugt, kann aber die seither
# ergaenzten Felder (item_selector, link_template, timeout_seconds,
# allow_short_titles) gar nicht abbilden. Ein erneuter Lauf wuerde die
# Reparaturen mehrerer Sessions loeschen; das Skript sperrt sich deshalb selbst.
# =============================================================================

regions:
  europe:
    name: Europa
    operators:
    - name: Vodafone Group
      country: GB
      website: vodafone.com
      aliases:
      - Vodafone
      sources:
      - type: json_api
        url: https://www.vodafone.com/tools/urlproxy/advurlproxy.aspx?settingname=news-feed&categories=*&tags=*
    - name: Vodafone Deutschland
      country: DE
      website: vodafone.de
      sources:
      # Der Newsroom rendert die Kacheln clientseitig; der Render lieferte pro
      # Lauf ein Mediathek-Album und "Zu den Ansprechpartnern". Der Newsroom
      # hat einen RSS-Feed, der nirgends verlinkt ist.
      - type: rss
        url: https://newsroom.vodafone.de/rss
    # Vodafones britische Landesgesellschaft. Nach dem Zusammenschluss mit
    # Three UK der groesste Mobilfunkanbieter Grossbritanniens - und ein
    # eigener Absender: das News Centre meldet Endkundenangebote und
    # Netzausbau, die in der Konzernmitteilung von vodafone.com nie auftauchen.
    - name: Vodafone UK
      country: GB
      website: vodafone.co.uk
      aliases:
      - Vodafone UK
      - VodafoneThree
      sources:
      - type: rss
        url: https://www.vodafone.co.uk/newscentre/feed/
    # Britisches Gemeinschaftsunternehmen von Telefónica und Liberty Global -
    # in der Watchlist stehen bisher nur die beiden Muttergesellschaften. Der
    # eigene Newsroom fuehrt die O2- und Virgin-Media-Angebote, um die es im
    # britischen Wettbewerb tatsaechlich geht.
    - name: Virgin Media O2
      country: GB
      website: o2.co.uk
      aliases:
      # Bewusst OHNE das blosse "Virgin Media": das ist bereits ein Alias von
      # Liberty Global, und das Fachpresse-Tagging nimmt bei gleicher Laenge
      # den zuerst eingetragenen Betreiber. Der volle Name "Virgin Media O2"
      # gewinnt ohnehin, weil laengere Begriffe zuerst geprueft werden.
      - VMO2
      sources:
      - type: rss
        url: https://news.o2.co.uk/feed/
      # ---- Welle 1 (Breitensuche + Musteruebertragung), abgenommen 2026-08-04
      # mechanisch gefunden (finde_quellen.py, Musteruebertragung) und
      # anschliessend abgenommen. Abnahme: 25 Meldungen, 25 datiert, 5 im
      # Frischefenster.
      - type: "json_api"
        url: "https://news.virginmediao2.co.uk/wp-json/wp/v2/posts?per_page=25&_embed=1"
        herkunft: "Welle 1 (Breitensuche + Musteruebertragung)"
        abgenommen: "2026-08-04"
    - name: Deutsche Telekom
      country: DE
      website: telekom.com
      aliases:
      - Telekom
      - T-Systems
      - T-Mobile
      - Magenta
      sources:
      - type: newsroom
        url: https://www.telekom.com/de/medien/medieninformationen
        item_selector: div.content-wrapper
      # Investor-Relations-Feed. Er publiziert selten (5 Meldungen im Abruf,
      # neueste vom 13.05.2026) und liegt damit ausserhalb des Frischefensters -
      # aber genau das ist der im Auftrag vorgesehene Ausnahmefall: hier stehen
      # Konzernzahlen und Grossvorhaben ("Rheinmetall and Telekom Plan to
      # Develop a Drone Defense Shield"), die in den taeglichen
      # Medieninformationen untergehen oder gar nicht erscheinen.
      - type: rss
        url: https://www.telekom.com/service/rss/427676/feed.rss
    - name: O2 Telefónica Deutschland
      country: DE
      website: telefonica.de
      aliases:
      - O2 Telefonica
      - Telefónica Deutschland
      - O2
      sources:
      # category_id=11 ist "Products & Services" - eine schmale Rubrik mit rund
      # vier Beitraegen im Jahr; die Quelle sah deshalb seit Mai tot aus. Der
      # lebende Presse-Feed ist category_id=10 ("Company"). Beide zusammen
      # ergeben Konzern- UND Produktmeldungen; das Reihum-Verfahren verteilt
      # pro Betreiber, zwei Feeds verschaffen also keinen Volumenvorteil.
      - type: rss
        url: https://www.telefonica.de/o2/rss/news?category_id=10;pubdate=1
      - type: rss
        url: https://www.telefonica.de/o2/rss/news?category_id=11;pubdate=1
      # ---- Welle 1 (Breitensuche + Musteruebertragung), abgenommen 2026-08-04
      # mechanisch gefunden (finde_quellen.py, Musteruebertragung) und
      # anschliessend abgenommen. Abnahme: 20 Meldungen, 20 datiert, 7 im
      # Frischefenster.
      - type: "rss"
        url: "https://www.telefonica.de/o2/rss/news?group_id=62;pubdate=1"
        herkunft: "Welle 1 (Breitensuche + Musteruebertragung)"
        abgenommen: "2026-08-04"
