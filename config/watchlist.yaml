      # selben Eintrag bereits als Alias gefuehrt und liefert datierte
      # Meldungen - stellvertretend fuer die MEA-Praesenz.
      - type: newsroom
        url: https://orange.jo/en/corporate/media-center
        item_selector: div.card
        plan: 'Echte WAF-Ablehnung, kein Render-/Consent-Problem: sowohl curl als auch Playwright
          bekommen HTTP 200 mit dem Body "The requested URL was rejected. Please consult with
          your administrator... Your support ID is: ..." (246 Byte, F5/BIG-IP-Stil, mit 3
          verschiedenen User-Agents reproduziert). Kein Consent-Banner, kein JS - die WAF
          lehnt die URL selbst ab, bevor irgendetwas laedt. Nur mit Residential-Proxy oder
          expliziter WAF-Allowlist loesbar; bis dahin Referenz.'
