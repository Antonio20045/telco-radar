      # Netzinvestitionen - und teilweise frueher ("T-Mobile Delivers
      # Continued Strong Account Growth ...").
      - type: rss
        url: https://investor.t-mobile.com/rss/pressrelease.aspx?T=1
    - name: Comcast
      country: US
      website: comcast.com
      aliases:
      - Xfinity Mobile
      - Xfinity
      sources:
      # corporate.comcast.com/rss ist zu zwei Dritteln hyperlokales Marketing
      # ("Now Available in <Ort>"); der IR-Feed hat die Konzernmeldungen.
      - type: rss
        url: https://www.cmcsa.com/rss/news-releases.xml
    - name: Charter Communications
      country: US
      website: charter.com
      aliases:
      - Spectrum Mobile
      - Spectrum
      sources:
