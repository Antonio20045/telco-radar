# =============================================================================
# TELCO RADAR - Watchlist  (gepflegte Wahrheitsquelle, siehe Hinweis unten)
# =============================================================================
# Each operator has ONE primary source on its OWN official domain.
# Source types: rss | json_api | newsroom (static HTML) |
#   newsroom_js (headless/Playwright) | official (verified reference, not
#   crawled, carries a 'plan' explaining why + how to enable crawling).
# Third-party trade press lives separately in news_sources.yaml.
#
# DIESE DATEI IST DIE WAHRHEITSQUELLE - hier wird direkt editiert.
# scripts/build_sources.py hat sie urspruenglich erzeugt, kann aber die seither
# ergaenzten Felder (item_selector, link_template, timeout_seconds,
# allow_short_titles) gar nicht abbilden. Ein erneuter Lauf wuerde die
# Reparaturen mehrerer Sessions loeschen; das Skript sperrt sich deshalb selbst.
# =============================================================================

