        url: https://corporate.charter.com/page-data/sq/d/2336972469.json
      # Investor-Relations-Feed. Publiziert etwa monatlich (neueste Meldung im
      # Abruf vom 24.07.2026, also knapp ausserhalb des 8-Tage-Fensters) und
      # traegt die Finanz- und Strukturmeldungen - Quartalszahlen,
      # Anleihetausch -, die der Gatsby-Newsroom nicht fuehrt.
      - type: rss
        url: https://ir.charter.com/rss/news-releases.xml
    - name: DISH Wireless
      country: US
      website: dish.com
      aliases:
      - Boost Mobile
      - EchoStar
      sources:
      # Der DISH-Brand-Feed ist technisch in Ordnung, seine juengste Meldung
      # aber vom 05.05.2026: nach der Uebernahme publiziert der Konzern unter
      # EchoStar.
      - type: rss
        url: https://ir.echostar.com/rss/news-releases.xml
    - name: UScellular
      country: US
      website: uscellular.com
      aliases:
      - U.S. Cellular
      sources:
      - type: official
        url: https://investors.uscellular.com/news/default.aspx
        plan: 'Kein Crawling-Problem, sondern ein Fakt: T-Mobile hat die UScellular-Mobilfunksparte
          uebernommen (Deal abgeschlossen 2025). investors.uscellular.com liefert per curl
          Cloudflare-403; mit Playwright wird die Challenge zwar bestanden, aber die Seite leitet
          clientseitig komplett auf investor.t-mobile.com weiter - es gibt keinen eigenstaendigen
          UScellular-Newsroom mehr. Vodafone-relevante Meldungen zu diesem Konzern laufen inzwischen
          ueber den (reparierten) T-Mobile-US-Eintrag. Referenz, kein technisches Fix noetig.'
    - name: Bell Canada
      country: CA
      website: bce.ca
      aliases:
      - Bell
      - BCE
      sources:
      # bce.ca liefert nur Next.js-RSC-Flight-Chunks, im DOM stehen bloss
      # Navigations- und IR-Links (daher "Media contacts"/"Media library" im
      # Seen-Store). Newswire ist BCEs offizieller Verbreitungsweg - wie bei
      # Millicom und Telia eine bewusste Ausnahme vom Grundsatz eigene Domain.
      - type: newsroom
        url: https://www.newswire.ca/news/bce-inc./
        item_selector: .newsCards
    - name: Rogers
      country: CA
      website: rogers.com
      sources:
      - type: rss
        url: https://about.rogers.com/feed
    - name: Telus
      country: CA
      website: telus.com
      sources:
      - type: newsroom_js
        url: https://www.telus.com/en/about/newsroom
      # VERWORFEN, nicht vergessen: https://www.newswire.ca/news/telus-communications-inc/
      # bestand den Abnahme-Check im Einzelabruf mit 23 von 23 datierten
      # Meldungen - im Gesamtlauf und bei zwei Wiederholungen lieferte
      # dieselbe URL dann 30 Meldungen mit NULL Datum. newswire.ca liefert das
      # Kartenlayout offenbar wechselnd mit und ohne Zeitstempel aus. Eine
      # undatierte Meldung sortiert ans Ende und wird faktisch nie gelesen,
      # also ist eine Quelle, die das bei jedem zweiten Abruf tut, unbrauchbar.
      # Dasselbe betrifft die bestehende Bell-Canada-Quelle (siehe dort).
