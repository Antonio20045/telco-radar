    - name: TIM
      country: IT
      website: gruppotim.it
      aliases:
      - Telecom Italia
      - Gruppo TIM
      sources:
      - type: official
        url: https://www.gruppotim.it/en/press-archive.html
        plan: 'Erneut mit echtem Internetzugang und vollem Playwright-Render (45s, networkidle,
          Cookie-Consent-Klick, Scroll-Trigger) geprueft: identisches DOM zur statischen
          curl-Antwort (316541 Zeichen, nur 30 Nav-Links, 0 Presse-Links). 0 XHR/fetch/JSON-Responses
          waehrend des gesamten Renders - die Seite laedt nur ein reCAPTCHA-Script, nie einen
          Daten-Call. 46 Feed-Kandidaten von rescue_sources.py probiert, keiner funktioniert;
          robots.txt-Alternative /en/press/press-releases.html redirectet zurueck auf dieselbe
          leere Seite; /en/sitemap.xml und /it.sitemap.xml beide 404. Kein Bot-Block (curl bekommt
          200), die Seite ist einfach clientseitig kaputt/leer. Bis auf Weiteres kein Ansatz
          gefunden; Referenz + Fachpresse.'
