  - schluessel: 1und1
    name: 1&1
    # Tarifdetail-Seiten je Tarif mit Smartphone (Einstiege `kind: klick` in
    # config/geraete_quellen.yaml, wörtlich die data-iframe-Adressen der
    # Tarifübersichten vom 29.09.2026, ohne Unlimited XS „Ohne Handy“). Gelesen
    # wird nur der Anschlusspreis je Tarif-Slug und Tarifname
    # (`klickanschluss.anschluss_saetze`); er kommt auf jeden Produktseiten-Satz mit
    # demselben Tarif (Pitch 2, Schnitt 3; seit 20.11.2026 über den Namen der Kachel,
    # Unlimited XL heißt dort `…-xl-mvl`, hier `…-xl-ovl`).
    uebersichten:
      - https://mobile.1und1.de/details-all-net-flat-preisliste?chosenTariff=tariff-anf-s-mvl&chosenNet=1u1&lightbox=true&bk=false
      - https://mobile.1und1.de/details-all-net-flat-preisliste?chosenTariff=tariff-anf-m-mvl&chosenNet=1u1&lightbox=true&bk=false
      - https://mobile.1und1.de/details-all-net-flat-preisliste?chosenTariff=tariff-anf-l-mvl&chosenNet=1u1&lightbox=true&bk=false
      - https://mobile.1und1.de/details-all-net-flat-preisliste?chosenTariff=tariff-anf-xxl-unlimited-s-mvl&chosenNet=1u1&lightbox=true&bk=false
      - https://mobile.1und1.de/details-all-net-flat-preisliste?chosenTariff=tariff-anf-xxl-unlimited-m-mvl&chosenNet=1u1&lightbox=true&bk=false
      - https://mobile.1und1.de/details-all-net-flat-preisliste?chosenTariff=tariff-anf-xxl-unlimited-l-mvl&chosenNet=1u1&lightbox=true&bk=false
      - https://mobile.1und1.de/details-all-net-flat-preisliste?chosenTariff=tariff-anf-xxl-unlimited-xl-ovl&chosenNet=1u1&lightbox=true&bk=false
      # Die Geräteübersicht: je Kachel der Produktlink (`klickraster.liste_saetze`),
      # daraus die Seiten beider 1&1-Einträge (`seiten_aus_uebersicht`, ab dem Lauf
      # danach). Die sieben Geräteraster (smartphones-all-net-flat-s …) stehen seit
      # 20.11.2026 nicht mehr hier: sie lesen sich seit dem Shop-Umbau nicht mehr, und
      # jede Produktseite liest alle sieben Tarife selbst (Tarifauswahl im Bestellweg).
      - https://mobile.1und1.de/smartphones
    # Seiten (seit 20.11.2026) aus den Kacheln der Geräteübersicht des letzten
    # abgelegten Laufs (data/state/klick/1und1.json, `klickliste_kacheln`): je Gerät
    # der Produktlink wörtlich, neue Modelle kommen ohne Handarbeit (Xiaomi 18 Pro).
    # Fehlt die Übersicht, gilt ihr Vorrat (7 Tage), ohne jede Kachel die Seiten des
    # letzten Laufs. Zwei Einträge (je ein Matrix-Job): 41 Seiten × 88–133 s
    # (Lokallauf 20.11.2026) sind bis 91 min; geteilt je ~45 min, Luft für Ausreißer.
    seiten_aus_uebersicht: 1und1

