# =============================================================================
# TELCO RADAR - Klick-Tageslauf (Datenkonzept Geräteradar §8 „Betrieb“)
# =============================================================================
# Je Anbieter die Produktseiten, die `scripts/klick_tageslauf.py` täglich mit der
# Klick-Karte config/klickkarten/<schluessel>.yaml durchklickt (Matrix-Job je
# Anbieter im eigenen Workflow klick.yml; Ergebnisse in data/state/klick/).
# Format und Prüfung wie config/klick_erkundung.yaml (`klickziele.lade_ziele`),
# aber ohne Grenze der Seitenzahl; `weiter` gibt es hier nicht.
#
# o2 STEHT SEIT 21.11.2026 NICHT MEHR HIER: o2 misst nur der Adapter (`o2_katalog`,
# alle Geräte, Speicher, Laufzeiten und Tarife per HTTP). Der Klick-Lauf las am
# 21.11.2026 in 24.700 s Jobzeit 523 Kombinationen, davon keine, die der Adapter nicht
# hat oder anders nennt, ausgenommen eine erneuerte Seite, die er als Neuware las
# (docs/geraete/ist-zustand-preise.md). Die letzten o2-Einträge liegen als Fixture in
# tests/fixtures/klickliste/o2_tageslauf_20261121.yaml; die Karten o2 und o2-tarife
# bleiben für die Erkundung (config/klick_erkundung.yaml).
#
# congstar STEHT SEIT 21.11.2026 EBENFALLS NICHT MEHR HIER: congstar misst nur der
# Adapter (`congstar_next`, die ganze Tarifmatrix je Produktseite per HTTP, 920 Sätze
# in rund 90 s). Der Klick-Lauf las am 21.11.2026 in 2150 s 712 Kombinationen, jede mit
# Adapter-Gegenstück und denselben Werten (docs/geraete/ist-zustand-preise.md). Der
# letzte Eintrag liegt als Fixture in tests/fixtures/klickliste/congstar_tageslauf_20261121.yaml;
# die Karte congstar bleibt für die Erkundung.
#
# DIE ADRESSEN SIND NICHT ZUSAMMENGESETZT. Jede steht wörtlich als `quelle_url`
# im Bestand des Geräteradars (Stand 07.10.2026): Telekom aus
# data/state/geraete_tco.json (eine `tariffId` je Tarif), 1&1 (und bis 21.11.2026 congstar) aus
# data/state/geraete_db.json, dazu
# die Seiten der Klick-Erkundung. Telekom zeigt je Seite nur einen Tarif
# (Karte: der Tarif kommt aus der Startadresse); jede Tarifstufe ist darum eine
# eigene Seite. Telekom steht seit 20.11.2026 nicht mehr von Hand hier
# (`seiten_aus_uebersicht`): jede Seite ist der Produktlink einer Kachel der
# Übersichten, wörtlich.
#
# Neue Modelle: was hier fehlt, leitet `klickliste_auto` aus Katalog (auch den
# Auto-Einträgen) und Bestand ab: je Anbieter ein Ziel `<Schlüssel>-auto` (Telefone von
# Apple, Samsung Galaxy S, Google Pixel) mit höchstens 8 Plätzen (Gerät × Speicherstufe).
# Ein Platz ist eine Seite, bei Telekom aber eine je MagentaMobil-Tarif (die Seite zeigt
# nur den Tarif ihrer Startadresse), also bis zu 5; acht Plätze wären 40 Seiten. Eine
# Telekom-Seite braucht bis zu 330 s, ein Job rund 10.258 s: das passt nicht immer ganz,
# darum gibt es keine Seitengrenze in der Liste. Die Rotation (unten) trägt das Budget,
# jede Seite kommt höchstens alle 2 Tage dran. Ein Platz fällt nie aus der Liste, weil
# er nicht gelesen wurde: auch ein veraltetes Bündel liefert seine Adresse. Hier nichts
# eintragen. Für einen Anbieter mit `seiten_aus_uebersicht` leitet `klickliste_auto`
# nichts ab, solange die Kacheln Seiten liefern.
#
# Rotation: nie gelesene Seiten zuerst, dann die am längsten nicht gelesenen
# (data/state/klick/klick_stand.json). Reicht das Zeitbudget nicht für alle Seiten
# eines Tages, liest der nächste Tag die übrigen; jede Seite soll jeden Tag
# gelesen sein (`ueberfaellig` nach einem Tag ohne Lesung, in der Ergebnisdatei).
#
# Aufteilen (Antonio 11.10.2026: alle Geräte jeden Tag): ein 180-min-Job liest rund
# 20 Telekom- oder Vodafone-Seiten (Telekom ~500 s je Seite, Vodafone 5–9 min). Ein
# großer Anbieter steht darum in mehreren Einträgen mit eigenen Seiten, gleichem
# `name` und `karte: <schluessel>` des ersten Eintrags; jeder Eintrag ist ein
# eigener Matrix-Job, der Lesestand gilt je `name`. Übersichten nur im ersten, außer
# den 1&1-Tarifdetail-Seiten (Anschlusspreis): die liest jeder 1&1-Eintrag selbst.
#
# `seitenabstand_sekunden` (Vorgabe 0): Pause zwischen zwei Seiten eines Anbieters,
# ruhiges Tempo als Normalfall, keine Anpassung an eine Sperre (Pitch 1, 08.10.2026).
#
# `uebersichten` (Telekom): Smartphone-Übersicht je Tarif, wörtlich ein Einstieg
# aus config/geraete_quellen.yaml; gelesen vor den Produktseiten, im selben Zeitbudget
# (`klickuebersicht`), samt Folgeseiten über ihren gelesenen Folgelink. Alle fünf
# MagentaMobil-Tarife, M zuerst (Pitch 4, Schnitt 3). 1&1: Tarifdetail-Seiten mit
# dem Anschlusspreis je Tarif, eigene Lesart (`klickuebersicht.LESARTEN`).
#
# Vodafone: die Produktseite wählt den Tarif nicht; die Karte klickt „Zur
# Tarifauswahl“ und dort jeden Tarif (`weiter.klicken: tarif`, seit 242d23c3).
# Lücke `tarif_unbekannt` bleibt nur, wenn die Tarifauswahl keinen Tarif liefert.

