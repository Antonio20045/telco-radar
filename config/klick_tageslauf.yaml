# =============================================================================
# TELCO RADAR - Klick-Tageslauf (Datenkonzept Geräteradar §8 „Betrieb“)
# =============================================================================
# Je Anbieter die Produktseiten, die `scripts/klick_tageslauf.py` täglich mit der
# Klick-Karte config/klickkarten/<schluessel>.yaml durchklickt (Matrix-Job je
# Anbieter im eigenen Workflow klick.yml; Ergebnisse in data/state/klick/).
# Format und Prüfung wie config/klick_erkundung.yaml (`klickziele.lade_ziele`),
# aber ohne Grenze der Seitenzahl; `weiter` gibt es hier nicht.
#
# DIE ADRESSEN SIND NICHT ZUSAMMENGESETZT. Jede steht wörtlich als `quelle_url`
# im Bestand des Geräteradars (Stand 07.10.2026): o2 und Telekom aus
# data/state/geraete_tco.json (Bündelansicht mit `ohne-tarif=nein` bzw. einer
# `tariffId` je Tarif), 1&1 und congstar aus data/state/geraete_db.json, dazu
# die Seiten der Klick-Erkundung. Telekom zeigt je Seite nur einen Tarif
# (Karte: der Tarif kommt aus der Startadresse); jede Tarifstufe ist darum eine
# eigene Seite.
#
# Rotation: nie gelesene Seiten zuerst, dann die am längsten nicht gelesenen
# (data/state/klick/klick_stand.json). Reicht das Zeitbudget nicht für alle Seiten
# eines Tages, liest der nächste Tag die übrigen; jede Seite soll spätestens
# alle drei Tage gelesen sein (`ueberfaellig` in der Ergebnisdatei).
#
# Vodafone: die Produktseite wählt den Tarif nicht (Karte: tarif fest
# „unbekannt“); erfasste Werte bleiben darum ohne Bündel und zählen als Lücke
# `tarif_unbekannt`, bis die Karte die Tarifauswahl liest.

